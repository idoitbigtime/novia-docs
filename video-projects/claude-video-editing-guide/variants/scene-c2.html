/* Design tokens. Safe area for text: x 140..940, y 300..1570 (1080x1920). */
:root {
  --bg: #06060b;
  --ink: #f5f2ea;
  --ink2: #dcd9e6;
  --muted: #9c99ae;
  --acc: #ff453a;
  --acc-soft: #ff8a80;
  --line: #c9c2ff;
  --line-glow: rgba(201, 194, 255, 0.55);
  --panel: rgba(18, 17, 34, 0.96);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
#root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--bg); font-family: "Rubik", sans-serif; }
.stagewrap { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; overflow: hidden; }

/* ---------- background ---------- */
#bg { position: absolute; inset: 0; overflow: hidden; background: linear-gradient(180deg, #08080f 0%, #0b0a17 55%, #07070d 100%); }
#bg .glow { position: absolute; border-radius: 50%; }
#bg .g1 { width: 1500px; height: 1500px; left: -420px; top: -380px; background: radial-gradient(circle, rgba(124, 92, 255, 0.20) 0%, rgba(124, 92, 255, 0.07) 38%, rgba(124, 92, 255, 0) 66%); }
#bg .g2 { width: 1400px; height: 1400px; left: 260px; top: 980px; background: radial-gradient(circle, rgba(255, 69, 58, 0.15) 0%, rgba(255, 69, 58, 0.05) 40%, rgba(255, 69, 58, 0) 66%); }
#bg .grain { position: absolute; inset: 0; background-image: url("assets/grain.png"); background-size: 256px 256px; opacity: 0.07; mix-blend-mode: screen; }
#bg .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%); }

#cam { position: absolute; inset: 0; transform-origin: 540px 960px; }
.scene { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
.scam { position: absolute; inset: 0; }

/* ---------- header (chapter indicator) ---------- */
.hdr { position: absolute; top: 300px; left: 140px; width: 800px; height: 46px; display: flex; justify-content: space-between; align-items: center; direction: rtl; opacity: 0; }
.hdr-ch { font: 500 30px/1 "Rubik"; color: #b3b0c4; }
.hdr-num { font: 600 28px/1 "IBM Plex Mono"; color: var(--acc); border: 1.5px solid rgba(255, 69, 58, 0.55); border-radius: 10px; padding: 7px 12px 6px; }

/* ---------- kinetic text ---------- */
.kin { direction: rtl; text-align: right; }
.w { display: inline-block; white-space: pre; opacity: 0; }
.isl { unicode-bidi: isolate; }
.accgrp { position: relative; display: inline-block; white-space: nowrap; color: var(--acc); font-weight: 800; }
.accgrp .ul { position: absolute; right: 0; left: 0; bottom: -0.04em; height: 5px; border-radius: 3px; background: var(--acc); transform-origin: 100% 50%; display: block; opacity: 0; }
.strgrp { display: inline-block; white-space: nowrap; font-weight: 800; color: var(--ink); }

/* ---------- topic layout ---------- */
.main { position: absolute; top: 380px; left: 180px; width: 720px; display: flex; flex-direction: column; gap: 18px; direction: rtl; }
.ttl { font: 800 62px/1.16 "Rubik"; color: var(--ink); letter-spacing: -0.005em; }
.exp { font: 400 38px/1.45 "Rubik"; color: var(--ink2); }
.exp .accgrp { font-weight: 800; }
.stage { position: absolute; left: 140px; top: 760px; width: 800px; height: 800px; opacity: 0; }
.simtag { position: absolute; top: calc(50% - 350px); right: 0; display: flex; align-items: center; gap: 12px; font: 600 30px/1 "Rubik"; color: #cfcbe0; direction: rtl; opacity: 0; }
.simtag i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); box-shadow: 0 0 10px var(--line-glow); display: block; }
.simwrap { position: absolute; left: 0; right: 0; top: calc(50% - 300px); height: 600px; }

/* fact overlay inside the stage */
.factbox { position: absolute; left: 140px; width: 800px; top: 0; height: 1920px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 30px; direction: rtl; }
.pill { display: inline-block; background: #ffffff; color: #0b0b0b; font: 800 44px/1 "Rubik"; padding: 28px 42px 28px; border-radius: 20px; direction: rtl; opacity: 0; white-space: nowrap; }
.factline { font: 500 34px/1.42 "Rubik"; color: var(--ink); text-align: center; max-width: 780px; }
.metaline { font: 400 30px/1.4 "Rubik"; color: #b8b4cc; text-align: center; max-width: 760px; }
.metaline .w, .factline .w { opacity: 0; }

/* ---------- prompt card ---------- */
.pcard { position: absolute; left: 150px; top: 366px; width: 780px; height: 1204px; border-radius: 30px; background: linear-gradient(180deg, rgba(24, 22, 44, 0.97), rgba(13, 12, 26, 0.97)); border: 1.5px solid rgba(201, 194, 255, 0.20); box-shadow: 0 40px 90px rgba(0, 0, 0, 0.55); overflow: hidden; opacity: 0; }
.pc-head { position: absolute; top: 0; left: 0; right: 0; height: 100px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; direction: rtl; border-bottom: 1px solid rgba(201, 194, 255, 0.12); }
.pc-title { font: 700 36px/1 "Rubik"; color: var(--ink); display: flex; align-items: center; gap: 16px; }
.pc-title i { width: 14px; height: 14px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 14px rgba(255, 69, 58, 0.9); display: block; }
.pc-num { font: 600 27px/1 "IBM Plex Mono"; color: var(--muted); direction: ltr; }
.pc-num b { color: var(--ink); font-weight: 600; }
.pc-tabs { position: absolute; top: 100px; left: 0; right: 0; height: 68px; display: flex; gap: 30px; align-items: center; padding: 0 30px; direction: rtl; border-bottom: 1px solid rgba(201, 194, 255, 0.08); }
.tab { position: relative; font: 500 26px/1 "Rubik"; color: var(--muted); padding: 6px 0 12px; }
.tab .tul { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 2px; background: var(--acc); display: block; opacity: 0; }
.tab .ton { position: absolute; inset: 6px 0 12px 0; color: var(--ink); opacity: 0; white-space: nowrap; }
.pvp { position: absolute; top: 186px; bottom: 26px; left: 30px; right: 30px; overflow: hidden;
  -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0px, #000 48px, #000 calc(100% - 64px), rgba(0,0,0,0) 100%);
  mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0px, #000 48px, #000 calc(100% - 64px), rgba(0,0,0,0) 100%); }
.pct { position: absolute; top: 40px; left: 0; right: 0; direction: rtl; font: 400 30px/1.46 "Rubik"; color: #e7e4f1; white-space: normal; padding-bottom: 120px; }
.pl { position: relative; z-index: 0; isolation: isolate; padding: 0 12px; white-space: pre-wrap; }
.pl-empty { height: 22px; }
.ptag { color: rgba(157, 144, 224, 0.85); font-weight: 600; }
.code { font-family: "IBM Plex Mono", "IBM Plex Sans Hebrew", monospace; font-size: 25px; color: #d8d4ea; overflow-wrap: anywhere; }
.code .bt { color: #6f6b86; }
.hlbg { position: absolute; z-index: -1; top: 2px; bottom: 2px; left: -4px; right: -4px; background: rgba(229, 72, 77, 0.17); border-right: 4px solid #e5484d; border-radius: 10px; opacity: 0; display: block; }

/* ---------- tip ---------- */
.tipwrap { position: absolute; left: 140px; width: 800px; top: 0; height: 1920px; display: flex; align-items: center; justify-content: center; }
.tipcard { width: 800px; padding: 44px 48px 50px; border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.12); background: rgba(18, 17, 34, 0.88); box-shadow: 0 0 40px rgba(140, 120, 255, 0.15); direction: rtl; text-align: right; opacity: 0; }

.tip-text { font: 600 46px/1.38 "Rubik"; color: var(--ink); }

/* ---------- chapter card ---------- */
.chap { position: absolute; inset: 0; }
.ch-k { position: absolute; top: 470px; left: 140px; width: 800px; text-align: center; font: 500 36px/1 "Rubik"; color: var(--muted); letter-spacing: 0.02em; opacity: 0; }
.ch-n { position: absolute; top: 520px; left: 140px; width: 800px; text-align: center; font: 900 300px/1 "Rubik"; color: rgba(255, 69, 58, 0.06); -webkit-text-stroke: 3px var(--acc); text-shadow: 0 0 40px rgba(255, 69, 58, 0.35); opacity: 0; }
.ch-title { position: absolute; top: 880px; left: 120px; width: 840px; text-align: center; font: 800 78px/1.15 "Rubik"; color: var(--ink); }
.ch-line { position: absolute; top: 1000px; left: 340px; width: 400px; height: 3px; border-radius: 2px; background: linear-gradient(90deg, rgba(201,194,255,0), #c9c2ff 30%, #c9c2ff 70%, rgba(201,194,255,0)); box-shadow: 0 0 14px rgba(201, 194, 255, 0.6); transform-origin: 100% 50%; display: block; opacity: 0; }
.ch-sub { position: absolute; top: 1040px; left: 150px; width: 780px; text-align: center; font: 400 40px/1.45 "Rubik"; color: var(--ink2); }
.ch-tag { position: absolute; top: 1330px; left: 170px; width: 740px; text-align: center; font: 500 30px/1.45 "Rubik"; color: var(--muted); }
.ch-dots { position: absolute; top: 1500px; left: 140px; width: 800px; display: flex; justify-content: center; gap: 22px; opacity: 0; }
.ch-dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(201, 194, 255, 0.28); display: block; }
.ch-dot.on { background: var(--acc); box-shadow: 0 0 14px rgba(255, 69, 58, 0.9); transform: scale(1.35); }

/* 2.2 Hebrew captions in two styles: transcription fixes + white pill + kinetic */
.sim22 .s22-phone { position: absolute; left: 430px; top: 0; width: 370px; height: 600px; border-radius: 40px; border: 2px solid rgba(201, 194, 255, 0.6); box-shadow: 0 0 26px rgba(201, 194, 255, 0.22); background: #09090f; }
.sim22 .s22-screen { position: absolute; inset: 9px; border-radius: 31px; overflow: hidden; background: linear-gradient(180deg, #221d47 0%, #171433 55%, #0e0c1f 100%); }
.sim22 .s22-lamp { position: absolute; left: -60px; top: -40px; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, rgba(169, 147, 255, 0.22), rgba(169, 147, 255, 0) 70%); }
.sim22 .s22-win { position: absolute; right: 22px; top: 54px; width: 86px; height: 124px; border: 2px solid rgba(201, 194, 255, 0.2); border-radius: 6px; }

.sim22 .s22-person { position: absolute; left: -70px; top: -13px; width: 492px; height: 600px; }
.sim22 .s22-caps { position: absolute; left: 14px; right: 14px; top: 404px; display: grid; place-items: center; }
.sim22 .s22-cap { grid-area: 1 / 1; display: grid; place-items: center; opacity: 0; font: 800 38px/1.2 "Rubik"; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6); white-space: nowrap; }
.sim22 .s22-capbad, .sim22 .s22-capgood { grid-area: 1 / 1; position: relative; }
.sim22 .s22-capbad { color: #ff6b61; }

.sim22 .s22-kinrow { position: absolute; left: 16px; right: 16px; top: 404px; text-align: center; font: 800 38px/1.25 "Rubik"; color: #ffffff; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6); }
.sim22 .s22-kinrow .accgrp { color: #ff5a4f; font-weight: 900; }
.sim22 .s22-fixes { position: absolute; left: 0; top: 70px; width: 392px; }
.sim22 .s22-fix { display: flex; direction: rtl; align-items: center; gap: 16px; height: 76px; margin-bottom: 14px; }

.sim22 .s22-strike { position: absolute; left: -5px; right: -5px; top: 52%; height: 4px; border-radius: 2px; background: #ff6b61; display: block; opacity: 0; transform-origin: 100% 50%; }
.sim22 .s22-arrow { width: 46px; height: 22px; opacity: 0; flex: none; }
.sim22 .s22-good { font: 700 40px/1 "Rubik"; color: var(--ink); opacity: 0; white-space: nowrap; }
.sim22 .s22-label { position: absolute; left: 0; width: 392px; display: flex; direction: rtl; align-items: center; gap: 14px; font: 600 36px/1 "Rubik"; color: var(--ink); opacity: 0; }
.sim22 .s22-label i { width: 14px; height: 14px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 12px rgba(255, 69, 58, 0.8); display: block; flex: none; }
.sim22 .s22-l1 { top: 400px; }
.sim22 .s22-l2 { top: 480px; }

<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5.160" data-fps="30" data-width="1080" data-height="1920">
<div class="stagewrap" style="transform: scale(1.0);">
<div id="bg"><div class="glow g1"></div><div class="glow g2"></div><div class="grain"></div><div class="vig"></div></div>
<div id="cam">
<div id="sc-c2" class="clip scene" data-start="0.000" data-duration="5.160" data-track-index="1"><div class="chap">
<div class="ch-k" dir="rtl">פרק</div>
<div class="ch-n" dir="ltr">2</div>
<h2 class="ch-title kin" dir="rtl"><span class="w" dir="rtl" data-t="0.450">עריכה</span> <span class="w" dir="rtl" data-t="0.610">בסיסית</span></h2>
<i class="ch-line"></i>
<p class="ch-sub kin" dir="rtl"><span class="w" dir="rtl" data-t="1.120">חיתוך,</span> <span class="w" dir="rtl" data-t="1.280">כתוביות,</span> <span class="w" dir="rtl" data-t="1.440">מעבר</span> <span class="w" dir="rtl" data-t="1.600">לאורך,</span> <span class="w" dir="rtl" data-t="1.760">צבע</span> <span class="w" dir="rtl" data-t="1.920">וסאונד:</span> <span class="w" dir="rtl" data-t="2.330">את</span> <span class="w" dir="rtl" data-t="2.490">כל</span> <span class="w" dir="rtl" data-t="2.650">העבודה</span> <span class="w" dir="rtl" data-t="2.810">השחורה</span> <span class="w" dir="rtl" data-t="2.970">מעבירים</span> <span class="w" dir="rtl" data-t="3.130">לקלוד,</span> <span class="w" dir="rtl" data-t="3.290">ורק</span> <span class="w" dir="rtl" data-t="3.450">מאשרים.</span></p>

<div class="ch-dots" dir="rtl"><i class="ch-dot"></i><i class="ch-dot on"></i><i class="ch-dot"></i><i class="ch-dot"></i><i class="ch-dot"></i><i class="ch-dot"></i><i class="ch-dot"></i><i class="ch-dot"></i></div>
</div></div>
</div>
</div>
</div>
<script>
/* Runtime helpers that add tweens to one paused GSAP master timeline.
   Every tween is a fromTo with explicit values and immediateRender:false (CSS holds the
   initial state), so any frame can be rendered by seeking to it in any order.
   Each scene has its own camera (.scam); the chapter header sits outside it and never zooms. */
(function () {
  const E = (window.ENG = {});
  // The guide's no-overshoot spring (prompts 9 and 13).
  const SPRING = (p) => (1 - (1 + 7 * p) * Math.exp(-7 * p)) / (1 - 8 * Math.exp(-7));
  E.SPRING = SPRING;
  E.debug = (window.__ENG_DEBUG = { scenes: {} });
  E.q = (s, r) => (r || document).querySelector(s);
  E.qa = (s, r) => Array.from((r || document).querySelectorAll(s));
  const NI = { immediateRender: false };
  E.NI = NI;
  const A = (o) => Object.assign(o, NI);
  E.A = A;
  /* Deterministic PRNG (mulberry32): never use Math.random in scenes. */
  E.rand = function (seed) {
    let a = seed >>> 0;
    return function () { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };
  /* Offsets ignore transforms: measure layout before any tween moves things. */
  E.off = function (el, top) {
    let x = 0, y = 0, e = el;
    while (e && e !== top) { x += e.offsetLeft; y += e.offsetTop; e = e.offsetParent; }
    return { x, y };
  };
  E.center = function (el, top) {
    const o = E.off(el, top);
    return { x: o.x + el.offsetWidth / 2, y: o.y + el.offsetHeight / 2 };
  };

  E.fadeIn = function (tl, el, t, d, dy) {
    if (!el) return;
    tl.fromTo(el, { opacity: 0, y: dy || 0 }, A({ opacity: 1, y: 0, duration: d || 0.5, ease: SPRING }), t);
  };
  E.fadeOut = function (tl, el, t, d, dy, from) {
    if (!el) return;
    tl.fromTo(el, { opacity: from == null ? 1 : from, y: 0 }, A({ opacity: 0, y: dy || 0, duration: d || 0.3, ease: "power2.in" }), t);
  };
  E.dim = function (tl, el, t, to, from, d) {
    if (!el) return;
    tl.fromTo(el, { opacity: from == null ? 1 : from }, A({ opacity: to, duration: d || 0.35, ease: "power2.out" }), t);
  };

  /* Kinetic words: each word enters on its time with a spring (slightly above final size,
     then settles) and unblurs. Blur is animated separately from the spring and ends on
     0px then "none", so it never goes negative (prompt 2's pitfall). */
  E.kin = function (tl, root, S, o) {
    if (!root) return;
    o = o || {};
    const dy = o.dy == null ? 18 : o.dy;
    E.qa(".w", root).forEach((w) => {
      const t = S + parseFloat(w.dataset.t || "0");
      tl.fromTo(w, { opacity: 0 }, A({ opacity: 1, duration: 0.22, ease: "power2.out" }), t);
      tl.fromTo(w, { y: dy, scale: 0.82 }, A({ y: 0, scale: 1, duration: 0.62, ease: "back.out(2.1)" }), t);
      tl.fromTo(w, { filter: "blur(9px)" }, A({ filter: "blur(0px)", duration: 0.3, ease: "power2.out" }), t);
      tl.set(w, { filter: "none" }, t + 0.31);
    });
    E.qa(".ul", root).forEach((u) => {
      const t = S + parseFloat(u.dataset.t || "0");
      tl.fromTo(u, { opacity: 1, scaleX: 0 }, A({ opacity: 1, scaleX: 1, duration: 0.5, ease: "power3.inOut" }), t);
    });
  };

  /* White pill caption: switches in one frame, no animation (prompt 2). */
  E.pill = function (tl, el, tin, tout) {
    tl.set(el, { opacity: 1 }, tin);
    if (tout != null) tl.set(el, { opacity: 0 }, tout);
  };

  /* Bouncy zoom on the scene camera with the guide's spring. The focal x is clamped so a
     content column [colL, colR] scaled by (1+amt) stays inside the safe area x 140..940. */
  E.zoom = function (tl, ctx, cx, cy, t, amt, tBack, backDur, col) {
    const s = 1 + amt;
    const L = col ? col[0] : 180, R = col ? col[1] : 900;
    const lo = (s * R - 940) / (s - 1), hi = (s * L - 140) / (s - 1);
    if (lo <= hi) cx = Math.min(hi, Math.max(lo, cx));
    else cx = (L + R) / 2;
    tl.set(ctx.cam, { transformOrigin: cx.toFixed(1) + "px " + cy.toFixed(1) + "px" }, t);
    tl.fromTo(ctx.cam, { scale: 1 }, A({ scale: s, duration: 0.8, ease: SPRING }), t);
    if (tBack != null) {
      if (backDur) tl.fromTo(ctx.cam, { scale: s }, A({ scale: 1, duration: backDur, ease: "power2.inOut" }), tBack);
      else tl.set(ctx.cam, { scale: 1 }, tBack);
    }
    E.debug.zooms = (E.debug.zooms || []).concat([{ t: +t.toFixed(3), s, cx: Math.round(cx), cy: Math.round(cy) }]);
  };
  E.zoomOn = function (tl, ctx, el, t, amt, tBack, backDur, col) {
    const c = E.center(el, ctx.scene);
    E.zoom(tl, ctx, c.x, c.y, t, amt, tBack, backDur, col);
  };

  /* Prompt card: the full verbatim text, paged (static pages and short slides, so any
     paused frame is readable); holds on highlighted lines (highlight bar + bouncy zoom,
     the bar fades when the hold ends); section tabs follow the page; exits at t1. */
  E.prompt = function (tl, ctx, card, t0, t1, hls) {
    const vp = E.q(".pvp", card), ct = E.q(".pct", card);
    const vh = vp.clientHeight;
    const usable = vh - 70;
    const lines = E.qa(".pl", ct);
    const pages = [0];
    let pageTop = 0;
    for (const ln of lines) {
      const top = ln.offsetTop, bot = top + ln.offsetHeight;
      if (bot - pageTop > usable && top > pageTop) { pageTop = top - 6; pages.push(pageTop); }
    }
    const pageOf = (y) => { let k = 0; for (let i = 0; i < pages.length; i++) if (pages[i] <= y + 1) k = i; return k; };
    const H = (hls || []).map((h) => {
      const ln = E.q('[data-hl="' + h.id + '"]', card);
      return { ln, page: pageOf(ln.offsetTop), hold: h.hold || 1.6, zoom: h.zoom == null ? 0.08 : h.zoom };
    });
    const n = pages.length, slide = 0.3, lead = 0.25, exitD = 0.3;
    const holdsT = H.reduce((a, h) => a + h.hold + 0.25, 0);
    const dwell = Math.max(0.45, (t1 - t0 - lead - exitD - (n - 1) * slide - holdsT) / n);
    tl.fromTo(card, { opacity: 0 }, A({ opacity: 1, duration: 0.3, ease: "power1.out" }), t0);
    tl.fromTo(card, { scale: 0.97, y: 40 }, A({ scale: 1, y: 0, duration: 0.6, ease: SPRING }), t0);
    const vpo = E.off(vp, ctx.scene);
    const arrivals = [];
    const holdTimes = [];
    let t = t0 + lead;
    for (let i = 0; i < n; i++) {
      arrivals.push(t);
      let tt = t + dwell * 0.35;
      for (const h of H.filter((x) => x.page === i)) {
        const hb = E.q(".hlbg", h.ln);
        tl.fromTo(hb, { opacity: 0 }, A({ opacity: 1, duration: 0.25, ease: "power2.out" }), tt);
        const cy = vpo.y + ct.offsetTop + (h.ln.offsetTop - pages[i]) + h.ln.offsetHeight / 2;
        const cx = vpo.x + vp.clientWidth / 2;
        if (h.zoom) E.zoom(tl, ctx, cx, cy, tt, h.zoom, tt + h.hold - 0.45, 0.45, [vpo.x, vpo.x + vp.clientWidth]);
        tl.fromTo(hb, { opacity: 1 }, A({ opacity: 0, duration: 0.3, ease: "power2.in" }), tt + h.hold);
        holdTimes.push(+tt.toFixed(3));
        tt += h.hold + 0.25;
      }
      t = tt + dwell * 0.65;
      if (i < n - 1) {
        tl.fromTo(ct, { y: -pages[i] }, A({ y: -pages[i + 1], duration: slide, ease: "power2.inOut" }), t);
        t += slide;
      }
    }
    // tabs follow the page: the last section whose tag sits above the page's upper third
    const tabs = E.qa(".tab", card);
    if (tabs.length) {
      const tags = tabs.map((tab) => E.q('.ptag[data-sec="' + tab.dataset.sec + '"]', card));
      const secAt = (p) => { let k = 0; tags.forEach((g, j) => { if (g && g.offsetTop <= p + vh * 0.3) k = j; }); return k; };
      let cur = -1;
      for (let i = 0; i < n; i++) {
        const k = secAt(pages[i]);
        if (k === cur) continue;
        const ta = i === 0 ? t0 + 0.1 : arrivals[i] - slide * 0.5;
        if (cur >= 0) {
          tl.fromTo(tabs[cur], { color: "#f5f2ea" }, A({ color: "#9c99ae", duration: 0.2 }), ta);
          tl.fromTo(E.q(".tul", tabs[cur]), { opacity: 1 }, A({ opacity: 0, duration: 0.2 }), ta);
        }
        tl.fromTo(tabs[k], { color: "#9c99ae" }, A({ color: "#f5f2ea", duration: 0.2 }), ta);
        tl.fromTo(E.q(".tul", tabs[k]), { opacity: 0 }, A({ opacity: 1, duration: 0.2 }), ta);
        cur = k;
      }
    }
    tl.fromTo(card, { opacity: 1 }, A({ opacity: 0, duration: exitD, ease: "power2.in" }), t1 - exitD);
    return { pages: pages.length, arrivals: arrivals.map((x) => +x.toFixed(3)), dwell: +dwell.toFixed(3), holds: holdTimes };
  };

  /* Standard topic scene. Layout is measured once (static), then:
     title + explanation centred -> dock to the top (smaller, dimmed) -> simulation ->
     fact (simulation and explanation leave, fact centred) -> prompt card -> tip. */
  E.topic = function (tl, ctx, cfg) {
    const S = cfg.S, sc = ctx.scene;
    const hdr = E.q(".hdr", sc), main = E.q(".main", sc), exp = E.q(".exp", sc);
    const stage = E.q(".stage", sc), simtag = E.q(".simtag", sc), fact = E.q(".factbox", sc);
    // static layout
    const h = main.offsetHeight;
    const top0 = Math.round(Math.max(380, 930 - h / 2));
    main.style.top = top0 + "px";
    const dockTop = 382, dockS = 0.86;
    const stTop = Math.round(dockTop + h * dockS + 40);
    stage.style.top = stTop + "px";
    stage.style.height = Math.max(600, 1562 - stTop) + "px";

    E.fadeIn(tl, hdr, S + 0.05, 0.5, 0);
    E.kin(tl, E.q(".ttl", sc), S);
    E.kin(tl, exp, S);
    const acc = E.q(".exp .accgrp", sc);
    if (acc && cfg.expZoom) E.zoomOn(tl, ctx, acc, S + parseFloat(acc.dataset.t), cfg.expZoom, S + cfg.tDock - 0.05, 0.4);
    // dock
    tl.set(main, { transformOrigin: "100% 0%" }, S + cfg.tDock);
    tl.fromTo(main, { y: 0, scale: 1 }, A({ y: dockTop - top0, scale: dockS, duration: 0.75, ease: SPRING }), S + cfg.tDock);
    E.dim(tl, exp, S + cfg.tDock, 0.55, 1, 0.5);
    // simulation
    E.fadeIn(tl, simtag, S + cfg.tStage - 0.15, 0.4, 0);
    tl.fromTo(stage, { opacity: 0, y: 46 }, A({ opacity: 1, y: 0, duration: 0.8, ease: SPRING }), S + cfg.tStage);
    if (window.SIMS[cfg.sim]) window.SIMS[cfg.sim](tl, ctx, cfg, S);
    const tNext = cfg.tPrompt != null ? cfg.tPrompt : cfg.tTip != null ? cfg.tTip : cfg.D - 0.05;
    const tOut1 = cfg.tFact != null ? cfg.tFact - 0.45 : tNext - 0.35;
    E.dim(tl, stage, S + tOut1, 0, 1, 0.35);
    E.dim(tl, simtag, S + tOut1, 0, 1, 0.3);
    E.dim(tl, exp, S + tOut1, 0, 0.55, 0.35);
    if (cfg.tFact != null) {
      const pill = E.q(".factbox .pill", sc);
      if (pill) E.pill(tl, pill, S + cfg.tFact, null);
      E.kin(tl, fact, S, { dy: 12 });
    }
    // first cut: the docked title (and the fact) leave before the card or the tip arrives
    tl.fromTo(main, { opacity: 1 }, A({ opacity: 0, duration: 0.25, ease: "power2.in" }), S + tNext - 0.3);
    if (fact) E.fadeOut(tl, fact, S + tNext - 0.3, 0.25, -20);
    let info = null;
    if (cfg.tPrompt != null) {
      const pend = cfg.tTip != null ? cfg.tTip : cfg.tPromptEnd;
      info = E.prompt(tl, ctx, E.q(".pcard", sc), S + cfg.tPrompt, S + pend, cfg.hls);
    }
    if (cfg.tTip != null) {
      const tip = E.q(".tipcard", sc);
      tl.fromTo(tip, { opacity: 0 }, A({ opacity: 1, duration: 0.3 }), S + cfg.tTip);
      tl.fromTo(tip, { scale: 0.96, y: 30 }, A({ scale: 1, y: 0, duration: 0.6, ease: SPRING }), S + cfg.tTip);
      E.kin(tl, E.q(".tip-text", sc), S);
      E.fadeOut(tl, tip, S + cfg.D - 0.4, 0.3, -20);
    }
    E.fadeOut(tl, hdr, S + cfg.D - 0.4, 0.3, 0);
    E.debug.scenes[cfg.id] = { S, D: cfg.D, layout: { top0, stTop, h }, prompt: info };
  };

  /* Chapter title card. */
  E.chapter = function (tl, ctx, cfg) {
    const S = cfg.S, sc = ctx.scene;
    const k = E.q(".ch-k", sc), n = E.q(".ch-n", sc), line = E.q(".ch-line", sc), dots = E.q(".ch-dots", sc);
    tl.fromTo(n, { opacity: 0, scale: 0.72, y: 30 }, A({ opacity: 1, scale: 1, y: 0, duration: 0.9, ease: SPRING }), S + 0.12);
    tl.fromTo(n, { filter: "blur(14px)" }, A({ filter: "blur(0px)", duration: 0.45, ease: "power2.out" }), S + 0.12);
    tl.set(n, { filter: "none" }, S + 0.58);
    E.fadeIn(tl, k, S + 0.25, 0.5, 14);
    E.kin(tl, E.q(".ch-title", sc), S);
    tl.fromTo(line, { opacity: 1, scaleX: 0 }, A({ opacity: 1, scaleX: 1, duration: 0.7, ease: "power3.inOut" }), S + 0.75);
    E.kin(tl, E.q(".ch-sub", sc), S, { dy: 12 });
    E.kin(tl, E.q(".ch-tag", sc), S, { dy: 10 });
    E.fadeIn(tl, dots, S + 0.6, 0.6, 10);
    tl.fromTo(E.q(".chap", sc), { opacity: 1, scale: 1 }, A({ opacity: 0, scale: 1.04, duration: 0.38, ease: "power2.in" }), S + cfg.D - 0.4);
    E.debug.scenes[cfg.id] = { S, D: cfg.D, type: "chapter" };
  };

  window.SIMS = window.SIMS || {};
})();

window.SIMS = window.SIMS || {};
window.SIMS.sim22 = function (tl, ctx, cfg, S) {
  const E = window.ENG, A = E.A, sc = ctx.scene, c = cfg.sim22;
  const T = (x) => S + cfg.tStage + x;   // sim times are relative to the stage entrance
  const rows = E.qa(".s22-fix", sc), caps = E.qa(".s22-cap", sc);
  // transcription fixes: list row and the same word inside the phone, resolved together
  rows.forEach((row, i) => {
    const t = T(c.fix0 + i * c.fixStep);
    const bad = E.q(".s22-bad", row), st = E.q(".s22-strike", row);
    const ar = E.q(".s22-arrow", row), good = E.q(".s22-good", row);
    tl.fromTo(bad, { opacity: 0, y: 14 }, A({ opacity: 1, y: 0, duration: 0.45, ease: E.SPRING }), t);
    tl.fromTo(st, { opacity: 1, scaleX: 0 }, A({ opacity: 1, scaleX: 1, duration: 0.35, ease: "power2.inOut" }), t + 0.3);
    tl.fromTo(bad, { opacity: 1 }, A({ opacity: 0.5, duration: 0.3 }), t + 0.62);
    tl.fromTo(ar, { opacity: 0, x: 12 }, A({ opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }), t + 0.48);
    tl.fromTo(good, { opacity: 0 }, A({ opacity: 1, duration: 0.22 }), t + 0.62);
    tl.fromTo(good, { scale: 0.82 }, A({ scale: 1, duration: 0.55, ease: "back.out(2)" }), t + 0.62);
    tl.fromTo(good, { filter: "blur(8px)" }, A({ filter: "blur(0px)", duration: 0.3, ease: "power2.out" }), t + 0.62);
    tl.set(good, { filter: "none" }, t + 0.93);
    // the phone caption shows the same word: wrong (red, struck) -> corrected (white)
    const cap = caps[i];
    const cb = E.q(".s22-capbad", cap), cs = E.q(".s22-capstrike", cap), cg = E.q(".s22-capgood", cap);
    tl.set(cap, { opacity: 1 }, t);
    tl.fromTo(cs, { opacity: 1, scaleX: 0 }, A({ opacity: 1, scaleX: 1, duration: 0.35, ease: "power2.inOut" }), t + 0.3);
    tl.fromTo(cb, { opacity: 1 }, A({ opacity: 0, duration: 0.18 }), t + 0.62);
    tl.fromTo(cg, { opacity: 0 }, A({ opacity: 1, duration: 0.2 }), t + 0.62);
    tl.fromTo(cg, { scale: 0.85 }, A({ scale: 1, duration: 0.5, ease: "back.out(2)" }), t + 0.62);
    const tEnd = i < rows.length - 1 ? T(c.fix0 + (i + 1) * c.fixStep) : T(c.pills0 - 0.35);
    tl.set(cap, { opacity: 0 }, tEnd);
  });
  // style 1: white pill in the centre of the screen, switching in one frame (no gap, no overlap)
  E.dim(tl, E.q(".s22-fixes", sc), T(c.pills0 - 0.35), 0.3);
  E.fadeIn(tl, E.q(".s22-l1", sc), T(c.pills0 - 0.3), 0.5, 16);
  let tp = c.pills0;
  c.pills.forEach((p, i) => { E.pill(tl, E.q("#t22-p" + (i + 1), sc), T(tp), T(tp + c.pillStep)); tp += c.pillStep; });
  // style 2: kinetic words in a band below the face
  E.dim(tl, E.q(".s22-l1", sc), T(c.kin0 - 0.3), 0.35);
  E.fadeIn(tl, E.q(".s22-l2", sc), T(c.kin0 - 0.25), 0.5, 16);
  E.kin(tl, E.q(".s22-kinrow", sc), S, { dy: 14 });
  const acc = E.q(".s22-kinrow .accgrp", sc);
  if (acc) E.zoomOn(tl, ctx, acc, S + parseFloat(acc.dataset.t), 0.04, S + cfg.tStage + cfg.simDur - 0.6, 0.45, [140, 940]);
};


(function () {
  const CFGS = [{"id": "c2", "type": "chapter", "D": 5.16, "S": 0.0}];
  const WINDOW = null;
  const fontsReady = Promise.all([
    document.fonts.load('400 38px Rubik', 'אבג abc 123'),
    document.fonts.load('800 62px Rubik', 'אבג abc'),
    document.fonts.load('900 40px Rubik', 'אבג'),
    document.fonts.load('600 27px "IBM Plex Mono"', 'abc 123'),
    document.fonts.load('400 27px "IBM Plex Sans Hebrew"', 'אבג'),
  ]).then(() => document.fonts.ready);
  fontsReady.then(() => {
    const stage = document.querySelector('.stagewrap');
    const cam = document.getElementById('cam');
    const master = gsap.timeline({ paused: true });
    // slow background drift for the whole video (the "camera that never stops")
    const TOT = 5.160;
    master.fromTo('#bg .g1', { x: 0, y: 0 }, { x: 260, y: 180, duration: TOT, ease: 'none', immediateRender: false }, 0);
    master.fromTo('#bg .g2', { x: 0, y: 0 }, { x: -300, y: -260, duration: TOT, ease: 'none', immediateRender: false }, 0);
    for (const cfg of CFGS) {
      const scene = document.getElementById('sc-' + cfg.id);
      const scam = scene.querySelector('.scam') || cam;
      if (cfg.type === 'chapter') window.ENG.chapter(master, { stage, cam: scam, scene }, cfg);
      else window.ENG.topic(master, { stage, cam: scam, scene }, cfg);
    }
    let root = master;
    if (WINDOW) {
      root = gsap.timeline({ paused: true });
      root.add(master.tweenFromTo(WINDOW[0], WINDOW[1], { duration: WINDOW[1] - WINDOW[0], ease: 'none' }), 0);
    }
    window.__ENG_DEBUG.ready = true;
    window.__timelines['main'] = root;
  });
})();

</script>
