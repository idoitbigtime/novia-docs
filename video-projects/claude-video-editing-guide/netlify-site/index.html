<style>
/* Layout: phones get the film filling the screen with a bar that opens the chapter drawer;
   wide screens get the film standing on the right and the chapters beside it. */
:root {
  --bg: #07070d;
  --panel: #12111f;
  --panel2: #1a1830;
  --line: rgba(201, 194, 255, 0.16);
  --ink: #f5f2ea;
  --muted: #a3a0b6;
  --lav: #c9c2ff;
  --red: #ff453a;
  --wa: #25d366;
  --fb: #1877f2;
  --f-ui: "Rubik", "Arial Hebrew", "Noto Sans Hebrew", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --bar: 64px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: var(--f-ui); -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; }
a { color: var(--lav); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--lav); outline-offset: 2px; }

/* ---------- film ---------- */
.stage { display: flex; justify-content: center; background: #000; }
.film { position: relative; aspect-ratio: 9 / 16; background: #000; max-width: 100%; }
.film video { position: absolute; inset: 0; width: 100%; height: 100%; background: #000; display: block; }
.err { position: absolute; inset: auto 12px 12px 12px; padding: 10px 12px; border-radius: 10px; background: rgba(40, 10, 12, 0.9); color: #ffd1cd; font-size: 14px; }

/* ---------- content ---------- */
.side { padding-inline: 16px; padding-block: 24px 120px; display: grid; gap: 22px; align-content: start; min-width: 0; }
.eyebrow { font: 500 12px/1 var(--f-mono); letter-spacing: 0.08em; color: var(--lav); display: flex; gap: 10px; align-items: center; margin: 0; }
.eyebrow i { width: 8px; height: 8px; border-radius: 50%; background: var(--red); box-shadow: 0 0 10px rgba(255, 69, 58, 0.8); display: block; }
h1 { font: 800 clamp(28px, 4.4vw, 44px)/1.1 var(--f-ui); margin: 8px 0 0; text-wrap: balance; }
.lede { color: var(--muted); font-size: 16px; line-height: 1.65; margin: 10px 0 0; max-width: 60ch; }

/* chapters */
.toc { display: grid; gap: 10px; }
.ch { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.ch > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.ch > summary::-webkit-details-marker { display: none; }
.ch-n { font: 700 13px/1 var(--f-mono); color: var(--red); white-space: nowrap; }
.ch-t { font-weight: 700; font-size: 17px; line-height: 1.3; }
.ch-sub { color: var(--muted); font-size: 14px; line-height: 1.55; padding: 0 16px 10px; margin: 0; }
.chev { width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; transition: transform 0.2s; }
details[open] > summary .chev { transform: rotate(180deg); }
.items { display: grid; border-top: 1px solid var(--line); }
.it { border-bottom: 1px solid var(--line); }
.it:last-child { border-bottom: 0; }
.it > summary { list-style: none; cursor: pointer; padding: 12px 16px; display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.it > summary::-webkit-details-marker { display: none; }
.it.on > summary { background: rgba(255, 69, 58, 0.08); box-shadow: inset -3px 0 0 var(--red); }
.tc { font: 500 13px/1 var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; direction: ltr; }
.num { font: 500 13px/1 var(--f-mono); color: var(--lav); }
.ttl { font-size: 15.5px; line-height: 1.4; min-width: 0; }
.play { all: unset; cursor: pointer; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: rgba(201, 194, 255, 0.12); }
.play:hover { background: rgba(201, 194, 255, 0.24); }
.play svg { width: 14px; height: 14px; fill: var(--ink); }
.body { padding: 4px 16px 18px; display: grid; gap: 14px; }
.blk h4 { margin: 0 0 6px; font: 500 12px/1 var(--f-mono); letter-spacing: 0.06em; color: var(--lav); }
.blk p { margin: 0; font-size: 15px; line-height: 1.7; color: #e3e0ee; max-width: 66ch; }
.fact { border-radius: 12px; background: var(--panel2); padding: 12px 14px; }
.fact p { color: var(--ink); }
.pr { border: 1px solid var(--line); border-radius: 12px; background: #0d0c18; }
.pr > summary { list-style: none; cursor: pointer; padding: 12px 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; font-weight: 500; }
.pr > summary::-webkit-details-marker { display: none; }
.pr .pn { font: 500 12px/1 var(--f-mono); color: var(--muted); direction: ltr; }
.prbar { display: flex; justify-content: flex-start; padding: 0 14px 8px; }
.copy { all: unset; cursor: pointer; font-size: 13px; font-weight: 500; padding: 7px 12px; border-radius: 999px; background: var(--lav); color: #120f24; }
.copy[data-ok] { background: #9be7b0; }
.pbody { padding: 4px 14px 14px; font: 400 14.5px/1.75 var(--f-ui); color: #d9d6e6; max-height: 60vh; overflow: auto; overflow-wrap: anywhere; }
.pbody .pl { white-space: pre-wrap; }
.pbody .pl-empty { height: 0.9em; }
.pbody .ptag { color: var(--lav); font-weight: 500; }
.pbody .code, .pbody .codeblock { font-family: var(--f-mono); font-size: 13px; color: #e9e6f5; }
.pbody .codeblock { display: block; direction: rtl; text-align: right; }
.pbody .cbi { direction: ltr; unicode-bidi: isolate; }
.pbody .tk, .pbody .nb, .pbody .neg { white-space: nowrap; }
.pbody .bt { color: var(--muted); }
.pbody .hlbg { display: none; }
.note { color: var(--muted); font-size: 14px; line-height: 1.6; margin: 0; }
.links { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.links a { display: inline-flex; gap: 8px; align-items: baseline; font-size: 15px; line-height: 1.5; word-break: break-word; }
.links small { font-family: var(--f-mono); color: var(--muted); direction: ltr; font-size: 12px; }

/* community */
.comm { border-radius: 18px; padding: 18px; background: linear-gradient(160deg, #1b1836, #11101d); border: 1px solid var(--line); display: grid; gap: 12px; }
.comm h2 { margin: 0; font-size: 20px; }
.comm p { margin: 0; color: var(--muted); line-height: 1.6; font-size: 15px; }
.cbtns { display: flex; flex-wrap: wrap; gap: 10px; }
.cbtn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 12px; text-decoration: none; color: #fff; font-weight: 700; font-size: 15px; }
.cbtn svg { width: 20px; height: 20px; fill: #fff; }
.cbtn.wa { background: #128c4b; }
.cbtn.fb { background: var(--fb); }
.foot { color: var(--muted); font-size: 13px; line-height: 1.6; }

/* ---------- phone: full-screen film + bar + drawer ---------- */
.bar { position: fixed; inset: auto 0 0 0; z-index: 20; padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)); background: rgba(7, 7, 13, 0.92); backdrop-filter: blur(10px); border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
.bar .open { flex: 1; min-width: 0; all: unset; flex: 1; cursor: pointer; display: grid; gap: 2px; padding: 8px 12px; border-radius: 12px; background: var(--panel2); }
.bar .open b { font-size: 15px; }
.bar .open span { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .cm { all: unset; cursor: pointer; padding: 12px 14px; border-radius: 12px; background: #128c4b; font-weight: 700; font-size: 14px; }
.drawer { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; background: var(--bg); transform: translateY(100%); transition: transform 0.28s ease; visibility: hidden; }
.drawer.show { transform: none; visibility: visible; }
.dhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; border-bottom: 1px solid var(--line); }
.dhead b { font-size: 17px; }
.close { all: unset; cursor: pointer; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--panel2); }
.close svg { width: 18px; height: 18px; stroke: var(--ink); stroke-width: 2.2; fill: none; }
.dbody { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 12px calc(28px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 18px; align-content: start; }

@media (max-width: 959px) {
  .stage { position: sticky; top: 0; z-index: 5; }
  .film { height: calc(100svh - var(--bar) - env(safe-area-inset-bottom, 0px)); max-height: calc(100vw * 16 / 9); }
  .side .toc-wrap { display: none; }
}
@media (min-width: 960px) {
  .bar, .drawer { display: none; }
  .page { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 32px; max-width: 1240px; margin-inline: auto; padding-inline: 24px; }
  .stage { background: transparent; position: sticky; top: 0; height: 100vh; align-items: center; }
  .film { height: calc(100vh - 48px); border-radius: 22px; overflow: hidden; border: 1px solid var(--line); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 60px rgba(140, 120, 255, 0.1); }
  .side { padding-inline: 0; padding-block: 32px 48px; }
}
@media (prefers-reduced-motion: reduce) { .drawer, .chev { transition: none; } }
</style>
</head>

<script>
(function () {
  var DATA = {"chapters": [{"n": 0, "title": "פתיחה", "t": 0.0, "sub": "", "items": [{"id": "hook", "num": "", "title": "ערב שלם על סרטון של דקה?", "t": 0.0, "see": "שעון מתקתק ושאלה: &quot;ערב שלם על סרטון של דקה?&quot;. אחריה שש הבזקים קצרים, כל אחד עם הדמיה קטנה משלו: חיתוך שתיקות, כתוביות בעברית, אפקטים בתלת ממד, בירולים, הקלטות מסך וחיסכון ברינדורים. בסוף משפט אחד, &quot;אומרים לו בעברית מה רוצים, ורק מאשרים כל שלב בדרך&quot;, והכותרת עם 21 הפרומפטים המוכנים.", "links": [], "exp": "", "fact": "", "tip": "", "prompt": null}]}, {"n": 1, "title": "ככה זה עובד", "t": 10.6, "sub": "את ההכנה עושים פעם אחת: שני כלים ותיקייה אחת.", "items": [{"id": "ch1", "num": "", "title": "ככה עובדים עם Claude Code ו-HyperFrames", "t": 14.94, "see": "טרמינל של Claude Code עם המודל Claude Opus 5.5 (ברירת המחדל בכל מנוי בתשלום, ואם נבחר מודל אחר כותבים /model). לידו HyperFrames, כלי חינמי, והסקילים שלו נכנסים לקלוד. לכל סרטון תיקייה אחת, וקלוד שואל שאלות לפני שהוא נוגע בקבצים. אחר כך כרטיס פרומפט עם חמשת החלקים שלו (קלט, כיוון, בנייה, מלכודות, התחלה), ככה בנויים רוב הפרומפטים בסרטון, והוא נכנס לטרמינל. בסוף: כל פרומפט נבדק על ידי עותק נפרד של קלוד שקיבל רק אותו.", "links": [{"label": "התיעוד הרשמי של HyperFrames", "url": "https://hyperframes.heygen.com/introduction"}], "exp": "", "fact": "", "tip": "", "prompt": null}]}, {"n": 2, "title": "עריכה בסיסית", "t": 59.54, "sub": "חיתוך, כתוביות, מעבר לאורך, צבע וסאונד: את כל העבודה השחורה מעבירים לקלוד, ורק מאשרים.", "items": [{"id": "t21", "num": "2.1", "title": "חיתוך שתיקות, גמגומים וטייקים כפולים, לפי המשמעות", "t": 65.3, "see": "רצועת תמלול מעל גל קול. מסומנים שקט, &quot;אמ&quot; ומשפט שנעזב באמצע. מופיעה טבלת חיתוכים בעמודות &quot;זמן · מה נמחק · סיבה&quot;, וכפתור &quot;מחכה לאישור&quot; הופך ל&quot;אושר&quot;. הקטעים נסגרים, ובכל חיבור מופיע הסימון &quot;0.1 שנייה של שקט&quot;.", "exp": "קלוד מתמלל את הצילום ומחליט מה לחתוך לפי המשמעות. משפט שהתחלתם ועזבתם באמצע נמחק כולו, וכשאמרתם משהו פעמיים נשאר רק הניסיון האחרון והשלם.", "fact": "33 שניות, 4 שתיקות · בכל חיבור נשארה עשירית שנייה של שקט, כדי ששום עיצור לא ייחתך.", "tip": "לא מתמללים את הקובץ החתוך מחדש: תמלול חוזר כתב &quot;על פיות&quot; במקום &quot;אלפיות&quot;, ולכן הזמנים מחושבים מהתמלול המקורי.", "prompt": {"n": 1, "text": "<קלט>\nתשאל אותי על שני דברים:\n- איזה קובץ לערוך, אם יש בתיקייה יותר מסרטון אחד.\n- אם יש משהו שחייב להישאר, למשל שתיקה מכוונת לפני משפט חזק, או חזרה שעשיתי בשביל ההדגשה.\n<\/קלט>\n\n<כיוון>\nסרטון שבו הדיבור זורם בלי חורים.\nמוחקים כל שתיקה, כל \"אה\" ו\"אמ\", כל מילה שנתקעה, וכל משפט שאמרתי פעמיים (נשאר הטייק האחרון והשלם).\nמשפט שהתחלתי ועזבתי באמצע נמחק כולו.\nתיקון עצמי שנשמע טבעי נשאר, וגם חזרה שעשיתי בכוונה.\nבכל חיבור נשאר שקט של 0.1 שנייה בסך הכל, חצי אחרי המילה הקודמת וחצי לפני הבאה, כדי ששום עיצור לא ייחתך.\nבתחילת הסרטון ובסופו נשאר רק כ-0.05 שנייה של שקט.\n<\/כיוון>\n\n<בנייה>\n1. תתמלל עם זמן לכל מילה בעזרת `npx hyperframes transcribe <הקובץ> --language he --model large-v3`.\n2. תקרא את התמלול כטקסט רגיל ותחליט מה נחתך לפי המשמעות, משפט אחרי משפט.\n3. whisper לרוב לא כותב \"אה\" ו\"אמ\", אז תחפש גם רווח בתמלול שבו יש קול ואין מילה.\n4. את השתיקות תמדוד מהקול עצמו עם `silencedetect` (סף בסביבות -35dB, מ-0.15 שנייה), כי הזמנים של whisper בקצוות של מילים לא מדויקים.\n5. כל נקודת חיתוך יושבת בתוך שקט ומעוגלת לפריים שלם, כדי שהקול לא יזוז מהתמונה אחרי כמה חיבורים.\n6. אחרי שאישרתי, תחתוך במעבר אחד של ffmpeg (trim ו-atrim לכל קטע, ואז concat), עם fade של בערך 30 אלפיות שנייה בכל חיבור, כדי שלא יישמע קליק.\n7. אפשר להריץ את `transcript-cut` של הסקיל `media-use` עם `--plan` כדי לראות את הקטעים, ואת החיתוך עצמו תעשה במעבר אחד כמו בשלב 6.\n8. תשמור על הרזולוציה המקורית כדי שיהיה מקום לזום אחר כך, ובצילום 4K תגיד לי מראש כמה דקות ייקח הקידוד.\n9. את זמני המילים בקובץ החתוך תחשב מהתמלול המקורי ולפי מה שנמחק, ותשמור אותם בקובץ json ליד הסרטון.\n10. בסוף תמדוד שוב עם `silencedetect` שאין בקובץ החתוך שקט ארוך מ-0.2 שנייה.\n11. תציע לי באילו חיבורים זום קטן של בערך 12 אחוז יסתיר את הקפיצה בתמונה.\n<\/בנייה>\n\n<מלכודות>\nאל תתמלל מחדש את הקובץ החתוך כדי לקבל זמנים, כי whisper ממציא מילים בנקודות החיבור ומשנה מילים גם במקומות אחרים.\nחיתוך שנופל על עיצור בסוף מילה נשמע כמו מילה קטועה, ולכן כל חיתוך נבדק מול עוצמת הקול.\n<\/מלכודות>\n\n<התחלה>\nתשאל אותי על הקלט, תתמלל, ותראה לי טבלה של כל החיתוכים: הזמן, המילים שנמחקות והסיבה.\nאם אין בצילום שתיקה ארוכה מ-0.2 שנייה ואין טייק כפול, תגיד לי את זה לפני שאתה מקודד.\nאל תחתוך לפני שאישרתי.\n<\/התחלה>", "note": "", "html": "<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"קלט\">&lt;קלט&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">תשאל אותי על שני דברים:<\/div>\n<div class=\"pl\" dir=\"rtl\">- איזה קובץ לערוך, אם יש בתיקייה יותר מסרטון אחד.<\/div>\n<div class=\"pl\" dir=\"rtl\">- אם יש משהו שחייב להישאר, למשל שתיקה מכוונת לפני משפט חזק, או חזרה שעשיתי בשביל ההדגשה.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/קלט&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"כיוון\">&lt;כיוון&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">סרטון שבו הדיבור זורם בלי חורים.<\/div>\n<div class=\"pl\" dir=\"rtl\">מוחקים כל שתיקה, כל &quot;אה&quot; ו&quot;אמ&quot;, כל מילה שנתקעה, וכל משפט שאמרתי פעמיים (נשאר הטייק האחרון והשלם).<\/div>\n<div class=\"pl\" dir=\"rtl\">משפט שהתחלתי ועזבתי באמצע נמחק כולו.<\/div>\n<div class=\"pl\" dir=\"rtl\">תיקון עצמי שנשמע טבעי נשאר, וגם חזרה שעשיתי בכוונה.<\/div>\n<div class=\"pl\" dir=\"rtl\">בכל חיבור נשאר שקט של 0.1 שנייה בסך הכל, חצי אחרי המילה הקודמת וחצי לפני הבאה, כדי ששום עיצור לא ייחתך.<\/div>\n<div class=\"pl\" dir=\"rtl\">בתחילת הסרטון ובסופו נשאר רק <span class=\"nb\">כ-0.05<\/span> שנייה של שקט.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/כיוון&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"בנייה\">&lt;בנייה&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">1. תתמלל עם זמן לכל מילה בעזרת <span class=\"codeblock\" dir=\"rtl\"><span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">npx<\/span> <span class=\"tk\">hyperframes<\/span> <span class=\"tk\">transcribe<\/span> <span class=\"tk\"><bdi dir=\"ltr\">&lt;הקובץ&gt;<\/bdi><\/span> <span class=\"tk\">--language he<\/span> <span class=\"tk\">--model large-v3<\/span><span class=\"bt\">`<\/span><\/span>.<\/span><\/div>\n<div class=\"pl\" dir=\"rtl\">2. תקרא את התמלול כטקסט רגיל ותחליט מה נחתך לפי המשמעות, משפט אחרי משפט.<\/div>\n<div class=\"pl\" dir=\"rtl\">3. whisper לרוב לא כותב &quot;אה&quot; ו&quot;אמ&quot;, אז תחפש גם רווח בתמלול שבו יש קול ואין מילה.<\/div>\n<div class=\"pl\" dir=\"rtl\">4. את השתיקות תמדוד מהקול עצמו עם <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">silencedetect<\/span><span class=\"bt\">`<\/span><\/span> (סף בסביבות <span dir=\"ltr\" class=\"neg\">-35dB<\/span>, <span class=\"nb\">מ-0.15<\/span> שנייה), כי הזמנים של whisper בקצוות של מילים לא מדויקים.<\/div>\n<div class=\"pl\" dir=\"rtl\">5. כל נקודת חיתוך יושבת בתוך שקט ומעוגלת לפריים שלם, כדי שהקול לא יזוז מהתמונה אחרי כמה חיבורים.<\/div>\n<div class=\"pl\" dir=\"rtl\">6. אחרי שאישרתי, תחתוך במעבר אחד של ffmpeg (trim <span class=\"nb\">ו-atrim<\/span> לכל קטע, ואז concat), עם fade של בערך 30 אלפיות שנייה בכל חיבור, כדי שלא יישמע קליק.<\/div>\n<div class=\"pl\" dir=\"rtl\">7. אפשר להריץ את <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">transcript-cut<\/span><span class=\"bt\">`<\/span><\/span> של הסקיל <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">media-use<\/span><span class=\"bt\">`<\/span><\/span> עם <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">--plan<\/span><span class=\"bt\">`<\/span><\/span> כדי לראות את הקטעים, ואת החיתוך עצמו תעשה במעבר אחד כמו בשלב 6.<\/div>\n<div class=\"pl\" dir=\"rtl\">8. תשמור על הרזולוציה המקורית כדי שיהיה מקום לזום אחר כך, ובצילום 4K תגיד לי מראש כמה דקות ייקח הקידוד.<\/div>\n<div class=\"pl\" dir=\"rtl\">9. את זמני המילים בקובץ החתוך תחשב מהתמלול המקורי ולפי מה שנמחק, ותשמור אותם בקובץ json ליד הסרטון.<\/div>\n<div class=\"pl\" dir=\"rtl\">10. בסוף תמדוד שוב עם <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">silencedetect<\/span><span class=\"bt\">`<\/span><\/span> שאין בקובץ החתוך שקט ארוך <span class=\"nb\">מ-0.2<\/span> שנייה.<\/div>\n<div class=\"pl\" dir=\"rtl\">11. תציע לי באילו חיבורים זום קטן של בערך 12 אחוז יסתיר את הקפיצה בתמונה.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/בנייה&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"מלכודות\">&lt;מלכודות&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">אל תתמלל מחדש את הקובץ החתוך כדי לקבל זמנים, כי whisper ממציא מילים בנקודות החיבור ומשנה מילים גם במקומות אחרים.<\/div>\n<div class=\"pl\" dir=\"rtl\">חיתוך שנופל על עיצור בסוף מילה נשמע כמו מילה קטועה, ולכן כל חיתוך נבדק מול עוצמת הקול.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/מלכודות&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"התחלה\">&lt;התחלה&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">תשאל אותי על הקלט, תתמלל, ותראה לי טבלה של כל החיתוכים: הזמן, המילים שנמחקות והסיבה.<\/div>\n<div class=\"pl\" dir=\"rtl\">אם אין בצילום שתיקה ארוכה <span class=\"nb\">מ-0.2<\/span> שנייה ואין טייק כפול, תגיד לי את זה לפני שאתה מקודד.<\/div>\n<div class=\"pl\" dir=\"rtl\">אל תחתוך לפני שאישרתי.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/התחלה&gt;<\/div>"}, "links": []}, {"id": "t22", "num": "2.2", "title": "כתוביות בעברית בשני סגנונות", "t": 98.03, "see": "טלפון עם צללית מדברת. ברירת המחדל של HyperFrames מבינה רק אנגלית, ולכן התמלול עובר למודל הגדול (large-v3). קלוד קורא כל כתובית כמשפט שלם ותופס את &quot;מחובר עליו&quot; במקום &quot;מחובר אליו&quot;, ומתקן מילים שנשמעות אותו דבר (הקאבל ← הכבל, בסכוכית ← בזכוכית). בסוף שני הסגנונות: גלולות לבנות שמתחלפות בפריים אחד, וכתוביות קינטיות שבהן כל מילה נכנסת בתנועה.", "exp": "התמלול נעשה עם המודל הגדול (large-v3), כי ברירת המחדל של HyperFrames מבינה רק אנגלית. אחר כך קלוד קורא כל כתובית כמשפט שלם ומתקן מילים שנשמעות אותו דבר ונכתבות אחרת.", "fact": "9 טעויות תמלול · בקטע של 33 שניות: 7 נתפסו בקריאה, <span class=\"nb\">ו-2<\/span> רק באוזן. · &quot;מחובר עליו&quot; במקום &quot;מחובר אליו&quot; נתפס רק בקריאה של המשפט כולו.", "tip": "לפני שמאשרים, מקשיבים לכל מילה שקלוד מסמן שהוא לא בטוח בה.", "prompt": {"n": 2, "text": "<קלט>\nתשאל אותי על שלושה דברים:\n- איזה סרטון לערוך, אם יש בתיקייה יותר מאחד.\n- איזה סגנון כתוביות לבנות, אחד מהשניים:\n  - גלולה לבנה עם טקסט שחור, שורה אחת באמצע המסך.\n  - כתוביות קינטיות, שבהן כל מילה נכנסת למסך בתנועה ברגע שהיא נאמרת.\n- צבע הדגשה למילים החשובות (ברירת המחדל אדום) ופונט עברי (ברירת המחדל Rubik).\n<\/קלט>\n\n<כיוון>\nכל מילה שנאמרת מופיעה בכתוביות, בדיוק כמו שנאמרה, כולל פיסוק.\nשם של מוצר או תקן (iPhone, USB) נכתב באנגלית, ומילה שעברה לעברית (פרומפט, אינטרנט) נכתבת בעברית.\nמספר מדויק נכתב בספרות, ו\"אלף\" או \"אלפי\" נשארים במילים, למשל \"200 אלף\".\nבלי מקף בין שתי מילים.\nכתובית לא נחתכת בין מילים ששייכות יחד, כמו \"כבל רשת\" או \"מחובר אליו\".\nאם בחרתי גלולה:\n- מלבן לבן עם פינות מעוגלות (רדיוס 20), בגובה של בערך 100 פיקסלים ברוחב 1080, וטקסט שחור במשקל 800, במרכז המסך לרוחב ולגובה.\n- בכל כתובית 1 עד 4 מילים (רוב הזמן 3), עד 18 תווים, בין 0.3 ל-1.2 שניות, וכתובית שנמתחת מעבר ל-1.2 בגלל הפסקה מתפצלת לשתיים.\n- כתובית נסגרת על פסיק או נקודה שנופלים במילה השנייה עד הרביעית.\n- הכתוביות מתחלפות בלי אנימציה, בפריים אחד, בלי חור ובלי חפיפה ביניהן.\n- 1 עד 4 מילים בצבע ההדגשה בכל הסרטון: שם של מוצר בפעם הראשונה שהוא נאמר, מספר, או מילה של דחיפות כמו \"עכשיו\".\nאם בחרתי כתוביות קינטיות:\n- בכל קבוצה 1 עד 3 מילים, שיורדות שורה אם הן לא נכנסות בשורה אחת, עד 3 שורות, בפס קבוע בחלק התחתון של המרכז.\n- כל מילה נכנסת בתחילת המילה המדוברת, בתנועת קפיץ: מתבהרת מטשטוש, וגדלה מעט מעל הגודל הסופי ומתיישבת.\n- המילה החזקה בכל משפט במשקל 900 וקצת יותר גדולה, ועד 8 מילים בצבע ההדגשה בכל הסרטון, עם קו תחתון דק שנמתח מימין לשמאל.\n- המילה האחרונה בכל קבוצה נשארת על המסך לפחות 0.3 שנייה, ומילה שמתחילה פחות מ-0.3 שנייה אחריה עוברת לאותה קבוצה.\n<\/כיוון>\n\n<בנייה>\n1. אם כבר חתכתי את הסרטון עם פרומפט החיתוך, תשתמש בזמני המילים שחושבו שם, ורק אם אין כאלה תתמלל עם `npx hyperframes transcribe <הקובץ> --language he --model large-v3`.\n2. תקרא את כל הכתוביות כמשפטים שלמים ותתקן מילים שנשמעות אותו דבר ונכתבות אחרת: א/ע, כ/ח, ט/ת, ק/כ, ב/ו, ס/ז, ס/ש (למשל \"מחובר אליו\" ולא \"עליו\", \"בזכוכית\" ולא \"בסכוכית\").\n3. תתקן גם מילים ש-whisper פיצל או הדביק (\"על פיות\" שהיא \"אלפיות\"), ראשי תיבות בלי גרשיים (כמש שהוא קמ\"ש), וכתיב של מילים לועזיות, ותשאיר את הניסוח המדובר כמו שהוא.\n4. תתקן את הזמנים לפי עוצמת הקול: אחרי שקט whisper מקדים את המילה ב-0.1 עד 0.3 שנייה או מכניס את השקט לתוכה, אז המילה מתחילה ברגע הראשון שבו הקול עולה.\n5. את שכבת הכתוביות תבנה בעצמך בקוד, כקומפוזיציה של HyperFrames מעל הסרטון, ולא דרך הסקיל `embedded-captions` שהסקיל `hyperframes` מפנה אליו, כי אין בו עברית ואין בו את שני הסגנונות.\n6. אם Rubik לא נמצא בתיקיית הפרויקט, תוריד אותו מ-Google Fonts לתיקייה `assets/fonts` ותטען אותו עם `@font-face`.\n7. אם בחרתי בשני הסגנונות, כל סגנון נבנה בתיקיית פרויקט משלו.\n8. תמסור את הסרטון עם הכתוביות ובלי הכתוביות, באותה רזולוציה, באותו אורך ועם הקול המקורי (`data-has-audio=\"true\"` בלי `muted`).\n<\/בנייה>\n\n<מלכודות>\nכל זמן של כתובית מעוגל לפריים, ואחרי הרינדור תבדוק בפריימים שאין בשום החלפה פריים בלי כתובית, כי הבדיקה האוטומטית של HyperFrames לא תופסת את זה.\nאת הטשטוש בקינטי תנפיש בנפרד מהקפיץ, ולא תיתן לו לרדת מתחת ל-0, כי הדפדפן פוסל `blur` שלילי והמילה נשארת מטושטשת.\n`dir=\"rtl\"` לא נכנס לתגית ה-html, כי אז הרינדור יוצא שחור.\nכל מילה ב-span משלה עם `dir=\"rtl\"`, אחרת פסיק או נקודה בסוף המילה עוברים לצד הלא נכון.\nבתוך flex הרווח בין שני span נעלם, אז המרווח בין מילים נקבע עם gap.\nהפונט נטען עם טקסט עברי, `document.fonts.load('800 100px Rubik', 'אבג')`, אחרת נטען רק החלק הלטיני ורוחבי המילים יוצאים שגויים.\nטקסט רק בין x 140 ל-940 מתוך 1080, כי בטלפונים גבוהים אינסטגרם חותך את הצדדים.\n<\/מלכודות>\n\n<התחלה>\nתשאל אותי על הקלט, תתמלל, ותראה לי את כל הכתוביות כרשימת משפטים עם זמנים, עם סימון של כל מילה שתיקנת, של המילים להדגשה ושל מילים שאתה לא בטוח בהן, כדי שאבדוק אותן באוזן.\nאחרי שאישרתי, תרנדר תצוגה של 10 שניות (תשנה זמנית את `data-duration` ל-10 ותרנדר עם `--quality draft`), ואת כל הסרטון רק אחרי שאישרתי את הסגנון.\n<\/התחלה>", "note": "", "html": "<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"קלט\">&lt;קלט&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">תשאל אותי על שלושה דברים:<\/div>\n<div class=\"pl\" dir=\"rtl\">- איזה סרטון לערוך, אם יש בתיקייה יותר מאחד.<\/div>\n<div class=\"pl\" dir=\"rtl\">- איזה סגנון כתוביות לבנות, אחד מהשניים:<\/div>\n<div class=\"pl\" dir=\"rtl\">  - גלולה לבנה עם טקסט שחור, שורה אחת באמצע המסך.<\/div>\n<div class=\"pl\" dir=\"rtl\">  - כתוביות קינטיות, שבהן כל מילה נכנסת למסך בתנועה ברגע שהיא נאמרת.<\/div>\n<div class=\"pl\" dir=\"rtl\">- צבע הדגשה למילים החשובות (ברירת המחדל אדום) ופונט עברי (ברירת המחדל Rubik).<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/קלט&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"כיוון\">&lt;כיוון&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">כל מילה שנאמרת מופיעה בכתוביות, בדיוק כמו שנאמרה, כולל פיסוק.<\/div>\n<div class=\"pl\" dir=\"rtl\">שם של מוצר או תקן (iPhone, USB) נכתב באנגלית, ומילה שעברה לעברית (פרומפט, אינטרנט) נכתבת בעברית.<\/div>\n<div class=\"pl\" dir=\"rtl\">מספר מדויק נכתב בספרות, ו&quot;אלף&quot; או &quot;אלפי&quot; נשארים במילים, למשל &quot;200 אלף&quot;.<\/div>\n<div class=\"pl\" dir=\"rtl\">בלי מקף בין שתי מילים.<\/div>\n<div class=\"pl\" dir=\"rtl\">כתובית לא נחתכת בין מילים ששייכות יחד, כמו &quot;כבל רשת&quot; או &quot;מחובר אליו&quot;.<\/div>\n<div class=\"pl\" dir=\"rtl\">אם בחרתי גלולה:<\/div>\n<div class=\"pl\" dir=\"rtl\">- מלבן לבן עם פינות מעוגלות (רדיוס 20), בגובה של בערך 100 פיקסלים ברוחב 1080, וטקסט שחור במשקל 800, במרכז המסך לרוחב ולגובה.<\/div>\n<div class=\"pl\" dir=\"rtl\">- בכל כתובית 1 עד 4 מילים (רוב הזמן 3), עד 18 תווים, בין 0.3 <span class=\"nb\">ל-1.2<\/span> שניות, וכתובית שנמתחת מעבר <span class=\"nb\">ל-1.2<\/span> בגלל הפסקה מתפצלת לשתיים.<\/div>\n<div class=\"pl\" dir=\"rtl\">- כתובית נסגרת על פסיק או נקודה שנופלים במילה השנייה עד הרביעית.<\/div>\n<div class=\"pl\" dir=\"rtl\">- הכתוביות מתחלפות בלי אנימציה, בפריים אחד, בלי חור ובלי חפיפה ביניהן.<\/div>\n<div class=\"pl\" dir=\"rtl\">- 1 עד 4 מילים בצבע ההדגשה בכל הסרטון: שם של מוצר בפעם הראשונה שהוא נאמר, מספר, או מילה של דחיפות כמו &quot;עכשיו&quot;.<\/div>\n<div class=\"pl\" dir=\"rtl\">אם בחרתי כתוביות קינטיות:<\/div>\n<div class=\"pl\" dir=\"rtl\">- בכל קבוצה 1 עד 3 מילים, שיורדות שורה אם הן לא נכנסות בשורה אחת, עד 3 שורות, בפס קבוע בחלק התחתון של המרכז.<\/div>\n<div class=\"pl\" dir=\"rtl\">- כל מילה נכנסת בתחילת המילה המדוברת, בתנועת קפיץ: מתבהרת מטשטוש, וגדלה מעט מעל הגודל הסופי ומתיישבת.<\/div>\n<div class=\"pl\" dir=\"rtl\">- המילה החזקה בכל משפט במשקל 900 וקצת יותר גדולה, ועד 8 מילים בצבע ההדגשה בכל הסרטון, עם קו תחתון דק שנמתח מימין לשמאל.<\/div>\n<div class=\"pl\" dir=\"rtl\">- המילה האחרונה בכל קבוצה נשארת על המסך לפחות 0.3 שנייה, ומילה שמתחילה פחות <span class=\"nb\">מ-0.3<\/span> שנייה אחריה עוברת לאותה קבוצה.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/כיוון&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"בנייה\">&lt;בנייה&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">1. אם כבר חתכתי את הסרטון עם פרומפט החיתוך, תשתמש בזמני המילים שחושבו שם, ורק אם אין כאלה תתמלל עם <span class=\"codeblock\" dir=\"rtl\"><span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">npx<\/span> <span class=\"tk\">hyperframes<\/span> <span class=\"tk\">transcribe<\/span> <span class=\"tk\"><bdi dir=\"ltr\">&lt;הקובץ&gt;<\/bdi><\/span> <span class=\"tk\">--language he<\/span> <span class=\"tk\">--model large-v3<\/span><span class=\"bt\">`<\/span><\/span>.<\/span><\/div>\n<div class=\"pl\" dir=\"rtl\">2. תקרא את כל הכתוביות כמשפטים שלמים ותתקן מילים שנשמעות אותו דבר ונכתבות אחרת: א/ע, כ/ח, ט/ת, ק/כ, ב/ו, ס/ז, ס/ש (למשל &quot;מחובר אליו&quot; ולא &quot;עליו&quot;, &quot;בזכוכית&quot; ולא &quot;בסכוכית&quot;).<\/div>\n<div class=\"pl\" dir=\"rtl\">3. תתקן גם מילים <span class=\"nb\">ש-whisper<\/span> פיצל או הדביק (&quot;על פיות&quot; שהיא &quot;אלפיות&quot;), ראשי תיבות בלי גרשיים (כמש שהוא קמ&quot;ש), וכתיב של מילים לועזיות, ותשאיר את הניסוח המדובר כמו שהוא.<\/div>\n<div class=\"pl\" dir=\"rtl\">4. תתקן את הזמנים לפי עוצמת הקול: אחרי שקט whisper מקדים את המילה <span class=\"nb\">ב-0.1<\/span> עד 0.3 שנייה או מכניס את השקט לתוכה, אז המילה מתחילה ברגע הראשון שבו הקול עולה.<\/div>\n<div class=\"pl\" dir=\"rtl\">5. את שכבת הכתוביות תבנה בעצמך בקוד, כקומפוזיציה של HyperFrames מעל הסרטון, ולא דרך הסקיל <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">embedded-captions<\/span><span class=\"bt\">`<\/span><\/span> שהסקיל <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">hyperframes<\/span><span class=\"bt\">`<\/span><\/span> מפנה אליו, כי אין בו עברית ואין בו את שני הסגנונות.<\/div>\n<div class=\"pl\" dir=\"rtl\">6. אם Rubik לא נמצא בתיקיית הפרויקט, תוריד אותו <span class=\"nb\">מ-Google<\/span> Fonts לתיקייה <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">assets/fonts<\/span><span class=\"bt\">`<\/span><\/span> ותטען אותו עם <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">@font-face<\/span><span class=\"bt\">`<\/span><\/span>.<\/div>\n<div class=\"pl\" dir=\"rtl\">7. אם בחרתי בשני הסגנונות, כל סגנון נבנה בתיקיית פרויקט משלו.<\/div>\n<div class=\"pl\" dir=\"rtl\">8. תמסור את הסרטון עם הכתוביות ובלי הכתוביות, באותה רזולוציה, באותו אורך ועם הקול המקורי (<span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">data-has-audio=&quot;true&quot;<\/span><span class=\"bt\">`<\/span><\/span> בלי <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">muted<\/span><span class=\"bt\">`<\/span><\/span>).<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/בנייה&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"מלכודות\">&lt;מלכודות&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">כל זמן של כתובית מעוגל לפריים, ואחרי הרינדור תבדוק בפריימים שאין בשום החלפה פריים בלי כתובית, כי הבדיקה האוטומטית של HyperFrames לא תופסת את זה.<\/div>\n<div class=\"pl\" dir=\"rtl\">את הטשטוש בקינטי תנפיש בנפרד מהקפיץ, ולא תיתן לו לרדת מתחת <span class=\"nb\">ל-0,<\/span> כי הדפדפן פוסל <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">blur<\/span><span class=\"bt\">`<\/span><\/span> שלילי והמילה נשארת מטושטשת.<\/div>\n<div class=\"pl\" dir=\"rtl\"><span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">dir=&quot;rtl&quot;<\/span><span class=\"bt\">`<\/span><\/span> לא נכנס לתגית <span class=\"nb\">ה-html,<\/span> כי אז הרינדור יוצא שחור.<\/div>\n<div class=\"pl\" dir=\"rtl\">כל מילה <span class=\"nb\">ב-span<\/span> משלה עם <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">dir=&quot;rtl&quot;<\/span><span class=\"bt\">`<\/span><\/span>, אחרת פסיק או נקודה בסוף המילה עוברים לצד הלא נכון.<\/div>\n<div class=\"pl\" dir=\"rtl\">בתוך flex הרווח בין שני span נעלם, אז המרווח בין מילים נקבע עם gap.<\/div>\n<div class=\"pl\" dir=\"rtl\">הפונט נטען עם טקסט עברי, <span class=\"codeblock\" dir=\"rtl\"><span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">document.fonts.load(&#x27;800<\/span> <span class=\"tk\">100px<\/span> <span class=\"tk\">Rubik&#x27;,<\/span> <span class=\"tk\">&#x27;אבג&#x27;)<\/span><span class=\"bt\">`<\/span><\/span>,<\/span>אחרת נטען רק החלק הלטיני ורוחבי המילים יוצאים שגויים.<\/div>\n<div class=\"pl\" dir=\"rtl\">טקסט רק בין x 140 <span class=\"nb\">ל-940<\/span> מתוך 1080, כי בטלפונים גבוהים אינסטגרם חותך את הצדדים.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/מלכודות&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"התחלה\">&lt;התחלה&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">תשאל אותי על הקלט, תתמלל, ותראה לי את כל הכתוביות כרשימת משפטים עם זמנים, עם סימון של כל מילה שתיקנת, של המילים להדגשה ושל מילים שאתה לא בטוח בהן, כדי שאבדוק אותן באוזן.<\/div>\n<div class=\"pl\" dir=\"rtl\">אחרי שאישרתי, תרנדר תצוגה של 10 שניות (תשנה זמנית את <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">data-duration<\/span><span class=\"bt\">`<\/span><\/span> <span class=\"nb\">ל-10<\/span> ותרנדר עם <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">--quality draft<\/span><span class=\"bt\">`<\/span><\/span>), ואת כל הסרטון רק אחרי שאישרתי את הסגנון.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/התחלה&gt;<\/div>"}, "links": []}, {"id": "t23", "num": "2.3", "title": "מ-16:9 ל-9:16, והחיתוך זז עם הפנים", "t": 134.48, "see": "פריים לרוחב עם חדר מאויר וצללית שזזה. קודם חיתוך קבוע (קו מקווקו אפור) חותך חצי ראש, ומסומן X. אחר כך מסגרת אדומה עוקבת אחרי הפנים: רצועת &quot;אזור מת: <span class=\"nb\">כ-8<\/span> אחוז מהרוחב&quot; שבתוכה החיתוך לא זז, וקפיץ רך כשהפנים יוצאות ממנה. לידה הפלט לאורך, עם קו העיניים בשליש העליון וקווי האזור הבטוח 140 <span class=\"nb\">ו-940.<\/span>", "exp": "חיתוך קבוע באמצע יעיף לכם חצי ראש ברגע שזזתם. קלוד מוצא את הפנים בכל פריים, מזיז את החיתוך אחריהן בתנועה רכה, ומשאיר כל טקסט באזור שהטלפון לא חותך.", "fact": "777 מתוך 777 פריימים · הפנים נמצאו בכל הפריימים, וזזו כל כך מעט שהחיתוך נשאר במקום.", "tip": "בטלפונים גבוהים אינסטגרם חותך בערך 100 פיקסלים מכל צד, ולכן טקסט יושב בין פיקסל 140 <span class=\"nb\">ל-940<\/span> מתוך 1080. גם בסרטון הזה.", "prompt": {"n": 3, "text": "<קלט>\nתשאל אותי על שני דברים:\n- איזה סרטון, ואם יש בו יותר מאדם אחד או רגעים שבהם הראיתי משהו בצד של הפריים.\n- אם יש בסרטון טקסט או גרפיקה שצריכים להישאר בתוך הפריים החדש.\n<\/קלט>\n\n<כיוון>\nסרטון של 1080 על 1920 שבו הפנים שלי תמיד בפריים, בלי פסים שחורים למעלה ולמטה.\nהחיתוך זז רק כשהגוף שלי זז באמת, בתנועה רכה, ותנועות קטנות של הראש לא מזיזות אותו.\nהעיניים יושבות בערך בשליש העליון של הפריים, עם מרווח קטן מעל הראש.\nכל טקסט או גרפיקה שנוסיף אחר כך יושבים בין x 140 ל-940, ולא מעל y 250 או מתחת ל-1570.\n<\/כיוון>\n\n<בנייה>\n1. את MediaPipe תתקין בתוך venv עם `pip install mediapipe==0.10.35`, כי הגרסה האחרונה קורסת ב-Mac, ותמצא את הפנים בכל פריים עם `FaceDetector` במצב VIDEO והמודל `blaze_face_short_range.tflite`.\n2. לכל פריים תשמור את מרכז הפנים ואת הרוחב שלהן, וכשיש כמה פנים תבחר את אלו עם הציון הכי גבוה, כי ידיים מזוהות לפעמים כפנים בציון נמוך יותר.\n3. פריים שבו הפנים לא נמצאו מקבל את הערך של הפריים הקרוב שבו הן כן נמצאו.\n4. תחליק את המסלול עם אזור מת של בערך 8 אחוז מרוחב המקור (כ-150 פיקסלים ב-1920), שבתוכו החיתוך לא זז.\n5. כשהפנים יוצאות מהאזור המת, החיתוך זז בקפיץ בלי לעבור את היעד עד שהן חוזרות לקצה האזור, ומהר יותר כשהן קרובות לקצה החלון.\n6. תחתוך מהגובה המלא של המקור חלון ברוחב גובה כפול 9 חלקי 16, ותגדיל אותו ל-1080 על 1920.\n7. תחתוך כל פריים בסקריפט Python ותעביר אותו ישר ל-ffmpeg, ואז תחזיר את הקול המקורי בלי קידוד מחדש.\n8. בחיתוך חד במקור (scene מעל 0.3 ב-ffmpeg) החיתוך החדש קופץ למקום החדש באותו פריים.\n<\/בנייה>\n\n<מלכודות>\nממקור של 1920 על 1080 החלון מוגדל כמעט פי 2, אז אם יש לי קובץ 4K תעבוד ממנו, ותגיד לי אם האיכות נפגעת.\nאדם נוסף נחשב רק אם הוא מופיע יותר משנייה ברצף בציון מעל 0.8, ואם הוא או משהו חשוב לא נכנסים לפריים, תעצור ותשאל אותי.\nהחיתוך אף פעם לא יוצא מגבולות המקור, גם כשהפנים קרובות לקצה.\nאם העיניים לא יוצאות בשליש העליון תגיד לי, כי חיתוך מהגובה המלא לא יכול להזיז אותן.\n<\/מלכודות>\n\n<התחלה>\nתשאל אותי על הקלט, תריץ את זיהוי הפנים, ותראה לי גיליון של 6 פריימים לפני ואחרי מרגעים שונים בסרטון.\nאם החיתוך נשאר קבוע כי כמעט לא זזתי, תגיד לי את זה ליד הגיליון.\nאחרי שאישרתי, תרנדר ברזולוציה נמוכה את 10 השניות שבהן זזתי הכי הרבה, ואת כל הסרטון רק אחרי האישור השני.\n<\/התחלה>", "note": "", "html": "<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"קלט\">&lt;קלט&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">תשאל אותי על שני דברים:<\/div>\n<div class=\"pl\" dir=\"rtl\">- איזה סרטון, ואם יש בו יותר מאדם אחד או רגעים שבהם הראיתי משהו בצד של הפריים.<\/div>\n<div class=\"pl\" dir=\"rtl\">- אם יש בסרטון טקסט או גרפיקה שצריכים להישאר בתוך הפריים החדש.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/קלט&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"כיוון\">&lt;כיוון&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">סרטון של 1080 על 1920 שבו הפנים שלי תמיד בפריים, בלי פסים שחורים למעלה ולמטה.<\/div>\n<div class=\"pl\" dir=\"rtl\">החיתוך זז רק כשהגוף שלי זז באמת, בתנועה רכה, ותנועות קטנות של הראש לא מזיזות אותו.<\/div>\n<div class=\"pl\" dir=\"rtl\">העיניים יושבות בערך בשליש העליון של הפריים, עם מרווח קטן מעל הראש.<\/div>\n<div class=\"pl\" dir=\"rtl\">כל טקסט או גרפיקה שנוסיף אחר כך יושבים בין x 140 <span class=\"nb\">ל-940,<\/span> ולא מעל y 250 או מתחת <span class=\"nb\">ל-1570.<\/span><\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/כיוון&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"בנייה\">&lt;בנייה&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">1. את MediaPipe תתקין בתוך venv עם <span class=\"codeblock\" dir=\"rtl\"><span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">pip<\/span> <span class=\"tk\">install<\/span> <span class=\"tk\">mediapipe==0.10.35<\/span><span class=\"bt\">`<\/span><\/span>,<\/span>כי הגרסה האחרונה קורסת <span class=\"nb\">ב-Mac,<\/span> ותמצא את הפנים בכל פריים עם <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">FaceDetector<\/span><span class=\"bt\">`<\/span><\/span> במצב VIDEO והמודל <span class=\"codeblock\" dir=\"rtl\"><span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">blaze_face_short_range.tflite<\/span><span class=\"bt\">`<\/span><\/span>.<\/span><\/div>\n<div class=\"pl\" dir=\"rtl\">2. לכל פריים תשמור את מרכז הפנים ואת הרוחב שלהן, וכשיש כמה פנים תבחר את אלו עם הציון הכי גבוה, כי ידיים מזוהות לפעמים כפנים בציון נמוך יותר.<\/div>\n<div class=\"pl\" dir=\"rtl\">3. פריים שבו הפנים לא נמצאו מקבל את הערך של הפריים הקרוב שבו הן כן נמצאו.<\/div>\n<div class=\"pl\" dir=\"rtl\">4. תחליק את המסלול עם אזור מת של בערך 8 אחוז מרוחב המקור (<span class=\"nb\">כ-150<\/span> פיקסלים <span class=\"nb\">ב-1920),<\/span> שבתוכו החיתוך לא זז.<\/div>\n<div class=\"pl\" dir=\"rtl\">5. כשהפנים יוצאות מהאזור המת, החיתוך זז בקפיץ בלי לעבור את היעד עד שהן חוזרות לקצה האזור, ומהר יותר כשהן קרובות לקצה החלון.<\/div>\n<div class=\"pl\" dir=\"rtl\">6. תחתוך מהגובה המלא של המקור חלון ברוחב גובה כפול 9 חלקי 16, ותגדיל אותו <span class=\"nb\">ל-1080<\/span> על 1920.<\/div>\n<div class=\"pl\" dir=\"rtl\">7. תחתוך כל פריים בסקריפט Python ותעביר אותו ישר <span class=\"nb\">ל-ffmpeg,<\/span> ואז תחזיר את הקול המקורי בלי קידוד מחדש.<\/div>\n<div class=\"pl\" dir=\"rtl\">8. בחיתוך חד במקור (scene מעל 0.3 <span class=\"nb\">ב-ffmpeg)<\/span> החיתוך החדש קופץ למקום החדש באותו פריים.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/בנייה&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"מלכודות\">&lt;מלכודות&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">ממקור של 1920 על 1080 החלון מוגדל כמעט פי 2, אז אם יש לי קובץ 4K תעבוד ממנו, ותגיד לי אם האיכות נפגעת.<\/div>\n<div class=\"pl\" dir=\"rtl\">אדם נוסף נחשב רק אם הוא מופיע יותר משנייה ברצף בציון מעל 0.8, ואם הוא או משהו חשוב לא נכנסים לפריים, תעצור ותשאל אותי.<\/div>\n<div class=\"pl\" dir=\"rtl\">החיתוך אף פעם לא יוצא מגבולות המקור, גם כשהפנים קרובות לקצה.<\/div>\n<div class=\"pl\" dir=\"rtl\">אם העיניים לא יוצאות בשליש העליון תגיד לי, כי חיתוך מהגובה המלא לא יכול להזיז אותן.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/מלכודות&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"התחלה\">&lt;התחלה&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">תשאל אותי על הקלט, תריץ את זיהוי הפנים, ותראה לי גיליון של 6 פריימים לפני ואחרי מרגעים שונים בסרטון.<\/div>\n<div class=\"pl\" dir=\"rtl\">אם החיתוך נשאר קבוע כי כמעט לא זזתי, תגיד לי את זה ליד הגיליון.<\/div>\n<div class=\"pl\" dir=\"rtl\">אחרי שאישרתי, תרנדר ברזולוציה נמוכה את 10 השניות שבהן זזתי הכי הרבה, ואת כל הסרטון רק אחרי האישור השני.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/התחלה&gt;<\/div>"}, "links": []}, {"id": "t24", "num": "2.4", "title": "דוחפים לצבע המותג, והעור נשאר טבעי", "t": 168.54, "see": "פריים מאויר עם קיר, חולצה ופנים. מעליו גלגל גוונים: נקודת המותג, טריז מוגן סביב גוון העור (12 מעלות ובמעבר חלק עד 30), עיגול אפור במרכז שלא זז, וחצים שמושכים גוונים קרובים לכיוון המותג. אחר כך שלוש עוצמות זו לצד זו: עדין 1.55 · בינוני 1.85 · חזק 2.2, עם תווית &quot;בבינוני ובחזק העור זהה, כי ההגברה שלו נעצרת בפי 1.2&quot;.", "exp": "קלוד מגביר את הצבעים ומושך לכיוון צבע המותג רק את מה שכבר קרוב אליו, כמו קיר או חולצה. העור מקבל רק רבע מההגברה, עם תקרה, וצבעים שכמעט אפורים לא זזים, כדי שחולצה שחורה לא תכחיל.", "fact": "בניסיון הראשון כל התמונה נמשכה לסגול והפנים יצאו ורודות. שמירה נפרדת על העור ומודל שמזהה עור בכל פריים פתרו את זה.", "tip": "צבע מותג קרוב לעור, כמו כתום או אדום? קלוד יגיד מראש שהדחיפה תצבע גם את הפנים.", "prompt": {"n": 4, "text": "<קלט>\nתשאל אותי על שני דברים:\n- איזה סרטון, אם יש כמה בתיקייה.\n- צבע המותג שלי, כקוד hex או כתמונה של הלוגו.\n<\/קלט>\n\n<כיוון>\nצבעים חיים יותר, עם נטייה ברורה לצבע המותג שלי.\nהבהירות לא זזה, לבן ושחור נשארים ניטרליים, והעור טבעי, בלי כתום ובלי ורוד, גם תחת אור צבעוני.\n<\/כיוון>\n\n<בנייה>\n1. תוציא 3 פריימים: הפנים הכי גדולות, הכי קטנות, וה-SATAVG הכי גבוה, ואם גודל הפנים כמעט קבוע, מההתחלה ומהסוף במקום שני הראשונים.\n2. תעבוד עם `mediapipe.tasks` במצב VIDEO, ב-`mediapipe==0.10.35` שאין בה `mp.solutions`: `FaceDetector` עם `blaze_face_short_range.tflite` מ-`https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/latest/blaze_face_short_range.tflite`, ו-`ImageSegmenter` עם `selfie_multiclass_256x256.tflite` מ-`https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite`.\n3. תמדוד SATAVG עם `signalstats`, ועל העור L* ו-C* ב-Lab, ואת הגוון של העור ושל ריבוע בצבע המותג בזווית ה-UV של signalstats.\n4. את המצח תמדוד מעל תיבת הפנים, שמתחילה בגבות, ואת הלחיים בתוכה בין גובה העיניים לאף, ותבדוק בתמונה שהריבועים על עור חשוף, כי הנקודות של `FaceDetector` זזות בכ-20 פיקסלים.\n5. תבנה LUT בפורמט cube שעובד באותה זווית UV ולא נוגע בלומה: פיקסלים עד 12 מעלות מגוון העור שבריבועים, ובמעבר חלק עד 30, שומרים על הגוון ומקבלים רבע מהגברת הרוויה, עד פי 1.2, וכל השאר מקבלים את כולה.\nפיקסלים כמעט אפורים, עם כרומת UV מתחת ל-0.02 בסקאלה עד 0.5, נשארים כמו שהם, ומעל 0.06 מקבלים את הטיפול המלא, במעבר חלק.\n6. גוונים במרחק עד 120 מעלות מהמותג נמשכים אליו בעקומה חלקה, אפס במותג ובקצה ועד 30 מעלות באמצע.\n7. LUT שני, עם הטיפול של העור לכל גוון, עובד בתוך מסכת עור מ-`ImageSegmenter`: עור הפנים (מחלקה 3) ועור הגוף (מחלקה 2), מורחבת בכ-6 פיקסלים ועם שוליים מטושטשים.\nאת המסכות תשמור כסרטון (`-c:v ffv1 -pix_fmt gray`) באותו קצב פריימים, ותכניס אותו לשרשרת כקלט שני עם `format=gray`.\n8. בלי `eq`, שמעלה לבד את L* של העור בכ-1.6: השרשרת היא `split` ל-LUT המלא ול-LUT העור, שעובר `alphamerge` עם המסכה ו-`overlay=format=gbrp` מעל המלא, ובמלא רוויה של 1.85 לבינוני, 1.55 לעדין ו-2.2 לחזק.\n9. תמדוד על פריים שעבר את השרשרת ישר מהסרטון, לא מ-PNG, ושוב אחרי הרינדור.\n10. הבדיקות: SATAVG עולה, L* של העור זז בעד 2, C* שלו עולה בעד 25 אחוז בריבועים ובאחוזון 95 במסכה, YAVG של כל הסרטון זז בפחות מ-3 אחוז, והקיר ליד הראש מתחזק כמו הקיר הרחוק, בלי הילה.\n11. תמסור עם הקול המקורי בלי קידוד מחדש.\n<\/בנייה>\n\n<מלכודות>\nאם צבע המותג קרוב לגוון העור, תגיד לי שהוא יצבע גם את הפנים, ואם נתתי כמה בלי לבחור, תדחוף לרחוק מהעור ותגיד למה.\nעור באור צבעוני מקבל את גוון האור ורק המסכה מגינה עליו, אז תראה לי בתקריב לפני ואחרי את הפנים, הצוואר והידיים.\n<\/מלכודות>\n\n<התחלה>\nתשאל אותי על הקלט, ותראה לי פריים אחד בשלוש עוצמות, לפני ואחרי זה לצד זה, עם המספרים.\nתגיד לי שבבינוני ובחזק העור זהה, כי ההגברה שלו נעצרת בפי 1.2.\nאל תרנדר את כל הסרטון לפני שבחרתי עוצמה.\n<\/התחלה>", "note": "", "html": "<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"קלט\">&lt;קלט&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">תשאל אותי על שני דברים:<\/div>\n<div class=\"pl\" dir=\"rtl\">- איזה סרטון, אם יש כמה בתיקייה.<\/div>\n<div class=\"pl\" dir=\"rtl\">- צבע המותג שלי, כקוד hex או כתמונה של הלוגו.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/קלט&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"כיוון\">&lt;כיוון&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">צבעים חיים יותר, עם נטייה ברורה לצבע המותג שלי.<\/div>\n<div class=\"pl\" dir=\"rtl\">הבהירות לא זזה, לבן ושחור נשארים ניטרליים, והעור טבעי, בלי כתום ובלי ורוד, גם תחת אור צבעוני.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/כיוון&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"בנייה\">&lt;בנייה&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">1. תוציא 3 פריימים: הפנים הכי גדולות, הכי קטנות, <span class=\"nb\">וה-SATAVG<\/span> הכי גבוה, ואם גודל הפנים כמעט קבוע, מההתחלה ומהסוף במקום שני הראשונים.<\/div>\n<div class=\"pl\" dir=\"rtl\">2. תעבוד עם <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">mediapipe.tasks<\/span><span class=\"bt\">`<\/span><\/span> במצב VIDEO, ב-<span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">mediapipe==0.10.35<\/span><span class=\"bt\">`<\/span><\/span> שאין בה <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">mp.solutions<\/span><span class=\"bt\">`<\/span><\/span>: <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">FaceDetector<\/span><span class=\"bt\">`<\/span><\/span> עם <span class=\"codeblock\" dir=\"rtl\"><span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">blaze_face_short_range.tflite<\/span><span class=\"bt\">`<\/span><\/span><\/span><span class=\"codeblock\" dir=\"rtl\">מ-<span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">https://<\/span><wbr><span class=\"tk\">storage.googleapis.com/<\/span><wbr><span class=\"tk\">mediapipe-models/<\/span><wbr><span class=\"tk\">face_detector/<\/span><wbr><span class=\"tk\">blaze_face_short_range/<\/span><wbr><span class=\"tk\">float16/<\/span><wbr><span class=\"tk\">latest/<\/span><wbr><span class=\"tk\">blaze_face_short_range.tflite<\/span><span class=\"bt\">`<\/span><\/span>,<\/span>ו-<span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">ImageSegmenter<\/span><span class=\"bt\">`<\/span><\/span> עם <span class=\"codeblock\" dir=\"rtl\"><span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">selfie_multiclass_256x256.tflite<\/span><span class=\"bt\">`<\/span><\/span><\/span><span class=\"codeblock\" dir=\"rtl\">מ-<span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">https://<\/span><wbr><span class=\"tk\">storage.googleapis.com/<\/span><wbr><span class=\"tk\">mediapipe-models/<\/span><wbr><span class=\"tk\">image_segmenter/<\/span><wbr><span class=\"tk\">selfie_multiclass_256x256/<\/span><wbr><span class=\"tk\">float32/<\/span><wbr><span class=\"tk\">latest/<\/span><wbr><span class=\"tk\">selfie_multiclass_256x256.tflite<\/span><span class=\"bt\">`<\/span><\/span>.<\/span><\/div>\n<div class=\"pl\" dir=\"rtl\">3. תמדוד SATAVG עם <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">signalstats<\/span><span class=\"bt\">`<\/span><\/span>, ועל העור <span dir=\"ltr\" class=\"neg\">L*<\/span> <span class=\"nb\">ו-<span dir=\"ltr\" class=\"neg\">C*<\/span><\/span> <span class=\"nb\">ב-Lab,<\/span> ואת הגוון של העור ושל ריבוע בצבע המותג בזווית <span class=\"nb\">ה-UV<\/span> של signalstats.<\/div>\n<div class=\"pl\" dir=\"rtl\">4. את המצח תמדוד מעל תיבת הפנים, שמתחילה בגבות, ואת הלחיים בתוכה בין גובה העיניים לאף, ותבדוק בתמונה שהריבועים על עור חשוף, כי הנקודות של <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">FaceDetector<\/span><span class=\"bt\">`<\/span><\/span> זזות <span class=\"nb\">בכ-20<\/span> פיקסלים.<\/div>\n<div class=\"pl\" dir=\"rtl\">5. תבנה LUT בפורמט cube שעובד באותה זווית UV ולא נוגע בלומה: פיקסלים עד 12 מעלות מגוון העור שבריבועים, ובמעבר חלק עד 30, שומרים על הגוון ומקבלים רבע מהגברת הרוויה, עד פי 1.2, וכל השאר מקבלים את כולה.<\/div>\n<div class=\"pl\" dir=\"rtl\">פיקסלים כמעט אפורים, עם כרומת UV מתחת <span class=\"nb\">ל-0.02<\/span> בסקאלה עד 0.5, נשארים כמו שהם, ומעל 0.06 מקבלים את הטיפול המלא, במעבר חלק.<\/div>\n<div class=\"pl\" dir=\"rtl\">6. גוונים במרחק עד 120 מעלות מהמותג נמשכים אליו בעקומה חלקה, אפס במותג ובקצה ועד 30 מעלות באמצע.<\/div>\n<div class=\"pl\" dir=\"rtl\">7. LUT שני, עם הטיפול של העור לכל גוון, עובד בתוך מסכת עור מ-<span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">ImageSegmenter<\/span><span class=\"bt\">`<\/span><\/span>: עור הפנים (מחלקה 3) ועור הגוף (מחלקה 2), מורחבת <span class=\"nb\">בכ-6<\/span> פיקסלים ועם שוליים מטושטשים.<\/div>\n<div class=\"pl\" dir=\"rtl\">את המסכות תשמור כסרטון (<span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">-c:v ffv1<\/span> <span class=\"tk\">-pix_fmt gray<\/span><span class=\"bt\">`<\/span><\/span>) באותו קצב פריימים, ותכניס אותו לשרשרת כקלט שני עם <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">format=gray<\/span><span class=\"bt\">`<\/span><\/span>.<\/div>\n<div class=\"pl\" dir=\"rtl\">8. בלי <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">eq<\/span><span class=\"bt\">`<\/span><\/span>, שמעלה לבד את <span dir=\"ltr\" class=\"neg\">L*<\/span> של העור <span class=\"nb\">בכ-1.6:<\/span> השרשרת היא <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">split<\/span><span class=\"bt\">`<\/span><\/span> <span class=\"nb\">ל-LUT<\/span> המלא <span class=\"nb\">ול-LUT<\/span> העור, שעובר <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">alphamerge<\/span><span class=\"bt\">`<\/span><\/span> עם המסכה ו-<span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">overlay=format=gbrp<\/span><span class=\"bt\">`<\/span><\/span> מעל המלא, ובמלא רוויה של 1.85 לבינוני, 1.55 לעדין <span class=\"nb\">ו-2.2<\/span> לחזק.<\/div>\n<div class=\"pl\" dir=\"rtl\">9. תמדוד על פריים שעבר את השרשרת ישר מהסרטון, לא <span class=\"nb\">מ-PNG,<\/span> ושוב אחרי הרינדור.<\/div>\n<div class=\"pl\" dir=\"rtl\">10. הבדיקות: SATAVG עולה, <span dir=\"ltr\" class=\"neg\">L*<\/span> של העור זז בעד 2, <span dir=\"ltr\" class=\"neg\">C*<\/span> שלו עולה בעד 25 אחוז בריבועים ובאחוזון 95 במסכה, YAVG של כל הסרטון זז בפחות <span class=\"nb\">מ-3<\/span> אחוז, והקיר ליד הראש מתחזק כמו הקיר הרחוק, בלי הילה.<\/div>\n<div class=\"pl\" dir=\"rtl\">11. תמסור עם הקול המקורי בלי קידוד מחדש.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/בנייה&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"מלכודות\">&lt;מלכודות&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">אם צבע המותג קרוב לגוון העור, תגיד לי שהוא יצבע גם את הפנים, ואם נתתי כמה בלי לבחור, תדחוף לרחוק מהעור ותגיד למה.<\/div>\n<div class=\"pl\" dir=\"rtl\">עור באור צבעוני מקבל את גוון האור ורק המסכה מגינה עליו, אז תראה לי בתקריב לפני ואחרי את הפנים, הצוואר והידיים.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/מלכודות&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"התחלה\">&lt;התחלה&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">תשאל אותי על הקלט, ותראה לי פריים אחד בשלוש עוצמות, לפני ואחרי זה לצד זה, עם המספרים.<\/div>\n<div class=\"pl\" dir=\"rtl\">תגיד לי שבבינוני ובחזק העור זהה, כי ההגברה שלו נעצרת בפי 1.2.<\/div>\n<div class=\"pl\" dir=\"rtl\">אל תרנדר את כל הסרטון לפני שבחרתי עוצמה.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/התחלה&gt;<\/div>"}, "links": [{"label": "מודל זיהוי הפנים של MediaPipe (blaze_face_short_range)", "url": "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/latest/blaze_face_short_range.tflite"}, {"label": "מודל זיהוי העור של MediaPipe (selfie_multiclass_256x256)", "url": "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite"}]}, {"id": "t25", "num": "2.5", "title": "קול באותה עוצמה: מינוס 14 LUFS", "t": 206.05, "see": "גל קול לא אחיד עם שיאים אדומים &quot;נשרף&quot;, ומד LUFS. &quot;מעבר 1: מדידה&quot; ואחריו &quot;מעבר 2: linear&quot;, והגל מתיישר: קו יעד במינוס 14 ותקרת שיא במינוס 1. שלושה ערוצים: דיבור · מוזיקה (9 עד 13 dB מתחת לדיבור, ויורדת עוד 2 עד 4 בזמן דיבור) · אפקטים (בלי בס, highpass 200Hz).", "exp": "גוללים בפיד, סרטון אחד צועק והבא כמעט לוחש? היעד הוא מינוס 14 LUFS, היחידה שמודדת כמה חזק משהו נשמע לאוזן. קלוד מודד, מכוון ומודד שוב, ובדרך מנקה את הבס מהאפקטים הקוליים.", "fact": "מינוס 13.9 LUFS · אחרי התיקון, בלי אף רגע שנשרף. · גם הסאונד של הסרטון הזה עבר נרמול ככה: מינוס 14 LUFS, שיא עד מינוס 1.", "tip": "מבקשים &quot;קצת יותר שקט&quot;? זה בערך 3 דציבלים, שנמדדים מול הגרסה הקודמת.", "prompt": {"n": 5, "text": "<קלט>\nתשאל אותי אם בסרטון יש רק דיבור, או גם מוזיקה ואפקטים, ואם הם בקבצים נפרדים, תבקש ממני את הנתיב של כל קובץ.\n<\/קלט>\n\n<כיוון>\nהדיבור ברור ובאותה עוצמה מההתחלה ועד הסוף.\nהעוצמה הכוללת היא -14 LUFS, והשיא האמיתי (true peak) לא עובר את -1.\nהאפקטים בלי בס, ונשמעים כמו אוויר, תקתוק או נגיעה עדינה ולא כמו חבטה.\nהמוזיקה, אם יש, נמוכה ב-9 עד 13 dB מהדיבור, ובזמן שמדברים היא יורדת עוד 2 עד 4 dB.\nכל אפקט יושב 23 עד 33 dB מתחת לדיבור, בעוצמה הרגעית (400ms) בשיא שלו מול החציון של הדיבור, ואף אחד לא בולט מעליו.\n<\/כיוון>\n\n<בנייה>\n1. תמדוד את המקור עם `ffmpeg -i <קובץ> -af loudnorm=I=-14:TP=-1:LRA=11:print_format=json -f null -` ותראה לי את המספרים.\n2. על כל אפקט `highpass=f=200`.\n3. אם יש מוזיקה, היא יורדת מתחת לדיבור עם `sidechaincompress`, כשהדיבור מפעיל אותה.\n4. אחרי המיקס, נרמול בשני מעברים: המעבר השני מקבל את הערכים שנמדדו בראשון (measured_I, measured_TP, measured_LRA, measured_thresh ו-offset) עם `linear=true`.\n5. אחרי המעבר השני תבדוק שבשורה normalization_type כתוב linear, ואם כתוב dynamic, תוריד קודם את השיאים עם `alimiter` ב-192kHz, עם גבול שמשאיר את השיא מתחת למינוס 1 גם אחרי ההגברה, תמדוד שוב ותריץ שוב את המעבר השני.\n6. תחזיר את הקול לווידאו בלי לקודד את התמונה מחדש.\n7. תמדוד שוב את הקובץ הסופי: העוצמה -14 LUFS עם סטייה של עד חצי יחידה, השיא עד -1, ופחות מאחוז אחד מהאנרגיה של האפקטים מתחת ל-200Hz.\n<\/בנייה>\n\n<מלכודות>\nנרמול במעבר אחד עובד במצב דינמי ומזיז את העוצמה לאורך הסרטון, ולכן תמיד שני מעברים.\nל-`alimiter` תמיד `level=false`, כי ברירת המחדל מרימה את כל הקול עד 0 dBFS והורסת את המדידה.\nloudnorm מוציא קול ב-192kHz, אז תחזיר אותו ל-48kHz עם `-ar 48000`.\nכשאבקש \"קצת יותר שקט\" או \"קצת יותר חזק\", זה בערך 3dB, שנמדדים בחלונות קצרים מול הגרסה הקודמת.\n<\/מלכודות>\n\n<התחלה>\nתשאל אותי על הקלט, תמדוד, ותראה לי לפני ואחרי את העוצמה, השיא והטווח, יחד עם ההגדרות שאתה מתכוון להפעיל.\n<\/התחלה>", "note": "", "html": "<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"קלט\">&lt;קלט&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">תשאל אותי אם בסרטון יש רק דיבור, או גם מוזיקה ואפקטים, ואם הם בקבצים נפרדים, תבקש ממני את הנתיב של כל קובץ.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/קלט&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"כיוון\">&lt;כיוון&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">הדיבור ברור ובאותה עוצמה מההתחלה ועד הסוף.<\/div>\n<div class=\"pl\" dir=\"rtl\">העוצמה הכוללת היא <span dir=\"ltr\" class=\"neg\">-14 LUFS<\/span>, והשיא האמיתי (true peak) לא עובר את <span dir=\"ltr\" class=\"neg\">-1<\/span>.<\/div>\n<div class=\"pl\" dir=\"rtl\">האפקטים בלי בס, ונשמעים כמו אוויר, תקתוק או נגיעה עדינה ולא כמו חבטה.<\/div>\n<div class=\"pl\" dir=\"rtl\">המוזיקה, אם יש, נמוכה <span class=\"nb\">ב-9<\/span> עד 13 dB מהדיבור, ובזמן שמדברים היא יורדת עוד 2 עד 4 dB.<\/div>\n<div class=\"pl\" dir=\"rtl\">כל אפקט יושב 23 עד 33 dB מתחת לדיבור, בעוצמה הרגעית (400ms) בשיא שלו מול החציון של הדיבור, ואף אחד לא בולט מעליו.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/כיוון&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"בנייה\">&lt;בנייה&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">1. תמדוד את המקור עם <span class=\"codeblock\" dir=\"rtl\"><span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">ffmpeg<\/span> <span class=\"tk\">-i <bdi dir=\"ltr\">&lt;קובץ&gt;<\/bdi><\/span> <span class=\"tk\">-af loudnorm=I=-14:<\/span><wbr><span class=\"tk\">TP=-1:<\/span><wbr><span class=\"tk\">LRA=11:<\/span><wbr><span class=\"tk\">print_format=json<\/span> <span class=\"tk\">-f null<\/span> <span class=\"tk\">-<\/span><span class=\"bt\">`<\/span><\/span><\/span>ותראה לי את המספרים.<\/div>\n<div class=\"pl\" dir=\"rtl\">2. על כל אפקט <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">highpass=f=200<\/span><span class=\"bt\">`<\/span><\/span>.<\/div>\n<div class=\"pl\" dir=\"rtl\">3. אם יש מוזיקה, היא יורדת מתחת לדיבור עם <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">sidechaincompress<\/span><span class=\"bt\">`<\/span><\/span>, כשהדיבור מפעיל אותה.<\/div>\n<div class=\"pl\" dir=\"rtl\">4. אחרי המיקס, נרמול בשני מעברים: המעבר השני מקבל את הערכים שנמדדו בראשון (measured_I, measured_TP, measured_LRA, measured_thresh <span class=\"nb\">ו-offset)<\/span> עם <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">linear=true<\/span><span class=\"bt\">`<\/span><\/span>.<\/div>\n<div class=\"pl\" dir=\"rtl\">5. אחרי המעבר השני תבדוק שבשורה normalization_type כתוב linear, ואם כתוב dynamic, תוריד קודם את השיאים עם <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">alimiter<\/span><span class=\"bt\">`<\/span><\/span> <span class=\"nb\">ב-192kHz,<\/span> עם גבול שמשאיר את השיא מתחת למינוס 1 גם אחרי ההגברה, תמדוד שוב ותריץ שוב את המעבר השני.<\/div>\n<div class=\"pl\" dir=\"rtl\">6. תחזיר את הקול לווידאו בלי לקודד את התמונה מחדש.<\/div>\n<div class=\"pl\" dir=\"rtl\">7. תמדוד שוב את הקובץ הסופי: העוצמה <span dir=\"ltr\" class=\"neg\">-14 LUFS<\/span> עם סטייה של עד חצי יחידה, השיא עד <span dir=\"ltr\" class=\"neg\">-1<\/span>, ופחות מאחוז אחד מהאנרגיה של האפקטים מתחת <span class=\"nb\">ל-200Hz.<\/span><\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/בנייה&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"מלכודות\">&lt;מלכודות&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">נרמול במעבר אחד עובד במצב דינמי ומזיז את העוצמה לאורך הסרטון, ולכן תמיד שני מעברים.<\/div>\n<div class=\"pl\" dir=\"rtl\">ל-<span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">alimiter<\/span><span class=\"bt\">`<\/span><\/span> תמיד <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">level=false<\/span><span class=\"bt\">`<\/span><\/span>, כי ברירת המחדל מרימה את כל הקול עד 0 dBFS והורסת את המדידה.<\/div>\n<div class=\"pl\" dir=\"rtl\">loudnorm מוציא קול <span class=\"nb\">ב-192kHz,<\/span> אז תחזיר אותו <span class=\"nb\">ל-48kHz<\/span> עם <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">-ar 48000<\/span><span class=\"bt\">`<\/span><\/span>.<\/div>\n<div class=\"pl\" dir=\"rtl\">כשאבקש &quot;קצת יותר שקט&quot; או &quot;קצת יותר חזק&quot;, זה בערך 3dB, שנמדדים בחלונות קצרים מול הגרסה הקודמת.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/מלכודות&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"התחלה\">&lt;התחלה&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">תשאל אותי על הקלט, תמדוד, ותראה לי לפני ואחרי את העוצמה, השיא והטווח, יחד עם ההגדרות שאתה מתכוון להפעיל.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/התחלה&gt;<\/div>"}, "links": []}, {"id": "t26", "num": "2.6", "title": "טעיתם במשפט? מחליפים רק אותו", "t": 240.07, "see": "גל קול עם סימון מילים. המשפט &quot;200 אלף קמ״ש&quot; מסומן באדום. גרף עוצמה עם קו בכל תחילת מילה, ונקודות החיתוך נצמדות לשקע הקרוב. ההקלטה החדשה, &quot;200 אלף קילומטר בשנייה&quot;, נכנסת למקום, עם תגיות &quot;רעש רקע ✓ · EQ ✓ · עוצמה ✓ · fade של 40ms&quot;. הערוצים שאחריה (כתוביות, אפקטים, בירולים) זזים לפי ההפרש באורך.", "exp": "קלוד חותך את המשפט השגוי בתוך שקט, מכניס במקומו הקלטה חדשה ומתאים לה את הצליל והעוצמה של הקריינות שמסביב, כך שלא שומעים את החיבור. רואים את הפה? הוא יציע בירול או זווית אחרת שתכסה אותו.", "fact": "בדוגמה מהמדריך הוקלט מחדש רק המשפט הזה, וקלוד שתל אותו במקום הישן.", "tip": "מקליטים את המשפט החדש עם שנייה של שקט לפני ואחרי, ואם אפשר מאותו מיקרופון ובאותו חדר.", "prompt": {"n": 6, "text": "<קלט>\nתשאל אותי על ארבעה דברים:\n- הסרטון או קובץ הקריינות המקורי.\n- ההקלטה החדשה, מאותו מיקרופון ובאותו חדר אם אפשר, עם שנייה של שקט לפני המשפט ואחריו.\n- איזה משפט מוחלף, כמו שנאמר במקור.\n- אם רואים את הפה שלי בזמן המשפט, כי אז השפתיים לא יתאימו למילים החדשות, ואיזה בירול או חיתוך לזווית אחרת יכסה אותו (תציע לי אחד מתוך הסרטון).\n<\/קלט>\n\n<כיוון>\nמי שמקשיב לא שומע איפה נכנס המשפט החדש.\nאותו צבע של קול, אותה עוצמה, אותו רעש רקע, ובלי קליק או נשימה קטועה בחיבור.\n<\/כיוון>\n\n<בנייה>\n1. תתמלל את המקור ואת ההקלטה החדשה עם `npx hyperframes transcribe <קובץ> --language he --model large-v3`, כל קובץ בתיקייה משלו, כי הפקודה דורסת את transcript.json שבתיקייה.\n2. תמצא את המשפט השגוי לפי הטקסט, ותחתוך בתוך השקט שלפניו ובתוך השקט שאחריו.\n3. את ההקלטה החדשה תגזום ל-50 אלפיות שנייה לפני המילה הראשונה ול-60 אלפיות שנייה אחרי המילה האחרונה.\n4. תמדוד את רעש הרקע בשקטים של שני הקבצים, ואם ההקלטה החדשה רועשת יותר תפעיל `afftdn=nr=6`, ואם היא שקטה יותר תוסיף לה רעש רקע מהשקטים של המקור.\n5. EQ שמתאים את ההקלטה החדשה למשפט שהיא מחליפה: תמדוד את הספקטרום של שניהם ותפעיל בערך 80 אחוז מההפרש, רק בין 100Hz ל-10kHz ועד 6 dB לכל כיוון.\n6. תתאים את העוצמה לדיבור הפעיל ב-10 השניות שלפני החיבור, בלי השקטים.\n7. fade של 40 אלפיות שנייה בכל צד של החיבור.\n8. אם ההקלטה החדשה ארוכה או קצרה מהמקורית, כל מה שבא אחריה זז באותו הפרש: הכתוביות, האפקטים והבירולים.\n9. משפט חדש קצר יותר מקצר את הווידאו שמתחתיו מהסוף שלו, ומשפט ארוך יותר מקבל בירול שמכסה את ההפרש.\n10. אם יש אנימציה שמסונכרנת למילים בתוך המשפט, כל מילה חדשה מוצמדת לרגע באנימציה שהיה שייך למילה המקבילה במקור.\n11. תמסור את הסרטון המתוקן, ובנוסף את הקריינות המתוקנת כקובץ wav נפרד.\n<\/בנייה>\n\n<מלכודות>\nהזמנים של whisper יכולים לזוז עד שנייה, ובמיוחד במילה הראשונה בקובץ (נמדדה גם סטייה של 0.73 שנייה).\nלכן תכין תמונה של גרף העוצמה עם קו בכל תחילת מילה, וכל נקודת חיתוך יושבת על השקע הקרוב בגרף, ולא על הזמן של whisper.\nEQ מול כל הקריינות במקום מול המשפט המוחלף יוצא פחות מדויק, כי הצלילים במשפטים אחרים שונים.\n<\/מלכודות>\n\n<התחלה>\nתשאל אותי על הקלט, ותכין קטע של 10 שניות סביב החיבור כדי שאקשיב לו לפני שאתה מחליף בסרטון המלא.\n<\/התחלה>", "note": "", "html": "<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"קלט\">&lt;קלט&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">תשאל אותי על ארבעה דברים:<\/div>\n<div class=\"pl\" dir=\"rtl\">- הסרטון או קובץ הקריינות המקורי.<\/div>\n<div class=\"pl\" dir=\"rtl\">- ההקלטה החדשה, מאותו מיקרופון ובאותו חדר אם אפשר, עם שנייה של שקט לפני המשפט ואחריו.<\/div>\n<div class=\"pl\" dir=\"rtl\">- איזה משפט מוחלף, כמו שנאמר במקור.<\/div>\n<div class=\"pl\" dir=\"rtl\">- אם רואים את הפה שלי בזמן המשפט, כי אז השפתיים לא יתאימו למילים החדשות, ואיזה בירול או חיתוך לזווית אחרת יכסה אותו (תציע לי אחד מתוך הסרטון).<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/קלט&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"כיוון\">&lt;כיוון&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">מי שמקשיב לא שומע איפה נכנס המשפט החדש.<\/div>\n<div class=\"pl\" dir=\"rtl\">אותו צבע של קול, אותה עוצמה, אותו רעש רקע, ובלי קליק או נשימה קטועה בחיבור.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/כיוון&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"בנייה\">&lt;בנייה&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">1. תתמלל את המקור ואת ההקלטה החדשה עם <span class=\"codeblock\" dir=\"rtl\"><span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">npx<\/span> <span class=\"tk\">hyperframes<\/span> <span class=\"tk\">transcribe<\/span> <span class=\"tk\"><bdi dir=\"ltr\">&lt;קובץ&gt;<\/bdi><\/span> <span class=\"tk\">--language he<\/span> <span class=\"tk\">--model large-v3<\/span><span class=\"bt\">`<\/span><\/span>,<\/span>כל קובץ בתיקייה משלו, כי הפקודה דורסת את transcript.json שבתיקייה.<\/div>\n<div class=\"pl\" dir=\"rtl\">2. תמצא את המשפט השגוי לפי הטקסט, ותחתוך בתוך השקט שלפניו ובתוך השקט שאחריו.<\/div>\n<div class=\"pl\" dir=\"rtl\">3. את ההקלטה החדשה תגזום <span class=\"nb\">ל-50<\/span> אלפיות שנייה לפני המילה הראשונה <span class=\"nb\">ול-60<\/span> אלפיות שנייה אחרי המילה האחרונה.<\/div>\n<div class=\"pl\" dir=\"rtl\">4. תמדוד את רעש הרקע בשקטים של שני הקבצים, ואם ההקלטה החדשה רועשת יותר תפעיל <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">afftdn=nr=6<\/span><span class=\"bt\">`<\/span><\/span>, ואם היא שקטה יותר תוסיף לה רעש רקע מהשקטים של המקור.<\/div>\n<div class=\"pl\" dir=\"rtl\">5. EQ שמתאים את ההקלטה החדשה למשפט שהיא מחליפה: תמדוד את הספקטרום של שניהם ותפעיל בערך 80 אחוז מההפרש, רק בין 100Hz <span class=\"nb\">ל-10kHz<\/span> ועד 6 dB לכל כיוון.<\/div>\n<div class=\"pl\" dir=\"rtl\">6. תתאים את העוצמה לדיבור הפעיל <span class=\"nb\">ב-10<\/span> השניות שלפני החיבור, בלי השקטים.<\/div>\n<div class=\"pl\" dir=\"rtl\">7. fade של 40 אלפיות שנייה בכל צד של החיבור.<\/div>\n<div class=\"pl\" dir=\"rtl\">8. אם ההקלטה החדשה ארוכה או קצרה מהמקורית, כל מה שבא אחריה זז באותו הפרש: הכתוביות, האפקטים והבירולים.<\/div>\n<div class=\"pl\" dir=\"rtl\">9. משפט חדש קצר יותר מקצר את הווידאו שמתחתיו מהסוף שלו, ומשפט ארוך יותר מקבל בירול שמכסה את ההפרש.<\/div>\n<div class=\"pl\" dir=\"rtl\">10. אם יש אנימציה שמסונכרנת למילים בתוך המשפט, כל מילה חדשה מוצמדת לרגע באנימציה שהיה שייך למילה המקבילה במקור.<\/div>\n<div class=\"pl\" dir=\"rtl\">11. תמסור את הסרטון המתוקן, ובנוסף את הקריינות המתוקנת כקובץ wav נפרד.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/בנייה&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"מלכודות\">&lt;מלכודות&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">הזמנים של whisper יכולים לזוז עד שנייה, ובמיוחד במילה הראשונה בקובץ (נמדדה גם סטייה של 0.73 שנייה).<\/div>\n<div class=\"pl\" dir=\"rtl\">לכן תכין תמונה של גרף העוצמה עם קו בכל תחילת מילה, וכל נקודת חיתוך יושבת על השקע הקרוב בגרף, ולא על הזמן של whisper.<\/div>\n<div class=\"pl\" dir=\"rtl\">EQ מול כל הקריינות במקום מול המשפט המוחלף יוצא פחות מדויק, כי הצלילים במשפטים אחרים שונים.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/מלכודות&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"התחלה\">&lt;התחלה&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">תשאל אותי על הקלט, ותכין קטע של 10 שניות סביב החיבור כדי שאקשיב לו לפני שאתה מחליף בסרטון המלא.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/התחלה&gt;<\/div>"}, "links": []}]}, {"n": 3, "title": "אפקטים בתלת ממד", "t": 274.3, "sub": "אפקטים שבדרך כלל דורשים מעצב מושן וכמה ימים, על סרטון שצילמתם, בדיוק על המילים שאמרתם.", "items": [{"id": "t31", "num": "3.1", "title": "אומרים בקול מה לערוך, בזמן הצילום", "t": 279.53, "see": "תמלול נגלל, וההוראה &quot;שביד הזאת ירחף הלוגו של קלוד בתלת ממד&quot; נדלקת ועוברת לשורה בטבלה: &quot;ההוראה · זמן · מה יקרה על המסך · איך זה נגמר&quot;. אחרי האישור נבנה קובץ BRIEF.md, ומתחלקות סצנות, כל אחת בקובץ משלה עם סוכן משלה. בסוף תג &quot;מבקר עצמאי: ציון מעל 90&quot;.", "exp": "הדרך הכי מהירה להסביר לקלוד מה אתם רוצים היא להגיד את זה בזמן הצילום. קלוד מתמלל עם זמן לכל מילה, מוצא את ההוראות ובונה כל אפקט בדיוק על המילים שלו. לפני שהוא בונה, הוא מראה טבלה של כל ההוראות לאישור.", "fact": "ההוראות נשארות בקול של הסרטון, אז זה מתאים לסרטון שמראה את העריכה עצמה. בסרטון רגיל משתמשים בפרומפטים של האפקטים שבהמשך. · גם הסרטון הזה בנוי בשפה של אקספליינר דוקומנטרי: קווים דקים שזוהרים, ותוויות עם נקודה וקו.", "tip": "כל אפקט צריך להיעלם כשהזמן שלו נגמר. בבדיקה, טקסט על הקיר נשאר בטעות עד שנייה 49.5.", "prompt": {"n": 7, "text": "ההוראות כאן מחליפות את ראיון הפתיחה של HyperFrames, אז אל תריץ אותו.\n<קלט>\nתשאל אותי על חמישה דברים:\n- הסרטון שבו אמרתי את ההוראות.\n- אם הסרטון הסופי לאורך (9:16) או לרוחב (16:9).\n- צבעי המותג שלי: צבע רקע כהה, צבע הדגשה אחד, ופונט עברי (ברירת המחדל Rubik).\n- כל קובץ שההוראות מזכירות, למשל לוגו, הסרטונים שלי, תמונה של מוצר, או צילום של החדר הריק אם ביקשתי לפרק את הסצנה לשכבות.\n- אם יש לי ספרייה של אפקטים קוליים, או שתבחר אותם בעצמך מהקטלוג של HyperFrames.\n<\/קלט>\n\n<כיוון>\nתערוך את הסרטון בדיוק לפי ההוראות שאמרתי בו, תשקיע, ותשתמש במושן גרפיקס בסגנון של אקספליינר דוקומנטרי של נטפליקס, בצבעים של המותג שלי.\nכל הוראה קורית על המילים שלה, בשנייה שבה אמרתי אותה.\nהמראה של אקספליינר דוקומנטרי: אובייקטים מצוירים בקווים דקים שזוהרים, זוהר בצבע ההדגשה, תוויות עם נקודה קטנה וקו דק שמוביל לחלק, מצלמה איטית שלא עוצרת, עומק שדה וגרעיניות עדינה.\nהטקסט מינימלי, בלי משפטים שחוזרים על מה שאמרתי, ויש על המסך רק טקסט שביקשתי במפורש ותוויות קצרות.\nכל התוויות בעברית, מימין לשמאל, בלי מקף בין שתי מילים, וגדולות מספיק כדי לקרוא אותן בטלפון (לפחות 44 פיקסלים, בפריים של 1080 על 1920 או של 1920 על 1080).\nכל תנועה בקפיץ, רגועה ויקרה, ומה שנחת נשאר במקום ולא מרחף לנצח, חוץ מדברים שביקשתי שירחפו.\nכל איור הגיוני פיזית, ומספר עולה למסך רק אם הוא אמיתי.\nמעט אפקטים קוליים, שקטים, בלי בס, ותמיד מתחת לקול שלי.\nכתוביות נצרבות רק אם ביקשתי אותן בסרטון, ותמיד תמסור גם גרסה בלי כתוביות.\n<\/כיוון>\n\n<בנייה>\n1. תתמלל עם זמן לכל מילה בעזרת `npx hyperframes transcribe <הקובץ> --language he --model large-v3`, ותתקן מילים שגויות לפי ההקשר (`transcript.json` נשמר בתיקייה של הסרטון ולא בתיקייה שבה אתה עובד).\n2. תתקן את זמני המילים לפי עוצמת הקול, כי אחרי שקט whisper מקדים את המילה הבאה ב-0.1 עד 0.3 שנייה.\n3. תכתוב קובץ BRIEF.md: לכל הוראה המילים המדויקות והזמן שלהן, מה יקרה על המסך, ומתי האפקט נגמר וחוזר למצב רגיל.\n4. כל המידע שצריך נבנה פעם אחת לפני הסצנות: מעקב אחרי הידיים והפנים עם MediaPipe אם יש הוראה על הידיים, הגוף שלי בלי הרקע עם `npx hyperframes remove-background`, ופריימים מכל סרטון שביקשתי להראות.\n5. את העריכה תבנה כקומפוזיציה של HyperFrames עם three.js, בשכבות מלמטה למעלה: הסרטון, שכבה על הקיר, הגוף שלי בלי הרקע, שכבה קדמית ושכבה לטקסט.\n6. כל פריים מחושב רק מהזמן, בלי טיימרים ובלי מספרים אקראיים בזמן הציור.\n7. כל הוראה היא סצנה בקובץ משלה עם חלון זמן, ומחוץ לחלון כל מה שהיא הוסיפה מוסתר וכל השכבות המשותפות חוזרות למצב רגיל.\n8. אם יש יותר משלוש הוראות, תחלק את העבודה לסוכנים, סוכן לכל סצנה שעובד רק על הקובץ שלו, עם הבריף המשותף.\n9. בכל סצנה תוציא פריימים ברגעים של המילים החשובות ותסתכל עליהם, ותעשה לפחות שלושה סבבים של בדיקה ותיקון.\n10. סוכן נפרד שלא בנה כלום נותן ציון מתוך 100 לכל סצנה (ביצוע ההוראה על המילים שלה, גימור, תנועה, עברית, התאמה לסגנון, היגיון פיזי) עם תיקונים במספרים, ואתה מתקן עד שהציון עובר 90.\n11. את האפקטים הקוליים תמקם מתחת לקול ותגביל את השיא כך שלא יעבור -1 dBTP.\n<\/בנייה>\n\n<מלכודות>\nבלי תיקון הזמנים לפי עוצמת הקול, אפקטים מתחילים לפני שאמרתי את המילה.\nאובייקט שסצנה הוסיפה נשאר על המסך אחרי החלון שלה, אם לא מסתירים אותו במפורש.\nברגעי המעבר בין סצנות צריך להיות ברור מי שולט במצלמה, בסרטון ובגוף בלי הרקע, אחרת שתי סצנות נלחמות על אותו דבר.\nמילה עברית נכנסת שלמה, כי חשיפה מאחורי קו מראה חצי מילה שנראית כמו מקפים.\nלוגו של מותג נשאר בצבעים האמיתיים שלו.\nאת MediaPipe תתקין בתוך venv עם `pip install mediapipe==0.10.35` ותשתמש ב-Tasks API (`HandLandmarker`, `FaceDetector`), כי הגרסה האחרונה ב-pip קורסת ב-Mac בזיהוי הראשון.\nסרטון שמוצג בתוך three.js מקבל `texture.needsUpdate = true` בכל פריים ו-`texture.colorSpace = THREE.SRGBColorSpace`, אחרת הוא לא מופיע או יוצא דהוי.\nבסיכום של `npx hyperframes render` צריך להיות כתוב `hardware gpu`, ואם כתוב `software gpu` תוסיף לרינדור `--browser-gpu`.\n<\/מלכודות>\n\n<התחלה>\nתשאל אותי על הקלט, תתמלל, ותראה לי טבלה של ההוראות: בכל שורה ההוראה כמו שאמרתי אותה, הזמן, מה יקרה על המסך ואיך זה ייגמר.\nאל תבנה לפני שאישרתי.\nל-`npx hyperframes render` אין דגל לטווח זמן או להקטנה, ולכן אחרי האישור תעשה עותק זמני וקצר של הקומפוזיציה ב-540 על 960 (או 960 על 540), שמכיל רק 15 שניות, ותרנדר אותו קודם.\nאת כל הסרטון תרנדר בסוף.\n<\/התחלה>", "note": "", "html": "<div class=\"pl\" dir=\"rtl\">ההוראות כאן מחליפות את ראיון הפתיחה של HyperFrames, אז אל תריץ אותו.<\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"קלט\">&lt;קלט&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">תשאל אותי על חמישה דברים:<\/div>\n<div class=\"pl\" dir=\"rtl\">- הסרטון שבו אמרתי את ההוראות.<\/div>\n<div class=\"pl\" dir=\"rtl\">- אם הסרטון הסופי לאורך (9:16) או לרוחב (16:9).<\/div>\n<div class=\"pl\" dir=\"rtl\">- צבעי המותג שלי: צבע רקע כהה, צבע הדגשה אחד, ופונט עברי (ברירת המחדל Rubik).<\/div>\n<div class=\"pl\" dir=\"rtl\">- כל קובץ שההוראות מזכירות, למשל לוגו, הסרטונים שלי, תמונה של מוצר, או צילום של החדר הריק אם ביקשתי לפרק את הסצנה לשכבות.<\/div>\n<div class=\"pl\" dir=\"rtl\">- אם יש לי ספרייה של אפקטים קוליים, או שתבחר אותם בעצמך מהקטלוג של HyperFrames.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/קלט&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"כיוון\">&lt;כיוון&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">תערוך את הסרטון בדיוק לפי ההוראות שאמרתי בו, תשקיע, ותשתמש במושן גרפיקס בסגנון של אקספליינר דוקומנטרי של נטפליקס, בצבעים של המותג שלי.<\/div>\n<div class=\"pl\" dir=\"rtl\">כל הוראה קורית על המילים שלה, בשנייה שבה אמרתי אותה.<\/div>\n<div class=\"pl\" dir=\"rtl\">המראה של אקספליינר דוקומנטרי: אובייקטים מצוירים בקווים דקים שזוהרים, זוהר בצבע ההדגשה, תוויות עם נקודה קטנה וקו דק שמוביל לחלק, מצלמה איטית שלא עוצרת, עומק שדה וגרעיניות עדינה.<\/div>\n<div class=\"pl\" dir=\"rtl\">הטקסט מינימלי, בלי משפטים שחוזרים על מה שאמרתי, ויש על המסך רק טקסט שביקשתי במפורש ותוויות קצרות.<\/div>\n<div class=\"pl\" dir=\"rtl\">כל התוויות בעברית, מימין לשמאל, בלי מקף בין שתי מילים, וגדולות מספיק כדי לקרוא אותן בטלפון (לפחות 44 פיקסלים, בפריים של 1080 על 1920 או של 1920 על 1080).<\/div>\n<div class=\"pl\" dir=\"rtl\">כל תנועה בקפיץ, רגועה ויקרה, ומה שנחת נשאר במקום ולא מרחף לנצח, חוץ מדברים שביקשתי שירחפו.<\/div>\n<div class=\"pl\" dir=\"rtl\">כל איור הגיוני פיזית, ומספר עולה למסך רק אם הוא אמיתי.<\/div>\n<div class=\"pl\" dir=\"rtl\">מעט אפקטים קוליים, שקטים, בלי בס, ותמיד מתחת לקול שלי.<\/div>\n<div class=\"pl\" dir=\"rtl\">כתוביות נצרבות רק אם ביקשתי אותן בסרטון, ותמיד תמסור גם גרסה בלי כתוביות.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/כיוון&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"בנייה\">&lt;בנייה&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">1. תתמלל עם זמן לכל מילה בעזרת <span class=\"codeblock\" dir=\"rtl\"><span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">npx<\/span> <span class=\"tk\">hyperframes<\/span> <span class=\"tk\">transcribe<\/span> <span class=\"tk\"><bdi dir=\"ltr\">&lt;הקובץ&gt;<\/bdi><\/span> <span class=\"tk\">--language he<\/span> <span class=\"tk\">--model large-v3<\/span><span class=\"bt\">`<\/span><\/span>,<\/span>ותתקן מילים שגויות לפי ההקשר (<span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">transcript.json<\/span><span class=\"bt\">`<\/span><\/span> נשמר בתיקייה של הסרטון ולא בתיקייה שבה אתה עובד).<\/div>\n<div class=\"pl\" dir=\"rtl\">2. תתקן את זמני המילים לפי עוצמת הקול, כי אחרי שקט whisper מקדים את המילה הבאה <span class=\"nb\">ב-0.1<\/span> עד 0.3 שנייה.<\/div>\n<div class=\"pl\" dir=\"rtl\">3. תכתוב קובץ BRIEF.md: לכל הוראה המילים המדויקות והזמן שלהן, מה יקרה על המסך, ומתי האפקט נגמר וחוזר למצב רגיל.<\/div>\n<div class=\"pl\" dir=\"rtl\">4. כל המידע שצריך נבנה פעם אחת לפני הסצנות: מעקב אחרי הידיים והפנים עם MediaPipe אם יש הוראה על הידיים, הגוף שלי בלי הרקע עם <span class=\"codeblock\" dir=\"rtl\"><span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\  מותג נשאר בצבעים האמיתיים שלו.<\/div>\n<div class=\"pl\" dir=\"rtl\">את MediaPipe תתקין בתוך venv עם <span class=\"codeblock\" dir=\"rtl\"><span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">pip<\/span> <span class=\"tk\">install<\/span> <span class=\"tk\">mediapipe==0.10.35<\/span><span class=\"bt\">`<\/span><\/span><\/span>ותשתמש <span class=\"nb\">ב-Tasks<\/span> API (<span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">HandLandmarker<\/span><span class=\"bt\">`<\/span><\/span>, <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">FaceDetector<\/span><span class=\"bt\">`<\/span><\/span>), כי הגרסה האחרונה <span class=\"nb\">ב-pip<\/span> קורסת <span class=\"nb\">ב-Mac<\/span> בזיהוי הראשון.<\/div>\n<div class=\"pl\" dir=\"rtl\">סרטון שמוצג בתוך three.js מקבל <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">texture.needsUpdate<\/span> <span class=\"tk\">=<\/span> <span class=\"tk\">true<\/span><span class=\"bt\">`<\/span><\/span> בכל פריים <span class=\"codeblock\" dir=\"rtl\">ו-<span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">texture.colorSpace<\/span> <span class=\"tk\">=<\/span> <span class=\"tk\">THREE.SRGBColorSpace<\/span><span class=\"bt\">`<\/span><\/span>,<\/span>אחרת הוא לא מופיע או יוצא דהוי.<\/div>\n<div class=\"pl\" dir=\"rtl\">בסיכום של <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">npx<\/span> <span class=\"tk\">hyperframes<\/span> <span class=\"tk\">render<\/span><span class=\"bt\">`<\/span><\/span> צריך להיות כתוב <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">hardware<\/span> <span class=\"tk\">gpu<\/span><span class=\"bt\">`<\/span><\/span>, ואם כתוב <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">software<\/span> <span class=\"tk\">gpu<\/span><span class=\"bt\">`<\/span><\/span> תוסיף לרינדור <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">--browser-gpu<\/span><span class=\"bt\">`<\/span><\/span>.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/מלכודות&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"התחלה\">&lt;התחלה&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">תשאל אותי על הקלט, תתמלל, ותראה לי טבלה של ההוראות: בכל שורה ההוראה כמו שאמרתי אותה, הזמן, מה יקרה על המסך ואיך זה ייגמר.<\/div>\n<div class=\"pl\" dir=\"rtl\">אל תבנה לפני שאישרתי.<\/div>\n<div class=\"pl\" dir=\"rtl\">ל-<span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">npx<\/span> <span class=\"tk\">hyperframes<\/span> <span class=\"tk\">render<\/span><span class=\"bt\">`<\/span><\/span> אין דגל לטווח זמן או להקטנה, ולכן אחרי האישור תעשה עותק זמני וקצר של הקומפוזיציה <span class=\"nb\">ב-540<\/span> על 960 (או 960 על 540), שמכיל רק 15 שניות, ותרנדר אותו קודם.<\/div>\n<div class=\"pl\" dir=\"rtl\">את כל הסרטון תרנדר בסוף.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/התחלה&gt;<\/div>"}, "links": []}, {"id": "t32", "num": "3.2", "title": "לוגו בתלת ממד מרחף מעל כף היד", "t": 319.14, "see": "יד מצוירת בקווים דקים שזוהרים, עם 21 נקודות המעקב ונקודת הריחוף. נקודת אור נדלקת, ולוגו גנרי עם עובי וקצוות מעוגלים צומח ממנה בסיבוב אחד. הוא מרחף ומסתובב לאט, היד זזה והלוגו נגרר אחריה באיחור קטן, ואור בצבע הלוגו נופל על כף היד. ביציאה הוא מתכווץ חזרה לנקודת אור.", "exp": "בכל פריים קלוד יודע איפה היד שלכם. מעליה הוא מעמיד לוגו בתלת ממד שנכנס על המילה שבחרתם ומאיר את כף היד בצבע של הלוגו. הלוגו עוקב אחרי היד באיחור של עשירית שנייה, כמו משהו שמרחף מעליה.", "fact": "איחור של 0.1 שנייה · MediaPipe מניח תמונת מראה: מה שהוא קורא &quot;יד ימין&quot; הוא בדרך כלל היד שבצד שמאל של המסך.", "tip": "מביאים את הלוגו כקובץ SVG. <span class=\"nb\">מ-PNG<\/span> קלוד צריך לשרטט את קווי המתאר בעצמו, והקצוות יוצאים פחות חדים.", "prompt": {"n": 8, "text": "ההוראות כאן מחליפות את ראיון הפתיחה של HyperFrames, אז אל תריץ אותו.
