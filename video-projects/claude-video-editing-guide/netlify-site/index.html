\n<קלט>\nתשאל אותי על ארבעה דברים:\n- הסרטון, ומעל איזו יד הלוגו מרחף: היד שבצד ימין של המסך, זו שבצד שמאל, או שתיהן עם לוגו אחר לכל יד.\n- קובץ הלוגו, עדיף SVG, וקובץ לכל לוגו אם יש שניים.\n- כמה גדול הלוגו, וברירת המחדל היא בערך הרוחב של כף היד.\n- הרגע שבו כל לוגו מופיע והרגע שבו הוא נעלם, לפי מילה שאמרתי או לפי זמן.\n<\/קלט>\n\n<כיוון>\nעל המילה שבחרתי נדלקת נקודת אור קטנה מעל כף היד, והלוגו צומח ממנה עם סיבוב אחד.\nהלוגו בתלת ממד, עם עובי וקצוות מעוגלים, בצבעים האמיתיים שלו.\nהוא מרחף מעל כף היד בתנודה איטית של כמה פיקסלים ומסתובב לאט, כדי שרואים שיש לו עומק.\nהוא עוקב אחרי היד באיחור קטן של בערך 0.1 שנייה, כמו משהו שמרחף מעליה ולא כמו מדבקה.\nאור בצבע הלוגו נופל על כף היד ועל האצבעות, ונחלש כשהלוגו מתרחק מהן.\nאם בלוגו כמה צבעים, האור בצבע הדומיננטי שלו.\nביציאה הלוגו מתכווץ חזרה לנקודת אור ונעלם.\n<\/כיוון>\n\n<בנייה>\n1. את MediaPipe תתקין בתוך venv עם `pip install mediapipe==0.10.35` ותשתמש ב-Tasks API, כי הגרסה האחרונה ב-pip קורסת ב-Mac בזיהוי הראשון.\n2. תריץ את `HandLandmarker` על כל פריים, ותשמור לכל יד את 21 הנקודות שלה בקובץ JSON.\n3. פריים שבו היד לא זוהתה מקבל את הערכים של הפריים הקרוב שבו היא כן זוהתה.\n4. את נקודת הריחוף תחשב מהנקודות: לרוחב, באמצע בין מרכז כף היד (ממוצע הנקודות 0, 5, 9, 13 ו-17) לאמצע שבין נקודה 2 לנקודה 5, ולגובה, הגובה הנמוך ביותר שבו הלוגו לא נוגע באף אצבע (מרווח של בערך 12 פיקסלים).\n5. את המעקב תחליק בתנועת קפיץ שקצת עוברת את היעד ונרגעת, מחושבת מהזמן בלבד.\n6. את הלוגו תבנה מה-SVG ב-three.js עם ExtrudeGeometry ושוליים מעוגלים, עם חומר מבריק ושתי מנורות.\n7. אם יש רק PNG, תהפוך אותו לצורות וקטוריות לפי השקיפות שלו, צורה נפרדת לכל צבע, ותראה לי אותן לפני הבנייה.\n8. את האור על היד תצייר רק בתוך היד, בעזרת הגוף שלי בלי הרקע מ-`npx hyperframes remove-background`.\n9. הכל בקומפוזיציה של HyperFrames מעל הסרטון, כשכל פריים מחושב מהזמן.\n<\/בנייה>\n\n<מלכודות>\nכשהיד זזה מהר היא מטושטשת והזיהוי נופל, ואז בלי מילוי מהפריים הקרוב הלוגו קופץ לפינה של המסך.\nMediaPipe מניח תמונת מראה, ולכן בסרטון רגיל מה שהוא קורא \"יד ימין\" הוא בדרך כלל היד שבצד שמאל של המסך, והיד נבחרת לפי הצד שלה במסך.\n<\/מלכודות>\n\n<התחלה>\nתשאל אותי על הקלט, תריץ את המעקב, ותראה לי גיליון של 6 פריימים עם הנקודות של היד ונקודת הריחוף מסומנות.\nאחרי שאישרתי, תראה לי פריים בכניסה, פריים בתנועה מהירה ופריים ביציאה, ורק אז תרנדר 5 שניות סביב הכניסה מעותק זמני וקצר של הקומפוזיציה ב-540 על 960 (או 960 על 540), כי ל-`npx hyperframes render` אין דגל לטווח זמן או להקטנה.\n<\/התחלה>", "note": "", "html": "<div class=\"pl\" dir=\"rtl\">ההוראות כאן מחליפות את ראיון הפתיחה של HyperFrames, אז אל תריץ אותו.<\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"קלט\">&lt;קלט&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">תשאל אותי על ארבעה דברים:<\/div>\n<div class=\"pl\" dir=\"rtl\">- הסרטון, ומעל איזו יד הלוגו מרחף: היד שבצד ימין של המסך, זו שבצד שמאל, או שתיהן עם לוגו אחר לכל יד.<\/div>\n<div class=\"pl\" dir=\"rtl\">- קובץ הלוגו, עדיף SVG, וקובץ לכל לוגו אם יש שניים.<\/div>\n<div class=\"pl\" dir=\"rtl\">- כמה גדול הלוגו, וברירת המחדל היא בערך הרוחב של כף היד.<\/div>\n<div class=\"pl\" dir=\"rtl\">- הרגע שבו כל לוגו מופיע והרגע שבו הוא נעלם, לפי מילה שאמרתי או לפי זמן.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/קלט&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"כיוון\">&lt;כיוון&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">על המילה שבחרתי נדלקת נקודת אור קטנה מעל כף היד, והלוגו צומח ממנה עם סיבוב אחד.<\/div>\n<div class=\"pl\" dir=\"rtl\">הלוגו בתלת ממד, עם עובי וקצוות מעוגלים, בצבעים האמיתיים שלו.<\/div>\n<div class=\"pl\" dir=\"rtl\">הוא מרחף מעל כף היד בתנודה איטית של כמה פיקסלים ומסתובב לאט, כדי שרואים שיש לו עומק.<\/div>\n<div class=\"pl\" dir=\"rtl\">הוא עוקב אחרי היד באיחור קטן של בערך 0.1 שנייה, כמו משהו שמרחף מעליה ולא כמו מדבקה.<\/div>\n<div class=\"pl\" dir=\"rtl\">אור בצבע הלוגו נופל על כף היד ועל האצבעות, ונחלש כשהלוגו מתרחק מהן.<\/div>\n<div class=\"pl\" dir=\"rtl\">אם בלוגו כמה צבעים, האור בצבע הדומיננטי שלו.<\/div>\n<div class=\"pl\" dir=\"rtl\">ביציאה הלוגו מתכווץ חזרה לנקודת אור ונעלם.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/כיוון&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"בנייה\">&lt;בנייה&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">1. את MediaPipe תתקין בתוך venv עם <span class=\"codeblock\" dir=\"rtl\"><span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">pip<\/span> <span class=\"tk\">install<\/span> <span class=\"tk\">mediapipe==0.10.35<\/span><span class=\"bt\">`<\/span><\/span><\/span>ותשתמש <span class=\"nb\">ב-Tasks<\/span> API, כי הגרסה האחרונה <span class=\"nb\">ב-pip<\/span> קורסת <span class=\"nb\">ב-Mac<\/span> בזיהוי הראשון.<\/div>\n<div class=\"pl\" dir=\"rtl\">2. תריץ את <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">HandLandmarker<\/span><span class=\"bt\">`<\/span><\/span> על כל פריים, ותשמור לכל יד את 21 הנקודות שלה בקובץ JSON.<\/div>\n<div class=\"pl\" dir=\"rtl\">3. פריים שבו היד לא זוהתה מקבל את הערכים של הפריים הקרוב שבו היא כן זוהתה.<\/div>\n<div class=\"pl\" dir=\"rtl\">4. את נקודת הריחוף תחשב מהנקודות: לרוחב, באמצע בין מרכז כף היד (ממוצע הנקודות 0, 5, 9, 13 <span class=\"nb\">ו-17)<\/span> לאמצע שבין נקודה 2 לנקודה 5, ולגובה, הגובה הנמוך ביותר שבו הלוגו לא נוגע באף אצבע (מרווח של בערך 12 פיקסלים).<\/div>\n<div class=\"pl\" dir=\"rtl\">5. את המעקב תחליק בתנועת קפיץ שקצת עוברת את היעד ונרגעת, מחושבת מהזמן בלבד.<\/div>\n<div class=\"pl\" dir=\"rtl\">6. את הלוגו תבנה <span class=\"nb\">מה-SVG<\/span> <span class=\"nb\">ב-three.js<\/span> עם ExtrudeGeometry ושוליים מעוגלים, עם חומר מבריק ושתי מנורות.<\/div>\n<div class=\"pl\" dir=\"rtl\">7. אם יש רק PNG, תהפוך אותו לצורות וקטוריות לפי השקיפות שלו, צורה נפרדת לכל צבע, ותראה לי אותן לפני הבנייה.<\/div>\n<div class=\"pl\" dir=\"rtl\">8. את האור על היד תצייר רק בתוך היד, בעזרת הגוף שלי בלי הרקע <span class=\"codeblock\" dir=\"rtl\">מ-<span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">npx<\/span> <span class=\"tk\">hyperframes<\/span> <span class=\"tk\">remove-background<\/span><span class=\"bt\">`<\/span><\/span>.<\/span><\/div>\n<div class=\"pl\" dir=\"rtl\">9. הכל בקומפוזיציה של HyperFrames מעל הסרטון, כשכל פריים מחושב מהזמן.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/בנייה&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"מלכודות\">&lt;מלכודות&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">כשהיד זזה מהר היא מטושטשת והזיהוי נופל, ואז בלי מילוי מהפריים הקרוב הלוגו קופץ לפינה של המסך.<\/div>\n<div class=\"pl\" dir=\"rtl\">MediaPipe מניח תמונת מראה, ולכן בסרטון רגיל מה שהוא קורא &quot;יד ימין&quot; הוא בדרך כלל היד שבצד שמאל של המסך, והיד נבחרת לפי הצד שלה במסך.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/מלכודות&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"התחלה\">&lt;התחלה&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">תשאל אותי על הקלט, תריץ את המעקב, ותראה לי גיליון של 6 פריימים עם הנקודות של היד ונקודת הריחוף מסומנות.<\/div>\n<div class=\"pl\" dir=\"rtl\">אחרי שאישרתי, תראה לי פריים בכניסה, פריים בתנועה מהירה ופריים ביציאה, ורק אז תרנדר 5 שניות סביב הכניסה מעותק זמני וקצר של הקומפוזיציה <span class=\"nb\">ב-540<\/span> על 960 (או 960 על 540), כי ל-<span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">npx<\/span> <span class=\"tk\">hyperframes<\/span> <span class=\"tk\">render<\/span><span class=\"bt\">`<\/span><\/span> אין דגל לטווח זמן או להקטנה.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/התחלה&gt;<\/div>"}, "links": []}, {"id": "t33", "num": "3.3", "title": "טקסט על הקיר מאחוריכם", "t": 355.98, "see": "קיר בחדר מאויר וצללית לפניו. הטקסט &quot;נתחיל מהקל לכבד&quot; נכנס מילה אחרי מילה, כל מילה שלמה: עולה <span class=\"nb\">כ-30<\/span> פיקסלים בקפיץ ומתבהרת מטשטוש. היד של הצללית עולה ועוברת מעל &quot;לכבד&quot;, והטקסט נשאר קריא. אחר כך מבט מהצד על שלוש השכבות, מלמטה למעלה: &quot;הקטע המקורי&quot; · &quot;הטקסט&quot; · &quot;אתם בלי הרקע&quot;.", "exp": "כותרת שקופצת מעל הפנים מסתירה אתכם. על צילום רגיל, בלי מסך ירוק, קלוד מפריד אתכם מהרקע בכל פריים ומכניס את הטקסט בין הקיר לבינכם, וכל תנועה של היד מסתירה את החלק של הטקסט שמאחוריה.", "fact": "6 שניות, 4 דקות · ההפרדה מהרקע איטית: 6 שניות לקחו 4 דקות, ולכן מפרידים רק את הקטע שבו הטקסט על המסך.", "tip": "טקסט כזה לאורך ריל שלם של דקה ייקח רבע שעה עד 40 דקות רק להפרדה.", "prompt": {"n": 9, "text": "ההוראות כאן מחליפות את ראיון הפתיחה של HyperFrames, אז אל תריץ אותו.\n<קלט>\nתשאל אותי על ארבעה דברים:\n- איזה סרטון לערוך, אם יש בתיקייה יותר מאחד.\n- הטקסט, מילה במילה, והמילה שעליה הוא מתחיל להופיע.\n- מתי הטקסט יוצא, על מילה מסוימת או בסוף הקטע.\n- צבע ופונט (ברירת המחדל לבן, Rubik במשקל 900).\n<\/קלט>\n\n<כיוון>\nהטקסט גדול ויושב על הקיר מאחוריי, והגוף שלי מסתיר רק חלק קטן ממנו, כך שהוא נשאר קריא.\nאת המקום של הטקסט תבחר לפי איפה שהגוף נמצא לאורך כל הקטע: על הקיר הפנוי בצד של הראש, לא מאחורי הפנים, ונמוך מספיק כדי שהיד תעבור על השורה התחתונה.\nכל מילה נכנסת שלמה ברגע שהיא נאמרת: עולה בערך 30 פיקסלים בתנועת קפיץ בלי קפיצה מעבר ליעד, מתבהרת מטשטוש של 8 פיקסלים בתוך 0.3 שנייה, והשקיפות עולה בתוך 0.26 שנייה.\nל-GSAP אין קפיץ כזה מובנה, אז תשתמש בפונקציית ה-ease הזאת: `p => (1-(1+7*p)*Math.exp(-7*p)) / (1-8*Math.exp(-7))`.\nלבן עם צל כהה ורך, כדי שיחזיק על הקיר.\nהחדר נשאר כמו שהוא, בלי להכהות אותו ובלי כתם כהה מאחורי הטקסט.\n<\/כיוון>\n\n<בנייה>\n1. תחתוך לקובץ נפרד רק את הקטע שבו הטקסט על המסך, ותפריד בו אותי מהרקע עם `npx hyperframes remove-background <הקטע> -o cutout.webm --quality best`, כי ההפרדה לוקחת עד שנייה וחצי לכל פריים.\n2. תנקה את ההילה החלשה סביב הגוף עם `ffmpeg -c:v libvpx-vp9 -i cutout.webm -vf \"format=yuva420p,lut=a='st(0\\,clip((val-64)/116\\,0\\,1));255*ld(0)*ld(0)*(3-2*ld(0))'\" -c:v libvpx-vp9 -pix_fmt yuva420p -crf 15 -b:v 0 -auto-alt-ref 0 -an cutout-clean.webm`.\n3. בלי `-c:v libvpx-vp9` לפני `-i` השקיפות נעלמת בשקט, ולכן אחרי הניקוי תניח את הקובץ מעל צבע מלא ותבדוק פריים עם שיער, אצבעות ואמות.\n4. סדר השכבות בקומפוזיציה של HyperFrames, מלמטה למעלה, הוא הקטע המקורי, אחריו הטקסט, ומעל שניהם אני בלי הרקע.\n5. שני הסרטונים מתחילים ב-`data-start=\"0\"`, כדי שיהיו מסונכרנים באותו פריים, והשקיפות של שכבת הגוף נקבעת על div שעוטף אותה ולא על הווידאו עצמו.\n6. הסרטון המקורי מקבל `data-has-audio=\"true\"` ובלי `muted`, אחרת הקול נעלם.\n<\/בנייה>\n\n<מלכודות>\nלא לשים `dir=\"rtl\"` על תגית ה-html, כי הרינדור יוצא שחור, ולכן הכיוון נקבע על אלמנט הטקסט.\nהפונט יושב כקובץ בתיקיית assets של הפרויקט ונטען עם `@font-face`, ואם אין לי אותו תוריד אותו מ-Google Fonts.\nלפני המדידה תטען אותו עם טקסט עברי, `document.fonts.load('900 100px Rubik', 'אבג')`, אחרת המילים נמדדות בפונט אחר.\n<\/מלכודות>\n\n<התחלה>\nתשאל אותי על הקלט, תריץ את ההפרדה, ותראה לי שלושה פריימים: כשהטקסט נכנס, כשיד עוברת מעליו, וכשהוא מלא על המסך.\nאל תרנדר את כל הסרטון לפני שאישרתי.\n<\/התחלה>", "note": "", "html": "<div class=\"pl\" dir=\"rtl\">ההוראות כאן מחליפות את ראיון הפתיחה של HyperFrames, אז אל תריץ אותו.<\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"קלט\">&lt;קלט&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">תשאל אותי על ארבעה דברים:<\/div>\n<div class=\"pl\" dir=\"rtl\">- איזה סרטון לערוך, אם יש בתיקייה יותר מאחד.<\/div>\n<div class=\"pl\" dir=\"rtl\">- הטקסט, מילה במילה, והמילה שעליה הוא מתחיל להופיע.<\/div>\n<div class=\"pl\" dir=\"rtl\">- מתי הטקסט יוצא, על מילה מסוימת או בסוף הקטע.<\/div>\n<div class=\"pl\" dir=\"rtl\">- צבע ופונט (ברירת המחדל לבן, Rubik במשקל 900).<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/קלט&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"כיוון\">&lt;כיוון&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">הטקסט גדול ויושב על הקיר מאחוריי, והגוף שלי מסתיר רק חלק קטן ממנו, כך שהוא נשאר קריא.<\/div>\n<div class=\"pl\" dir=\"rtl\">את המקום של הטקסט תבחר לפי איפה שהגוף נמצא לאורך כל הקטע: על הקיר הפנוי בצד של הראש, לא מאחורי הפנים, ונמוך מספיק כדי שהיד תעבור על השורה התחתונה.<\/div>\n<div class=\"pl\" dir=\"rtl\">כל מילה נכנסת שלמה ברגע שהיא נאמרת: עולה בערך 30 פיקסלים בתנועת קפיץ בלי קפיצה מעבר ליעד, מתבהרת מטשטוש של 8 פיקסלים בתוך 0.3 שנייה, והשקיפות עולה בתוך 0.26 שנייה.<\/div>\n<div class=\"pl\" dir=\"rtl\"><span class=\"nb\">ל-GSAP<\/span> אין קפיץ כזה מובנה, אז תשתמש בפונקציית <span class=\"nb\">ה-ease<\/span> הזאת: <span class=\"codeblock\" dir=\"rtl\"><span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">p<\/span> <span class=\"tk\">=&gt;<\/span> <span class=\"tk\">(1-(1+7*p)*Math.exp(-7*p))<\/span> <span class=\"tk\">/<\/span> <span class=\"tk\">(1-8*Math.exp(-7))<\/span><span class=\"bt\">`<\/span><\/span>.<\/span><\/div>\n<div class=\"pl\" dir=\"rtl\">לבן עם צל כהה ורך, כדי שיחזיק על הקיר.<\/div>\n<div class=\"pl\" dir=\"rtl\">החדר נשאר כמו שהוא, בלי להכהות אותו ובלי כתם כהה מאחורי הטקסט.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/כיוון&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"בנייה\">&lt;בנייה&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">1. תחתוך לקובץ נפרד רק את הקטע שבו הטקסט על המסך, ותפריד בו אותי מהרקע עם <span class=\"codeblock\" dir=\"rtl\"><span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">npx<\/span> <span class=\"tk\">hyperframes<\/span> <span class=\"tk\">remove-background<\/span> <span class=\"tk\"><bdi dir=\"ltr\">&lt;הקטע&gt;<\/bdi><\/span> <span class=\"tk\">-o cutout.webm<\/span> <span class=\"tk\">--quality best<\/span><span class=\"bt\">`<\/span><\/span>,<\/span>כי ההפרדה לוקחת עד שנייה וחצי לכל פריים.<\/div>\n<div class=\"pl\" dir=\"rtl\">2. תנקה את ההילה החלשה סביב הגוף עם <span class=\"codeblock\" dir=\"rtl\"><span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">ffmpeg<\/span> <span class=\"tk\">-c:v libvpx-vp9<\/span> <span class=\"tk\">-i cutout.webm<\/span> <span class=\"tk\">-vf &quot;format=yuva420p,<\/span><wbr><span class=\"tk\">lut=a=&#x27;st(0\\,<\/span><wbr><span class=\"tk\">clip((val-64)/<\/span><wbr><span class=\"tk\">116\\,<\/span><wbr><span class=\"tk\">0\\,<\/span><wbr><span class=\"tk\">1));<\/span><wbr><span class=\"tk\">255*ld(0)*ld(0)*(3-2*ld(0))&#x27;&quot;<\/span> <span class=\"tk\">-c:v libvpx-vp9<\/span> <span class=\"tk\">-pix_fmt yuva420p<\/span> <span class=\"tk\">-crf 15<\/span> <span class=\"tk\">-b:v 0<\/span> <span class=\"tk\">-auto-alt-ref 0<\/span> <span class=\"tk\">-an cutout-clean.webm<\/span><span class=\"bt\">`<\/span><\/span>.<\/span><\/div>\n<div class=\"pl\" dir=\"rtl\">3. בלי <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">-c:v libvpx-vp9<\/span><span class=\"bt\">`<\/span><\/span> לפני <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">-i<\/span><span class=\"bt\">`<\/span><\/span> השקיפות נעלמת בשקט, ולכן אחרי הניקוי תניח את הקובץ מעל צבע מלא ותבדוק פריים עם שיער, אצבעות ואמות.<\/div>\n<div class=\"pl\" dir=\"rtl\">4. סדר השכבות בקומפוזיציה של HyperFrames, מלמטה למעלה, הוא הקטע המקורי, אחריו הטקסט, ומעל שניהם אני בלי הרקע.<\/div>\n<div class=\"pl\" dir=\"rtl\">5. שני הסרטונים מתחילים ב-<span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">data-start=&quot;0&quot;<\/span><span class=\"bt\">`<\/span><\/span>, כדי שיהיו מסונכרנים באותו פריים, והשקיפות של שכבת הגוף נקבעת על div שעוטף אותה ולא על הווידאו עצמו.<\/div>\n<div class=\"pl\" dir=\"rtl\">6. הסרטון המקורי מקבל <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">data-has-audio=&quot;true&quot;<\/span><span class=\"bt\">`<\/span><\/span> ובלי <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">muted<\/span><span class=\"bt\">`<\/span><\/span>, אחרת הקול נעלם.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/בנייה&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"מלכודות\">&lt;מלכודות&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">לא לשים <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">dir=&quot;rtl&quot;<\/span><span class=\"bt\">`<\/span><\/span> על תגית <span class=\"nb\">ה-html,<\/span> כי הרינדור יוצא שחור, ולכן הכיוון נקבע על אלמנט הטקסט.<\/div>\n<div class=\"pl\" dir=\"rtl\">הפונט יושב כקובץ בתיקיית assets של הפרויקט ונטען עם <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">@font-face<\/span><span class=\"bt\">`<\/span><\/span>, ואם אין לי אותו תוריד אותו <span class=\"nb\">מ-Google<\/span> Fonts.<\/div>\n<div class=\"pl\" dir=\"rtl\">לפני המדידה תטען אותו עם טקסט עברי, <span class=\"codeblock\" dir=\"rtl\"><span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">document.fonts.load(&#x27;900<\/span> <span class=\"tk\">100px<\/span> <span class=\"tk\">Rubik&#x27;,<\/span> <span class=\"tk\">&#x27;אבג&#x27;)<\/span><span class=\"bt\">`<\/span><\/span>,<\/span>אחרת המילים נמדדות בפונט אחר.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/מלכודות&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"התחלה\">&lt;התחלה&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">תשאל אותי על הקלט, תריץ את ההפרדה, ותראה לי שלושה פריימים: כשהטקסט נכנס, כשיד עוברת מעליו, וכשהוא מלא על המסך.<\/div>\n<div class=\"pl\" dir=\"rtl\">אל תרנדר את כל הסרטון לפני שאישרתי.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/התחלה&gt;<\/div>"}, "links": []}, {"id": "t34", "num": "3.4", "title": "הפריים מתפרק לשכבות בתלת ממד", "t": 390.8, "see": "קו אור דק מקיף את הפריים, וארבעה לוחות נפרדים בעומק, כל אחד על קפיץ משלו. המצלמה מסתובבת בערך 40 מעלות לצד <span class=\"nb\">ו-9<\/span> מלמעלה ומתרחקת. לכל לוח מסגרת אור ושם עם נקודה וקו, מהאחורי לקדמי: &quot;החדר הריק&quot; · &quot;הטקסט על הקיר&quot; · &quot;אתם בלי הרקע&quot; · &quot;האפקטים&quot;. באיחוד הלוחות והמצלמה חוזרים יחד ונוחתים בלי שום הבדל.", "exp": "על המילה שבחרתם הפריים נפרד לשכבות בעומק: החדר הריק, הטקסט שעל הקיר, אתם בלי הרקע והאפקטים שלפניכם. המצלמה מסתובבת, כל שכבה מקבלת שם בעברית, ועל מילת האיחוד הכל נוחת בחזרה בדיוק בתמונה המקורית.", "fact": "40 מעלות · פי 1.4 · המצלמה מסתובבת בערך 40 מעלות לצד <span class=\"nb\">ו-9<\/span> מלמעלה, ומתרחקת בערך פי 1.4, כדי שכל השכבות והשמות יישארו בתוך הפריים.", "tip": "מצלמים גם 3 שניות של החדר הריק, מאותה מצלמה ובאותו מקום. בלי זה קלוד ממלא את החדר עם מודל לעריכת תמונה <span class=\"nb\">ב-fal,<\/span> וזה עולה כסף: 15 סנט לתמונה, במודל שנבדק.", "prompt": {"n": 10, "text": "ההוראות כאן מחליפות את ראיון הפתיחה של HyperFrames, אז אל תריץ אותו.\n<קלט>\nתשאל אותי על ארבעה דברים:\n- הסרטון, והמילים שעליהן הסצנה מתפרקת ומתאחדת.\n- צילום של החדר הריק, בלי אף אחד, מאותה מצלמה באותו מקום (מספיקות 3 שניות לפני או אחרי הצילום).\n- אם יש על הקיר טקסט או גרפיקה שהוספנו, ואם יש אפקטים שמרחפים לפניי.\n- צבע ההדגשה של המותג שלי.\n<\/קלט>\n\n<כיוון>\nעל המילה שבחרתי, קו אור דק מקיף את הפריים, ואז השכבות נפרדות זו מזו בעומק.\nהשכבה הכי אחורית היא החדר הריק, לפניה הטקסט או הגרפיקה שעל הקיר, אחריהם אני בלי הרקע, והאפקטים הכי קרובים למצלמה.\nאם אין על הקיר טקסט או שאין אפקטים לפניי, השכבה הזאת לא נבנית ואין לה שם.\nהמצלמה מסתובבת בתנועת קפיץ למבט מהצד ומלמעלה, כך שרואים שהשכבות הן לוחות נפרדים במרחק זה מזה.\nכל שכבה מקבלת מסגרת של קו אור דק, ושם קצר בעברית ליד הפינה שלה, עם נקודה וקו דק שמוביל אליה.\nהשמות נכנסים אחד אחרי השני, מהשכבה האחורית לקדמית.\nעל מילת האיחוד כל השכבות והמצלמה חוזרות יחד, על אותו קפיץ, ונוחתות בדיוק בתמונה המקורית בלי שום הבדל.\n<\/כיוון>\n\n<בנייה>\n1. אם אין צילום של החדר הריק, תראה לי מודל לעריכת תמונה ואת המחיר שלו, ואחרי האישור תיצור איתו את החדר מפריים אחד ותדביק את התוצאה רק באזור של הגוף, שהוא האיחוד של הגוף מכל הפריימים בסצנה ועוד כמה פיקסלים סביבו, כך ששאר החדר נשאר אמיתי.\n2. את הגוף שלי בלי הרקע תוציא עם `npx hyperframes remove-background <הסרטון> -o cutout.webm --quality best`, ותבדוק אותו על רקע ירוק לפני הבנייה, כי נשארים בו לפעמים חלקים מהכיסא או מהמסך.\n3. את הסצנה תבנה בקומפוזיציה של HyperFrames עם three.js: כל שכבה היא משטח בגודל הפריים, וכשהמצלמה במקום שלה הם מכסים אותו בדיוק.\n4. העומק בזמן הפירוק, ביחס לרוחב הפריים: בערך 0.83 מהרוחב אחורה לחדר, 0.42 לקיר, 0 לי ו-0.1 קדימה לאפקטים.\n5. כל שכבה נפרדת על קפיץ משלה, עם הפרש קטן ביניהן (עד 0.12 שנייה), והמצלמה מסתובבת לזווית של בערך 40 מעלות לצד ו-9 מעלות מלמעלה ומתרחקת בערך פי 1.4, כדי שכל השכבות והשמות יישארו בתוך הפריים.\n6. השמות מצוירים בשכבה שטוחה מעל התלת ממד, במיקום שמחושב מהפינה של כל שכבה, והקווים שמובילים אליהם באורכים שונים לסירוגין, כדי ששני שמות לא יתנגשו.\n7. ברגע הפירוק הסרטון המקורי נמצא על המישור שלי ונעלם בהדרגה, ובשליש האחרון של האיחוד הוא חוזר אליו בהדרגה, כדי שהמעבר בין התמונה הרגילה לשכבות לא יקפוץ.\n8. תבחר קפיץ שנרגע לפני סוף האיחוד, ובסוף כל ערך נכפה בדיוק למקום שלו, כך שהכפייה מזיזה פחות מפיקסל ואין קפיצה כשהסרטון הרגיל חוזר.\n9. כל פריים מחושב רק מהזמן, והכל חוזר למצב רגיל מיד אחרי האיחוד.\n<\/בנייה>\n\n<מלכודות>\nסרטון שמוצג בתוך three.js מקבל `texture.needsUpdate = true` בכל פריים ו-`texture.colorSpace = THREE.SRGBColorSpace`, אחרת הוא לא מופיע או יוצא דהוי.\nאל תכהה את החדר ואל תוסיף לו צבע, כי זה נראה עכור.\n<\/מלכודות>\n\n<התחלה>\nתשאל אותי על הקלט, ותראה לי את צילום החדר הריק ליד פריים מהסרטון.\nאחרי שאישרתי, תראה לי ארבעה פריימים (רגע הפירוק, השיא, השמות והנחיתה), ורק אז תרנדר את הקטע מעותק זמני וקצר של הקומפוזיציה ב-540 על 960 (או 960 על 540), כי ל-`npx hyperframes render` אין דגל לטווח זמן או להקטנה.\n<\/התחלה>", "note": "", "html": "<div class=\"pl\" dir=\"rtl\">ההוראות כאן מחליפות את ראיון הפתיחה של HyperFrames, אז אל תריץ אותו.<\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"קלט\">&lt;קלט&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">תשאל אותי על ארבעה דברים:<\/div>\n<div class=\"pl\" dir=\"rtl\">- הסרטון, והמילים שעליהן הסצנה מתפרקת ומתאחדת.<\/div>\n<div class=\"pl\" dir=\"rtl\">- צילום של החדר הריק, בלי אף אחד, מאותה מצלמה באותו מקום (מספיקות 3 שניות לפני או אחרי הצילום).<\/div>\n<div class=\"pl\" dir=\"rtl\">- אם יש על הקיר טקסט או גרפיקה שהוספנו, ואם יש אפקטים שמרחפים לפניי.<\/div>\n<div class=\"pl\" dir=\"rtl\">- צבע ההדגשה של המותג שלי.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/קלט&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"כיוון\">&lt;כיוון&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">על המילה שבחרתי, קו אור דק מקיף את הפריים, ואז השכבות נפרדות זו מזו בעומק.<\/div>\n<div class=\"pl\" dir=\"rtl\">השכבה הכי אחורית היא החדר הריק, לפניה הטקסט או הגרפיקה שעל הקיר, אחריהם אני בלי הרקע, והאפקטים הכי קרובים למצלמה.<\/div>\n<div class=\"pl\" dir=\"rtl\">אם אין על הקיר טקסט או שאין אפקטים לפניי, השכבה הזאת לא נבנית ואין לה שם.<\/div>\n<div class=\"pl\" dir=\"rtl\">המצלמה מסתובבת בתנועת קפיץ למבט מהצד ומלמעלה, כך שרואים שהשכבות הן לוחות נפרדים במרחק זה מזה.<\/div>\n<div class=\"pl\" dir=\"rtl\">כל שכבה מקבלת מסגרת של קו אור דק, ושם קצר בעברית ליד הפינה שלה, עם נקודה וקו דק שמוביל אליה.<\/div>\n<div class=\"pl\" dir=\"rtl\">השמות נכנסים אחד אחרי השני, מהשכבה האחורית לקדמית.<\/div>\n<div class=\"pl\" dir=\"rtl\">על מילת האיחוד כל השכבות והמצלמה חוזרות יחד, על אותו קפיץ, ונוחתות בדיוק בתמונה המקורית בלי שום הבדל.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/כיוון&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"בנייה\">&lt;בנייה&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">1. אם אין צילום של החדר הריק, תראה לי מודל לעריכת תמונה ואת המחיר שלו, ואחרי האישור תיצור איתו את החדר מפריים אחד ותדביק את התוצאה רק באזור של הגוף, שהוא האיחוד של הגוף מכל הפריימים בסצנה ועוד כמה פיקסלים סביבו, כך ששאר החדר נשאר אמיתי.<\/div>\n<div class=\"pl\" dir=\"rtl\">2. את הגוף שלי בלי הרקע תוציא עם <span class=\"codeblock\" dir=\"rtl\"><span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">npx<\/span> <span class=\"tk\">hyperframes<\/span> <span class=\"tk\">remove-background<\/span> <span class=\"tk\"><bdi dir=\"ltr\">&lt;הסרטון&gt;<\/bdi><\/span> <span class=\"tk\">-o cutout.webm<\/span> <span class=\"tk\">--quality best<\/span><span class=\"bt\">`<\/span><\/span>,<\/span>ותבדוק אותו על רקע ירוק לפני הבנייה, כי נשארים בו לפעמים חלקים מהכיסא או מהמסך.<\/div>\n<div class=\"pl\" dir=\"rtl\">3. את הסצנה תבנה בקומפוזיציה של HyperFrames עם three.js: כל שכבה היא משטח בגודל הפריים, וכשהמצלמה במקום שלה הם מכסים אותו בדיוק.<\/div>\n<div class=\"pl\" dir=\"rtl\">4. העומק בזמן הפירוק, ביחס לרוחב הפריים: בערך 0.83 מהרוחב אחורה לחדר, 0.42 לקיר, 0 לי <span class=\"nb\">ו-0.1<\/span> קדימה לאפקטים.<\/div>\n<div class=\"pl\" dir=\"rtl\">5. כל שכבה נפרדת על קפיץ משלה, עם הפרש קטן ביניהן (עד 0.12 שנייה), והמצלמה מסתובבת לזווית של בערך 40 מעלות לצד <span class=\"nb\">ו-9<\/span> מעלות מלמעלה ומתרחקת בערך פי 1.4, כדי שכל השכבות והשמות יישארו בתוך הפריים.<\/div>\n<div class=\"pl\" dir=\"rtl\">6. השמות מצוירים בשכבה שטוחה מעל התלת ממד, במיקום שמחושב מהפינה של כל שכבה, והקווים שמובילים אליהם באורכים שונים לסירוגין, כדי ששני שמות לא יתנגשו.<\/div>\n<div class=\"pl\" dir=\"rtl\">7. ברגע הפירוק הסרטון המקורי נמצא על המישור שלי ונעלם בהדרגה, ובשליש האחרון של האיחוד הוא חוזר אליו בהדרגה, כדי שהמעבר בין התמונה הרגילה לשכבות לא יקפוץ.<\/div>\n<div class=\"pl\" dir=\"rtl\">8. תבחר קפיץ שנרגע לפני סוף האיחוד, ובסוף כל ערך נכפה בדיוק למקום שלו, כך שהכפייה מזיזה פחות מפיקסל ואין קפיצה כשהסרטון הרגיל חוזר.<\/div>\n<div class=\"pl\" dir=\"rtl\">9. כל פריים מחושב רק מהזמן, והכל חוזר למצב רגיל מיד אחרי האיחוד.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/בנייה&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"מלכודות\">&lt;מלכודות&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">סרטון שמוצג בתוך three.js מקבל <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">texture.needsUpdate<\/span> <span class=\"tk\">=<\/span> <span class=\"tk\">true<\/span><span class=\"bt\">`<\/span><\/span> בכל פריים <span class=\"codeblock\" dir=\"rtl\">ו-<span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">texture.colorSpace<\/span> <span class=\"tk\">=<\/span> <span class=\"tk\">THREE.SRGBColorSpace<\/span><span class=\"bt\">`<\/span><\/span>,<\/span>אחרת הוא לא מופיע או יוצא דהוי.<\/div>\n<div class=\"pl\" dir=\"rtl\">אל תכהה את החדר ואל תוסיף לו צבע, כי זה נראה עכור.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/מלכודות&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"התחלה\">&lt;התחלה&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">תשאל אותי על הקלט, ותראה לי את צילום החדר הריק ליד פריים מהסרטון.<\/div>\n<div class=\"pl\" dir=\"rtl\">אחרי שאישרתי, תראה לי ארבעה פריימים (רגע הפירוק, השיא, השמות והנחיתה), ורק אז תרנדר את הקטע מעותק זמני וקצר של הקומפוזיציה <span class=\"nb\">ב-540<\/span> על 960 (או 960 על 540), כי ל-<span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">npx<\/span> <span class=\"tk\">hyperframes<\/span> <span class=\"tk\">render<\/span><span class=\"bt\">`<\/span><\/span> אין דגל לטווח זמן או להקטנה.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/התחלה&gt;<\/div>"}, "links": []}, {"id": "t35", "num": "3.5", "title": "מסגרת עגולה, ומוצר שמתפרק לחלקים", "t": 428.51, "see": "הפריים המלא נמשך פנימה לעיגול עם קו אור וזוהר, וזז לצד. טלפון גנרי בקווים דקים נכנס מלמטה, מרחף ומסתובב עד 25 מעלות, ומתפרק לאורך ציר העומק. נכנסות תוויות עם נקודה וקו באורכים מתחלפים: &quot;מצלמות&quot; · &quot;טעינה אלחוטית&quot; · &quot;סוללה&quot; · &quot;מעבד&quot; (מהדוגמה במדריך). החלקים חוזרים בסדר הפוך בנקישה קטנה, המוצר יוצא, והעיגול נפתח חזרה.", "exp": "הסרטון שלכם מתכווץ לעיגול בצד אחד של המסך, ובצד השני מרחף מוצר בתלת ממד. על המילה שבחרתם הוא מתפרק לחלקים האמיתיים שלו, כל חלק מרכזי מקבל תווית בעברית, ואחר כך הכל מתרכב חזרה והעיגול נפתח למסך מלא.", "fact": "31 חלקים אמיתיים · בדוגמה מהמדריך: אייפון שהתפרק <span class=\"nb\">ל-31<\/span> חלקים, עם הסבר בעברית על 5 החלקים המרכזיים.", "tip": "קלוד מחפש קודם רשימת חלקים אמיתית של המוצר, ומראה לכם אותה לאישור.", "prompt": {"n": 11, "text": "ההוראות כאן מחליפות את ראיון הפתיחה של HyperFrames, אז אל תריץ אותו.\n<קלט>\nתשאל אותי על חמישה דברים:\n- הסרטון, אם הוא לאורך (9:16) או לרוחב (16:9), ובאיזה צד של המסך יהיה העיגול שלי.\n- צבע רקע כהה, צבע הדגשה ופונט עברי של המותג שלי.\n- המוצר, ואם יש לי קובץ תלת ממד שלו (GLB), כי אחרת תבנה אותו מצורות פשוטות לפי המידות האמיתיות.\n- על אילו חלקים לשים תוויות, או שתציע 4 עד 6 חלקים מרכזיים ומשפט הסבר קצר לכל אחד.\n- המילים שעליהן קורה כל שלב: המסגרת נסגרת, המוצר נכנס, מתפרק, מתרכב, והסרטון שלי חוזר למסך מלא.\n<\/קלט>\n\n<כיוון>\nעל המילה הראשונה, הקצוות של הפריים נמשכים פנימה על קפיצים רכים, הסרטון הופך לעיגול במרכז, ואז העיגול זז לצד שבחרתי.\nסביב העיגול קו אור דק עם זוהר עדין בצבע ההדגשה, וצל רך מתחתיו.\nמאחורי העיגול רקע כהה בצבעי המותג שלי, שזז לאט.\nבחצי השני המוצר נכנס מלמטה על קפיץ, נעצר, ומרחף לאט עם סיבוב איטי של עד 25 מעלות לכל צד.\nעל המילה של הפירוק הוא מסתובב לזווית מאחור ומהצד, והחלקים נפרדים לאורך ציר העומק, כל אחד על קפיץ משלו עם הפרש קטן.\nהחלקים מצוירים בקווים דקים ובהירים עם זוהר, בסגנון של אקספליינר דוקומנטרי.\nהתוויות נכנסות אחת אחרי השנייה: נקודה על החלק, קו דק שמוביל אליה, שם החלק ושורה אחת של הסבר, בעברית ובגודל של לפחות 44 פיקסלים, בפריים של 1080 על 1920 או של 1920 על 1080.\nעל המילה של ההרכבה התוויות נאספות, החלקים חוזרים למקום בסדר הפוך ונוחתים בנקישה קטנה, והמוצר מסתובב חזרה אליי שלם.\nבסוף המוצר יוצא מהמסך, ורק אחר כך העיגול נפתח חזרה לפריים מלא, דרך מלבן מעוגל, ונוחת בדיוק בתמונה המקורית.\n<\/כיוון>\n\n<בנייה>\n1. תחפש את רשימת החלקים האמיתית של המוצר ממקור אמיתי, כמו מדריך פירוק, ותראה לי אותה עם המקור.\n2. את המוצר תבנה ב-three.js במידות אמיתיות במילימטרים, ותגדיל אותו כך שימלא את החצי שלו במסך עם שוליים נדיבים (בסרטון לרוחב זה בערך 0.6 מגובה הפריים).\n3. אם ב-GLB כל המוצר הוא רשת אחת, אי אפשר לפרק אותו, ואז תבנה את החלקים מצורות פשוטות לפי המידות האמיתיות.\n4. את העיגול תחתוך על עטיפה שמסביב ל-`<video>` ולא על ה-`<video>` עצמו, כי ברינדור HyperFrames מחליף אותו בתמונה, והעיגול אף פעם לא יוצא מגבולות הסרטון המקורי, כך שקצה של הפריים לא נראה בשום רגע.\n5. את התוויות תצייר בשכבה שטוחה מעל התלת ממד, במיקום שמחושב מהנקודה של כל חלק, והקווים באורכים שונים לסירוגין כדי ששתי תוויות לא יתנגשו.\n6. הכל בקומפוזיציה של HyperFrames, כשכל פריים מחושב רק מהזמן.\n<\/בנייה>\n\n<מלכודות>\nחלק שלא קיים במוצר האמיתי, או מספר שלא נבדק, לא עולים למסך.\nתווית לא עוברת על העיגול ולא על תווית אחרת.\nאם הסרטון מוצג בתוך three.js, הוא מקבל `texture.needsUpdate = true` בכל פריים ו-`texture.colorSpace = THREE.SRGBColorSpace`, אחרת הוא לא מופיע או יוצא דהוי.\n<\/מלכודות>\n\n<התחלה>\nתשאל אותי על הקלט, ותראה לי את רשימת החלקים ואת הטקסט של התוויות לאישור.\nאחרי שאישרתי, תראה לי פריים מכל שלב (עיגול, מוצר שלם, פירוק, תוויות, הרכבה, חזרה), ורק אז תרנדר את הקטע מעותק זמני וקצר של הקומפוזיציה ב-540 על 960 (או 960 על 540), כי ל-`npx hyperframes render` אין דגל לטווח זמן או להקטנה.\n<\/התחלה>", "note": "", "html": "<div class=\"pl\" dir=\"rtl\">ההוראות כאן מחליפות את ראיון הפתיחה של HyperFrames, אז אל תריץ אותו.<\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"קלט\">&lt;קלט&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">תשאל אותי על חמישה דברים:<\/div>\n<div class=\"pl\" dir=\"rtl\">- הסרטון, אם הוא לאורך (9:16) או לרוחב (16:9), ובאיזה צד של המסך יהיה העיגול שלי.<\/div>\n<div class=\"pl\" dir=\"rtl\">- צבע רקע כהה, צבע הדגשה ופונט עברי של המותג שלי.<\/div>\n<div class=\"pl\" dir=\"rtl\">- המוצר, ואם יש לי קובץ תלת ממד שלו (GLB), כי אחרת תבנה אותו מצורות פשוטות לפי המידות האמיתיות.<\/div>\n<div class=\"pl\" dir=\"rtl\">- על אילו חלקים לשים תוויות, או שתציע 4 עד 6 חלקים מרכזיים ומשפט הסבר קצר לכל אחד.<\/div>\n<div class=\"pl\" dir=\"rtl\">- המילים שעליהן קורה כל שלב: המסגרת נסגרת, המוצר נכנס, מתפרק, מתרכב, והסרטון שלי חוזר למסך מלא.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/קלט&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"כיוון\">&lt;כיוון&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">על המילה הראשונה, הקצוות של הפריים נמשכים פנימה על קפיצים רכים, הסרטון הופך לעיגול במרכז, ואז העיגול זז לצד שבחרתי.<\/div>\n<div class=\"pl\" dir=\"rtl\">סביב העיגול קו אור דק עם זוהר עדין בצבע ההדגשה, וצל רך מתחתיו.<\/div>\n<div class=\"pl\" dir=\"rtl\">מאחורי העיגול רקע כהה בצבעי המותג שלי, שזז לאט.<\/div>\n<div class=\"pl\" dir=\"rtl\">בחצי השני המוצר נכנס מלמטה על קפיץ, נעצר, ומרחף לאט עם סיבוב איטי של עד 25 מעלות לכל צד.<\/div>\n<div class=\"pl\" dir=\"rtl\">על המילה של הפירוק הוא מסתובב לזווית מאחור ומהצד, והחלקים נפרדים לאורך ציר העומק, כל אחד על קפיץ משלו עם הפרש קטן.<\/div>\n<div class=\"pl\" dir=\"rtl\">החלקים מצוירים בקווים דקים ובהירים עם זוהר, בסגנון של אקספליינר דוקומנטרי.<\/div>\n<div class=\"pl\" dir=\"rtl\">התוויות נכנסות אחת אחרי השנייה: נקודה על החלק, קו דק שמוביל אליה, שם החלק ושורה אחת של הסבר, בעברית ובגודל של לפחות 44 פיקסלים, בפריים של 1080 על 1920 או של 1920 על 1080.<\/div>\n<div class=\"pl\" dir=\"rtl\">על המילה של ההרכבה התוויות נאספות, החלקים חוזרים למקום בסדר הפוך ונוחתים בנקישה קטנה, והמוצר מסתובב חזרה אליי שלם.<\/div>\n<div class=\"pl\" dir=\"rtl\">בסוף המוצר יוצא מהמסך, ורק אחר כך העיגול נפתח חזרה לפריים מלא, דרך מלבן מעוגל, ונוחת בדיוק בתמונה המקורית.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/כיוון&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"בנייה\">&lt;בנייה&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">1. תחפש את רשימת החלקים האמיתית של המוצר ממקור אמיתי, כמו מדריך פירוק, ותראה לי אותה עם המקור.<\/div>\n<div class=\"pl\" dir=\"rtl\">2. את המוצר תבנה <span class=\"nb\">ב-three.js<\/span> במידות אמיתיות במילימטרים, ותגדיל אותו כך שימלא את החצי שלו במסך עם שוליים נדיבים (בסרטון לרוחב זה בערך 0.6 מגובה הפריים).<\/div>\n<div class=\"pl\" dir=\"rtl\">3. אם <span class=\"nb\">ב-GLB<\/span> כל המוצר הוא רשת אחת, אי אפשר לפרק אותו, ואז תבנה את החלקים מצורות פשוטות לפי המידות האמיתיות.<\/div>\n<div class=\"pl\" dir=\"rtl\">4. את העיגול תחתוך על עטיפה שמסביב ל-<span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">&lt;video&gt;<\/span><span class=\"bt\">`<\/span><\/span> ולא על ה-<span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">&lt;video&gt;<\/span><span class=\"bt\">`<\/span><\/span> עצמו, כי ברינדור HyperFrames מחליף אותו בתמונה, והעיגול אף פעם לא יוצא מגבולות הסרטון המקורי, כך שקצה של הפריים לא נראה בשום רגע.<\/div>\n<div class=\"pl\" dir=\"rtl\">5. את התוויות תצייר בשכבה שטוחה מעל התלת ממד, במיקום שמחושב מהנקודה של כל חלק, והקווים באורכים שונים לסירוגין כדי ששתי תוויות לא יתנגשו.<\/div>\n<div class=\"pl\" dir=\"rtl\">6. הכל בקומפוזיציה של HyperFrames, כשכל פריים מחושב רק מהזמן.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/בנייה&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"מלכודות\">&lt;מלכודות&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">חלק שלא קיים במוצר האמיתי, או מספר שלא נבדק, לא עולים למסך.<\/div>\n<div class=\"pl\" dir=\"rtl\">תווית לא עוברת על העיגול ולא על תווית אחרת.<\/div>\n<div class=\"pl\" dir=\"rtl\">אם הסרטון מוצג בתוך three.js, הוא מקבל <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">texture.needsUpdate<\/span> <span class=\"tk\">=<\/span> <span class=\"tk\">true<\/span><span class=\"bt\">`<\/span><\/span> בכל פריים <span class=\"codeblock\" dir=\"rtl\">ו-<span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">texture.colorSpace<\/span> <span class=\"tk\">=<\/span> <span class=\"tk\">THREE.SRGBColorSpace<\/span><span class=\"bt\">`<\/span><\/span>,<\/span>אחרת הוא לא מופיע או יוצא דהוי.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/מלכודות&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"התחלה\">&lt;התחלה&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">תשאל אותי על הקלט, ותראה לי את רשימת החלקים ואת הטקסט של התוויות לאישור.<\/div>\n<div class=\"pl\" dir=\"rtl\">אחרי שאישרתי, תראה לי פריים מכל שלב (עיגול, מוצר שלם, פירוק, תוויות, הרכבה, חזרה), ורק אז תרנדר את הקטע מעותק זמני וקצר של הקומפוזיציה <span class=\"nb\">ב-540<\/span> על 960 (או 960 על 540), כי ל-<span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">npx<\/span> <span class=\"tk\">hyperframes<\/span> <span class=\"tk\">render<\/span><span class=\"bt\">`<\/span><\/span> אין דגל לטווח זמן או להקטנה.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/התחלה&gt;<\/div>"}, "links": []}, {"id": "t36", "num": "3.6", "title": "הסרטונים הכי נצפים מסתובבים סביבכם", "t": 463.86, "see": "שמונה כרטיסים לאורך עפים מקצוות המסך לקשת מאחורי הצללית, מרחפים, ואז הקשת יורדת למסלול נטוי שמאיץ. הכרטיסים הקרובים עוברים לפני הצללית והרחוקים מאחוריה, וקו אור חלש מצייר את המסלול. שלושת הראשונים מקבלים תווית עם אייקון של עין (&quot;מספר צפיות אמיתי&quot;, בלי מספרים מומצאים). ביציאה הכרטיסים עפים החוצה.", "exp": "סרטונים שכבר הצליחו הם ההוכחה הכי טובה שאפשר לשים על המסך. הם הופכים לכרטיסים קטנים שמתנגנים, עולים לקשת מעל הראש ואז מסתובבים במסלול סביבכם, חצי מאחוריכם וחצי מלפניכם.", "fact": "8 הרילס הכי נצפים · הם עלו מעל הראש על המילים &quot;ותשים מעלי את כל הסרטונים הכי נצפים שלי&quot;.", "tip": "שמים מספר בתחילת השם של כל קובץ לפי הסדר מהנצפה ביותר, כי מהקבצים עצמם קלוד לא יכול לדעת.", "prompt": {"n": 12, "text": "ההוראות כאן מחליפות את ראיון הפתיחה של HyperFrames, אז אל תריץ אותו.\n<קלט>\nתשאל אותי על שלושה דברים:\n- הסרטון, והמילים שעליהן הכרטיסים עולים, מרחפים, מתחילים להסתובב ועפים החוצה.\n- 6 עד 8 סרטונים שלי בתיקייה, עם מספר בתחילת השם לפי הסדר מהנצפה ביותר.\n- אם להציג מספר צפיות, ואז את המספרים האמיתיים לכל סרטון.\n<\/קלט>\n\n<כיוון>\nכל סרטון הוא כרטיס לאורך עם פינות מעוגלות, שמתנגן בלי קול.\nעל המילה הראשונה הכרטיסים עולים מהקצוות של המסך ונעמדים בקשת מעל הראש ולצדדים, כולם מאחוריי.\nעל המילה של הריחוף הם מרחפים קצת יותר, בתנועה איטית וקטנה.\nעל המילה של הסיבוב הקשת יורדת למסלול נטוי סביבי, והמסלול מאיץ: החצי הקרוב עובר מלפניי והחצי הרחוק מאחוריי.\nקו אור דק וחלש מצייר את המסלול.\nאם ביקשתי, רק שלושת הסרטונים הכי נצפים מקבלים תווית קטנה עם אייקון של עין ומספר הצפיות האמיתי.\nביציאה הכרטיסים עפים החוצה מהמסך.\n<\/כיוון>\n\n<בנייה>\n1. תפריד אותי מהרקע עם `npx hyperframes remove-background <הסרטון> -o cutout.webm --quality best`.\n2. תמצא את הפנים בכל פריים עם `FaceDetector` של MediaPipe, כדי שמרכז המסלול יזוז איתי והכרטיסים לא יעלו על הפנים, ואת MediaPipe תתקין בתוך venv עם `pip install mediapipe==0.10.35`, כי הגרסה האחרונה ב-pip קורסת ב-Mac.\n3. מכל סרטון שלי תוציא פריימים קטנים (רוחב של בערך 360 פיקסלים) ותטען אותם כתמונות, כי שמונה סרטונים שמתנגנים יחד בדפדפן כבדים מדי, ואם יש יותר מכמה מאות פריימים, תאחד את הפריימים של כל סרטון לגיליון אחד בקצב של 15 פריימים לשנייה.\n4. את המסלול תבנה ב-three.js בקומפוזיציה של HyperFrames, עם שלוש שכבות: הכרטיסים שמאחוריי, אני בלי הרקע, והכרטיסים שלפניי.\n5. כרטיס עובר משכבה לשכבה רק כשהוא בקצה הצדדי של המסלול, רחוק ממני, כי מעבר מול הגוף נראה כמו כרטיס שחותך אותי.\n6. כל פריים מחושב רק מהזמן, והכרטיסים נכנסים בקפיצים בלי קפיצה גדולה מעבר ליעד.\n<\/בנייה>\n\n<מלכודות>\nמספר צפיות שלא נתתי לך לא עולה למסך.\nסרטון שמוצג בתוך three.js, כמו הגוף שלי בלי הרקע, מקבל `texture.needsUpdate = true` בכל פריים ו-`texture.colorSpace = THREE.SRGBColorSpace`, אחרת הוא לא מופיע או יוצא דהוי.\n<\/מלכודות>\n\n<התחלה>\nתשאל אותי על הקלט, ותראה לי ארבעה פריימים: הקשת, הריחוף, המסלול כשכרטיס עובר מלפניי, והיציאה.\nאחרי שאישרתי, תרנדר את הקטע מעותק זמני וקצר של הקומפוזיציה ב-540 על 960 (או 960 על 540), כי ל-`npx hyperframes render` אין דגל לטווח זמן או להקטנה.\n<\/התחלה>", "note": "", "html": "<div class=\"pl\" dir=\"rtl\">ההוראות כאן מחליפות את ראיון הפתיחה של HyperFrames, אז אל תריץ אותו.<\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"קלט\">&lt;קלט&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">תשאל אותי על שלושה דברים:<\/div>\n<div class=\"pl\" dir=\"rtl\">- הסרטון, והמילים שעליהן הכרטיסים עולים, מרחפים, מתחילים להסתובב ועפים החוצה.<\/div>\n<div class=\"pl\" dir=\"rtl\">- 6 עד 8 סרטונים שלי בתיקייה, עם מספר בתחילת השם לפי הסדר מהנצפה ביותר.<\/div>\n<div class=\"pl\" dir=\"rtl\">- אם להציג מספר צפיות, ואז את המספרים האמיתיים לכל סרטון.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/קלט&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"כיוון\">&lt;כיוון&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">כל סרטון הוא כרטיס לאורך עם פינות מעוגלות, שמתנגן בלי קול.<\/div>\n<div class=\"pl\" dir=\"rtl\">על המילה הראשונה הכרטיסים עולים מהקצוות של המסך ונעמדים בקשת מעל הראש ולצדדים, כולם מאחוריי.<\/div>\n<div class=\"pl\" dir=\"rtl\">על המילה של הריחוף הם מרחפים קצת יותר, בתנועה איטית וקטנה.<\/div>\n<div class=\"pl\" dir=\"rtl\">על המילה של הסיבוב הקשת יורדת למסלול נטוי סביבי, והמסלול מאיץ: החצי הקרוב עובר מלפניי והחצי הרחוק מאחוריי.<\/div>\n<div class=\"pl\" dir=\"rtl\">קו אור דק וחלש מצייר את המסלול.<\/div>\n<div class=\"pl\" dir=\"rtl\">אם ביקשתי, רק שלושת הסרטונים הכי נצפים מקבלים תווית קטנה עם אייקון של עין ומספר הצפיות האמיתי.<\/div>\n<div class=\"pl\" dir=\"rtl\">ביציאה הכרטיסים עפים החוצה מהמסך.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/כיוון&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"בנייה\">&lt;בנייה&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">1. תפריד אותי מהרקע עם <span class=\"codeblock\" dir=\"rtl\"><span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">npx<\/span> <span class=\"tk\">hyperframes<\/span> <span class=\"tk\">remove-background<\/span> <span class=\"tk\"><bdi dir=\"ltr\">&lt;הסרטון&gt;<\/bdi><\/span> <span class=\"tk\">-o cutout.webm<\/span> <span class=\"tk\">--quality best<\/span><span class=\"bt\">`<\/span><\/span>.<\/span><\/div>\n<div class=\"pl\" dir=\"rtl\">2. תמצא את הפנים בכל פריים עם <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">FaceDetector<\/span><span class=\"bt\">`<\/span><\/span> של MediaPipe, כדי שמרכז המסלול יזוז איתי והכרטיסים לא יעלו על הפנים, ואת MediaPipe תתקין בתוך venv עם <span class=\"codeblock\" dir=\"rtl\"><span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">pip<\/span> <span class=\"tk\">install<\/span> <span class=\"tk\">mediapipe==0.10.35<\/span><span class=\"bt\">`<\/span><\/span>,<\/span>כי הגרסה האחרונה <span class=\"nb\">ב-pip<\/span> קורסת <span class=\"nb\">ב-Mac.<\/span><\/div>\n<div class=\"pl\" dir=\"rtl\">3. מכל סרטון שלי תוציא פריימים קטנים (רוחב של בערך 360 פיקסלים) ותטען אותם כתמונות, כי שמונה סרטונים שמתנגנים יחד בדפדפן כבדים מדי, ואם יש יותר מכמה מאות פריימים, תאחד את הפריימים של כל סרטון לגיליון אחד בקצב של 15 פריימים לשנייה.<\/div>\n<div class=\"pl\" dir=\"rtl\">4. את המסלול תבנה <span class=\"nb\">ב-three.js<\/span> בקומפוזיציה של HyperFrames, עם שלוש שכבות: הכרטיסים שמאחוריי, אני בלי הרקע, והכרטיסים שלפניי.<\/div>\n<div class=\"pl\" dir=\"rtl\">5. כרטיס עובר משכבה לשכבה רק כשהוא בקצה הצדדי של המסלול, רחוק ממני, כי מעבר מול הגוף נראה כמו כרטיס שחותך אותי.<\/div>\n<div class=\"pl\" dir=\"rtl\">6. כל פריים מחושב רק מהזמן, והכרטיסים נכנסים בקפיצים בלי קפיצה גדולה מעבר ליעד.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/בנייה&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"מלכודות\">&lt;מלכודות&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">מספר צפיות שלא נתתי לך לא עולה למסך.<\/div>\n<div class=\"pl\" dir=\"rtl\">סרטון שמוצג בתוך three.js, כמו הגוף שלי בלי הרקע, מקבל <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">texture.needsUpdate<\/span> <span class=\"tk\">=<\/span> <span class=\"tk\">true<\/span><span class=\"bt\">`<\/span><\/span> בכל פריים <span class=\"codeblock\" dir=\"rtl\">ו-<span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">texture.colorSpace<\/span> <span class=\"tk\">=<\/span> <span class=\"tk\">THREE.SRGBColorSpace<\/span><span class=\"bt\">`<\/span><\/span>,<\/span>אחרת הוא לא מופיע או יוצא דהוי.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/מלכודות&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"התחלה\">&lt;התחלה&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">תשאל אותי על הקלט, ותראה לי ארבעה פריימים: הקשת, הריחוף, המסלול כשכרטיס עובר מלפניי, והיציאה.<\/div>\n<div class=\"pl\" dir=\"rtl\">אחרי שאישרתי, תרנדר את הקטע מעותק זמני וקצר של הקומפוזיציה <span class=\"nb\">ב-540<\/span> על 960 (או 960 על 540), כי ל-<span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">npx<\/span> <span class=\"tk\">hyperframes<\/span> <span class=\"tk\">render<\/span><span class=\"bt\">`<\/span><\/span> אין דגל לטווח זמן או להקטנה.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/התחלה&gt;<\/div>"}, "links": []}, {"id": "t37", "num": "3.7", "title": "זום קפיצי על המילה החשובה בכל משפט", "t": 497.13, "see": "צללית מדברת עם כתוביות. על כל מילה חשובה התמונה נכנסת 12 אחוז בקפיץ, וחוזרת למקום במשפט הבא. לידה גרף של עקומת <span class=\"nb\">ה-ease<\/span> מהמדריך שמצטייר בזמן אמת, ובמשפט ארוך דחיפה איטית של 3 אחוז.", "exp": "לא כל סרטון צריך תלת ממד. בכל משפט יש מילה אחת שהכי חשובה, וקלוד מקרב עליה את התמונה <span class=\"nb\">ב-10<\/span> עד 15 אחוז בתנועת קפיץ, בדיוק כשהיא נאמרת. מרכז הזום תמיד על הפנים, והוא מתאפס בחיתוך הבא.", "fact": "10 עד 15 אחוז · בפתיחה של 7 שניות נבחרו שלוש מילים: &quot;קלוד&quot;, &quot;נבדוק&quot; ו&quot;אותו&quot;. · שמתם לב? הזום הזה מופיע לאורך כל הסרטון.", "tip": "זום של 15 אחוז על סרטון של 1080 מרכך את התמונה. יודעים מראש שתעשו זומים? מצלמים <span class=\"nb\">ב-4K.<\/span>", "prompt": {"n": 13, "text": "ההוראות כאן מחליפות את ראיון הפתיחה של HyperFrames, אז אל תריץ אותו.\nתתמלל את הסרטון עם זמן לכל מילה, בעזרת `npx hyperframes transcribe <הקובץ> --language he --model large-v3`, ותבחר בכל משפט לכל היותר מילה אחת, הכי חזקה, כדי שהזום יישאר מיוחד.\nתראה לי את רשימת המילים עם הזמנים, ותחכה לאישור לפני שאתה בונה.\nעל כל מילה כזאת יש זום פנימה של 10 עד 15 אחוז, בתנועת קפיץ שמתחילה עם תחילת המילה, מהירה בהתחלה ונעצרת בעדינות בלי לעבור את היעד.\nלקפיץ הזה תשתמש ב-ease `p => (1-(1+7*p)*Math.exp(-7*p)) / (1-8*Math.exp(-7))`, כי ב-GSAP אין כזה מובנה.\nמרכז הזום הוא הפנים שלי, כך שהן אף פעם לא יוצאות מהפריים, והוא נכתב באחוזים מהפריים ולא בפיקסלים.\nאת הפנים תמצא עם `FaceDetector` של MediaPipe, שתתקין בתוך venv עם `pip install mediapipe==0.10.35` כי הגרסה האחרונה קורסת ב-Mac.\nבכל פריים תבחר את הזיהוי עם הציון הכי גבוה בחצי העליון של הפריים ותחליק את המסלול, כי ידיים מזוהות לפעמים כפנים.\nהזום נשאר עד החיתוך הבא וחוזר שם ל-100 אחוז בבת אחת, ואם אין חיתוך עד המשפט הבא, הוא חוזר במילה הראשונה של המשפט הבא.\nבמשפט ארוך מותרת דחיפה איטית פנימה של 2 עד 4 אחוז, ולא יותר.\nהסרטון מקבל `data-has-audio=\"true\"` בלי `muted`, כדי שהקול יישאר.\nתעבוד מהקובץ ברזולוציה המקורית, ואם הוא לא גדול מהפלט לפחות ב-15 אחוז, תגיד לי שהזום יטשטש.\nקודם תרנדר 10 שניות מעותק זמני של הפרויקט ב-540 על 960 (או 960 על 540), כי ל-`npx hyperframes render` אין דגל לטווח זמן או להקטנה, ואת כל הסרטון רק אחרי שאישרתי.", "note": "", "html": "<div class=\"pl\" dir=\"rtl\">ההוראות כאן מחליפות את ראיון הפתיחה של HyperFrames, אז אל תריץ אותו.<\/div>\n<div class=\"pl\" dir=\"rtl\">תתמלל את הסרטון עם זמן לכל מילה, בעזרת <span class=\"codeblock\" dir=\"rtl\"><span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">npx<\/span> <span class=\"tk\">hyperframes<\/span> <span class=\"tk\">transcribe<\/span> <span class=\"tk\"><bdi dir=\"ltr\">&lt;הקובץ&gt;<\/bdi><\/span> <span class=\"tk\">--language he<\/span> <span class=\"tk\">--model large-v3<\/span><span class=\"bt\">`<\/span><\/span>,<\/span>ותבחר בכל משפט לכל היותר מילה אחת, הכי חזקה, כדי שהזום יישאר מיוחד.<\/div>\n<div class=\"pl\" dir=\"rtl\">תראה לי את רשימת המילים עם הזמנים, ותחכה לאישור לפני שאתה בונה.<\/div>\n<div class=\"pl\" dir=\"rtl\">על כל מילה כזאת יש זום פנימה של 10 עד 15 אחוז, בתנועת קפיץ שמתחילה עם תחילת המילה, מהירה בהתחלה ונעצרת בעדינות בלי לעבור את היעד.<\/div>\n<div class=\"pl\" dir=\"rtl\">לקפיץ הזה תשתמש <span class=\"nb\">ב-ease<\/span> <span class=\"codeblock\" dir=\"rtl\"><span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">p<\/span> <span class=\"tk\">=&gt;<\/span> <span class=\"tk\">(1-(1+7*p)*Math.exp(-7*p))<\/span> <span class=\"tk\">/<\/span> <span class=\"tk\">(1-8*Math.exp(-7))<\/span><span class=\"bt\">`<\/span><\/span>,<\/span>כי <span class=\"nb\">ב-GSAP<\/span> אין כזה מובנה.<\/div>\n<div class=\"pl\" dir=\"rtl\">מרכז הזום הוא הפנים שלי, כך שהן אף פעם לא יוצאות מהפריים, והוא נכתב באחוזים מהפריים ולא בפיקסלים.<\/div>\n<div class=\"pl\" dir=\"rtl\">את הפנים תמצא עם <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">FaceDetector<\/span><span class=\"bt\">`<\/span><\/span> של MediaPipe, שתתקין בתוך venv עם <span class=\"codeblock\" dir=\"rtl\"><span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">pip<\/span> <span class=\"tk\">install<\/span> <span class=\"tk\">mediapipe==0.10.35<\/span><span class=\"bt\">`<\/span><\/span><\/span>כי הגרסה האחרונה קורסת <span class=\"nb\">ב-Mac.<\/span><\/div>\n<div class=\"pl\" dir=\"rtl\">בכל פריים תבחר את הזיהוי עם הציון הכי גבוה בחצי העליון של הפריים ותחליק את המסלול, כי ידיים מזוהות לפעמים כפנים.<\/div>\n<div class=\"pl\" dir=\"rtl\">הזום נשאר עד החיתוך הבא וחוזר שם <span class=\"nb\">ל-100<\/span> אחוז בבת אחת, ואם אין חיתוך עד המשפט הבא, הוא חוזר במילה הראשונה של המשפט הבא.<\/div>\n<div class=\"pl\" dir=\"rtl\">במשפט ארוך מותרת דחיפה איטית פנימה של 2 עד 4 אחוז, ולא יותר.<\/div>\n<div class=\"pl\" dir=\"rtl\">הסרטון מקבל <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">data-has-audio=&quot;true&quot;<\/span><span class=\"bt\">`<\/span><\/span> בלי <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">muted<\/span><span class=\"bt\">`<\/span><\/span>, כדי שהקול יישאר.<\/div>\n<div class=\"pl\" dir=\"rtl\">תעבוד מהקובץ ברזולוציה המקורית, ואם הוא לא גדול מהפלט לפחות <span class=\"nb\">ב-15<\/span> אחוז, תגיד לי שהזום יטשטש.<\/div>\n<div class=\"pl\" dir=\"rtl\">קודם תרנדר 10 שניות מעותק זמני של הפרויקט <span class=\"nb\">ב-540<\/span> על 960 (או 960 על 540), כי ל-<span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">npx<\/span> <span class=\"tk\">hyperframes<\/span> <span class=\"tk\">render<\/span><span class=\"bt\">`<\/span><\/span> אין דגל לטווח זמן או להקטנה, ואת כל הסרטון רק אחרי שאישרתי.<\/div>"}, "links": []}]}, {"n": 4, "title": "בירולים", "t": 534.77, "sub": "בירול הוא קליפ שנכנס מעל הדיבור ומראה את מה שאומרים באותו רגע. בלעדיו גם הסבר מעולה מתחיל להרגיש כמו הרצאה.", "items": [{"id": "t41", "num": "4.1", "title": "אנימציה על רקע שקוף", "t": 540.22, "see": "משטח משובץ (שקיפות), ועליו קופצים בקפיץ שני כרטיסים, &quot;פרומפט&quot; ו&quot;סקילים&quot; (הדוגמה מהמדריך). הם עוברים לשבת ליד הראש של הצללית, ואז מגיעה בדיקת הירוק: מתחת לקליפ צבע ירוק מלא, והתווית &quot;הרקע נשאר ירוק: השקיפות עובדת&quot;. תגיות קבצים: &quot;clip.mov · ProRes 4444&quot; · &quot;clip-brand.mp4&quot;.", "exp": "לפעמים כל מה שהמשפט צריך זה מילה או אייקון שקופצים ליד הראש. קלוד מוציא אותם כקובץ MOV שקוף שמניחים מעל הסרטון, וגם <span class=\"nb\">כ-MP4<\/span> על צבע המותג, למקרה שהתוכנה לא קוראת קובץ שקוף.", "fact": "אטימות 85–90 אחוז · שקיפות של 50 עד 70 אחוז נראית דהויה על וידאו אמיתי.", "tip": "לפני שמכניסים לתוכנת העריכה, מבקשים לראות את הקובץ מעל ירוק מלא. קובץ שקוף אחד יצא בלי שקיפות, ורק הירוק תפס את זה.", "prompt": {"n": 14, "text": "ההוראות כאן מחליפות את ראיון הפתיחה של HyperFrames, אז אל תריץ אותו.\n<קלט>\nתשאל אותי על ארבעה דברים:\n- המשפט שהאנימציה מלווה, או הסרטון, ואז תתמלל אותו בעצמך.\n- צבע המותג שלי ופונט עברי (ברירת המחדל Rubik).\n- הגודל, 1080 על 1920 לרילס או 1920 על 1080 ליוטיוב.\n- איפה בפריים יושבים הפנים שלי והכתוביות, כדי שהאנימציה לא תעלה עליהם.\n<\/קלט>\n\n<כיוון>\nהאנימציה מינימלית ככל האפשר, עם מילה או שתיים בעברית, אייקון בקו אחד וצורות פשוטות.\nבלי רקע, בלי עיטורים, ובלי משפט שחוזר על מה שנאמר בסרטון.\nדברים שמניתי באותה נשימה נכנסים לסצנה אחת שמצטברת, ולא לקליפים נפרדים.\nהמשטחים כמעט אטומים, 85 עד 90 אחוז, כי שקיפות של 50 עד 70 אחוז נראית דהויה על וידאו אמיתי.\nהטקסט והאייקונים עצמם אטומים לגמרי.\nכל אלמנט נכנס בתנועת קפיץ ואז נשאר במקום, בלי ריחוף או פעימה שלא נגמרים.\nכל הטקסט בעברית, Rubik, עם ריווח אותיות של כמעט אפס.\nשוליים נדיבים, ובפורמט לאורך הקצה העליון של האלמנטים לא מעל y 300, כי הממשק של הרשתות מכסה את החלק העליון.\n<\/כיוון>\n\n<בנייה>\n1. קומפוזיציה של HyperFrames בלי שום רקע, כשגם ה-html וגם ה-body שקופים.\n2. רינדור שקוף עם `npx hyperframes render <התיקייה> --format mov --output clip.mov`, שמוציא ProRes 4444 עם שקיפות.\n3. תבדוק עם `ffprobe -show_entries stream=pix_fmt` שהפורמט מתחיל ב-yuva.\n4. תוכיח שהשקיפות עובדת: תניח את הקליפ מעל צבע ירוק מלא באותו גודל של הקליפ, עם `ffmpeg -f lavfi -i color=c=0x1E7A46:s=<רוחב>x<גובה>:d=<משך> -i clip.mov -filter_complex \"[0][1]overlay=shortest=1\" -ss <זמן> -frames:v 1 test.png`, ותסתכל שהרקע נשאר ירוק.\n5. בנוסף תוציא MP4 של אותה אנימציה על רקע בצבע המותג, למי שהתוכנה שלו לא קוראת MOV שקוף: `ffmpeg -f lavfi -i color=c=<צבע>:s=<רוחב>x<גובה>:r=30:d=<משך> -i clip.mov -filter_complex \"[0][1]overlay=shortest=1,format=yuv420p\" -c:v libx264 -crf 16 clip-brand.mp4`.\n6. אם האלמנטים עצמם בצבע המותג, הרקע של ה-MP4 יהיה בגוון כהה יותר של המותג, כדי שהצורות לא ייעלמו.\n<\/בנייה>\n\n<מלכודות>\nטקסט עם גרדיאנט בתוך האותיות יוצא שקוף לגמרי ברינדור, ולכן משתמשים בצבע מלא עם זוהר מאחורי האותיות.\nצל או הכהיה בפינות שיושבים מעל האלמנטים הופכים לבן לאפור, ולכן לבן צריך להימדד בערך 255 בפריים המרונדר.\nלא לשים `dir=\"rtl\"` על תגית ה-html, כי הרינדור יוצא שחור.\n<\/מלכודות>\n\n<התחלה>\nתשאל אותי על הקלט, ולפני שאתה מרנדר תצלם פריים מכל שלב של האנימציה עם `npx hyperframes snapshot --at <זמנים> --no-end` ותראה לי אותם מונחים מעל צבע מלא.\n<\/התחלה>", "note": "", "html": "<div class=\"pl\" dir=\"rtl\">ההוראות כאן מחליפות את ראיון הפתיחה של HyperFrames, אז אל תריץ אותו.<\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"קלט\">&lt;קלט&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">תשאל אותי על ארבעה דברים:<\/div>\n<div class=\"pl\" dir=\"rtl\">- המשפט שהאנימציה מלווה, או הסרטון, ואז תתמלל אותו בעצמך.<\/div>\n<div class=\"pl\" dir=\"rtl\">- צבע המותג שלי ופונט עברי (ברירת המחדל Rubik).<\/div>\n<div class=\"pl\" dir=\"rtl\">- הגודל, 1080 על 1920 לרילס או 1920 על 1080 ליוטיוב.<\/div>\n<div class=\"pl\" dir=\"rtl\">- איפה בפריים יושבים הפנים שלי והכתוביות, כדי שהאנימציה לא תעלה עליהם.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/קלט&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"כיוון\">&lt;כיוון&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">האנימציה מינימלית ככל האפשר, עם מילה או שתיים בעברית, אייקון בקו אחד וצורות פשוטות.<\/div>\n<div class=\"pl\" dir=\"rtl\">בלי רקע, בלי עיטורים, ובלי משפט שחוזר על מה שנאמר בסרטון.<\/div>\n<div class=\"pl\" dir=\"rtl\">דברים שמניתי באותה נשימה נכנסים לסצנה אחת שמצטברת, ולא לקליפים נפרדים.<\/div>\n<div class=\"pl\" dir=\"rtl\">המשטחים כמעט אטומים, 85 עד 90 אחוז, כי שקיפות של 50 עד 70 אחוז נראית דהויה על וידאו אמיתי.<\/div>\n<div class=\"pl\" dir=\"rtl\">הטקסט והאייקונים עצמם אטומים לגמרי.<\/div>\n<div class=\"pl\" dir=\"rtl\">כל אלמנט נכנס בתנועת קפיץ ואז נשאר במקום, בלי ריחוף או פעימה שלא נגמרים.<\/div>\n<div class=\"pl\" dir=\"rtl\">כל הטקסט בעברית, Rubik, עם ריווח אותיות של כמעט אפס.<\/div>\n<div class=\"pl\" dir=\"rtl\">שוליים נדיבים, ובפורמט לאורך הקצה העליון של האלמנטים לא מעל y 300, כי הממשק של הרשתות מכסה את החלק העליון.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/כיוון&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"בנייה\">&lt;בנייה&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">1. קומפוזיציה של HyperFrames בלי שום רקע, כשגם <span class=\"nb\">ה-html<\/span> וגם <span class=\"nb\">ה-body<\/span> שקופים.<\/div>\n<div class=\"pl\" dir=\"rtl\">2. רינדור שקוף עם <span class=\"codeblock\" dir=\"rtl\"><span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">npx<\/span> <span class=\"tk\">hyperframes<\/span> <span class=\"tk\">render<\/span> <span class=\"tk\"><bdi dir=\"ltr\">&lt;התיקייה&gt;<\/bdi><\/span> <span class=\"tk\">--format mov<\/span> <span class=\"tk\">--output clip.mov<\/span><span class=\"bt\">`<\/span><\/span>,<\/span>שמוציא ProRes 4444 עם שקיפות.<\/div>\n<div class=\"pl\" dir=\"rtl\">3. תבדוק עם <span class=\"codeblock\" dir=\"rtl\"><span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">ffprobe<\/span> <span class=\"tk\">-show_entries stream=pix_fmt<\/span><span class=\"bt\">`<\/span><\/span><\/span>שהפורמט מתחיל <span class=\"nb\">ב-yuva.<\/span><\/div>\n<div class=\"pl\" dir=\"rtl\">4. תוכיח שהשקיפות עובדת: תניח את הקליפ מעל צבע ירוק מלא באותו גודל של הקליפ, עם <span class=\"codeblock\" dir=\"rtl\"><span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">ffmpeg<\/span> <span class=\"tk\">-f lavfi<\/span> <span class=\"tk\">-i color=c=0x1E7A46:<\/span><wbr><span class=\"tk\">s=<bdi dir=\"ltr\">&lt;רוחב&gt;<\/bdi>x<bdi dir=\"ltr\">&lt;גובה&gt;<\/bdi>:<\/span><wbr><span class=\"tk\">d=<bdi dir=\"ltr\">&lt;משך&gt;<\/bdi><\/span> <span class=\"tk\">-i clip.mov<\/span> <span class=\"tk\">-filter_complex &quot;[0]<\/span><wbr><span class=\"tk\">[1]<\/span><wbr><span class=\"tk\">overlay=shortest=1&quot;<\/span> <span class=\"tk\">-ss <bdi dir=\"ltr\">&lt;זמן&gt;<\/bdi><\/span> <span class=\"tk\">-frames:v 1<\/span> <span class=\"tk\">test.png<\/span><span class=\"bt\">`<\/span><\/span>,<\/span>ותסתכל שהרקע נשאר ירוק.<\/div>\n<div class=\"pl\" dir=\"rtl\">5. בנוסף תוציא MP4 של אותה אנימציה על רקע בצבע המותג, למי שהתוכנה שלו לא קוראת MOV שקוף: <span class=\"codeblock\" dir=\"rtl\"><span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">ffmpeg<\/span> <span class=\"tk\">-f lavfi<\/span> <span class=\"tk\">-i color=c=<bdi dir=\"ltr\">&lt;צבע&gt;<\/bdi>:<\/span><wbr><span class=\"tk\">s=<bdi dir=\"ltr\">&lt;רוחב&gt;<\/bdi>x<bdi dir=\"ltr\">&lt;גובה&gt;<\/bdi>:<\/span><wbr><span class=\"tk\">r=30:<\/span><wbr><span class=\"tk\">d=<bdi dir=\"ltr\">&lt;משך&gt;<\/bdi><\/span> <span class=\"tk\">-i clip.mov<\/span> <span class=\"tk\">-filter_complex &quot;[0]<\/span><wbr><span class=\"tk\">[1]<\/span><wbr><span class=\"tk\">overlay=shortest=1,<\/span><wbr><span class=\"tk\">format=yuv420p&quot;<\/span> <span class=\"tk\">-c:v libx264<\/span> <span class=\"tk\">-crf 16<\/span> <span class=\"tk\">clip-brand.mp4<\/span><span class=\"bt\">`<\/span><\/span>.<\/span><\/div>\n<div class=\"pl\" dir=\"rtl\">6. אם האלמנטים עצמם בצבע המותג, הרקע של <span class=\"nb\">ה-MP4<\/span> יהיה בגוון כהה יותר של המותג, כדי שהצורות לא ייעלמו.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/בנייה&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"מלכודות\">&lt;מלכודות&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">טקסט עם גרדיאנט בתוך האותיות יוצא שקוף לגמרי ברינדור, ולכן משתמשים בצבע מלא עם זוהר מאחורי האותיות.<\/div>\n<div class=\"pl\" dir=\"rtl\">צל או הכהיה בפינות שיושבים מעל האלמנטים הופכים לבן לאפור, ולכן לבן צריך להימדד בערך 255 בפריים המרונדר.<\/div>\n<div class=\"pl\" dir=\"rtl\">לא לשים <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">dir=&quot;rtl&quot;<\/span><span class=\"bt\">`<\/span><\/span> על תגית <span class=\"nb\">ה-html,<\/span> כי הרינדור יוצא שחור.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/מלכודות&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"התחלה\">&lt;התחלה&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">תשאל אותי על הקלט, ולפני שאתה מרנדר תצלם פריים מכל שלב של האנימציה עם <span class=\"codeblock\" dir=\"rtl\"><span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">npx<\/span> <span class=\"tk\">hyperframes<\/span> <span class=\"tk\">snapshot<\/span> <span class=\"tk\">--at <bdi dir=\"ltr\">&lt;זמנים&gt;<\/bdi><\/span> <span class=\"tk\">--no-end<\/span><span class=\"bt\">`<\/span><\/span><\/span>ותראה לי אותם מונחים מעל צבע מלא.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/התחלה&gt;<\/div>"}, "links": []}, {"id": "t42", "num": "4.2", "title": "קליפ AI עם הפנים האמיתיות שלכם, דרך fal.ai", "t": 574.6, "see": "תרשים זרימה מימין לשמאל: 4 פריימים של הצללית (אחד מקדימה ושלושה מזוויות קצת שונות, אחד מהם עם חיוך) ← העלאה <span class=\"nb\">ל-fal.ai<\/span> ← שתי גרסאות של פריים פתיחה ובחירה באחת ← מודל וידאו עם רפרנס לפנים ← רצועה של 6 פריימים לבדיקת הפנים ← &quot;אם הפנים זזות בסוף, חותכים לפני&quot;. הפלט מסומן &quot;בלי טקסט · בלי מוזיקה · בלי קול&quot;.", "exp": "קלוד לוקח ארבעה פריימים חדים מהסרטון ושולח אותם <span class=\"nb\">ל-fal.ai,<\/span> פלטפורמה עם המון מודלים ליצירת תמונות וסרטונים. שם הוא יוצר פריים פתיחה בסצנה חדשה ומנפיש אותו במודל שמקבל פנים אמיתיות כרפרנס.", "fact": "בערך דולר לקליפ · קליפ של 5 שניות עם הפנים שלכם, כולל שתי גרסאות של פריים הפתיחה. · הפרומפט בודק לבד אם fal מחובר, ואם לא, קלוד מחבר אותו ומבקש מכם רק להתחבר עם החשבון.", "tip": "צחוק גדול עיוות את הפנים, ולכן הפרומפט כותב smiling warmly (חיוך חם) במקום צחוק.", "prompt": {"n": 15, "text": "<קלט>\nתשאל אותי על ארבעה דברים:\n- הסרטון שממנו לוקחים את הפנים שלי, או תמונות חדות שלי מקדימה ומהצד.\n- הסצנה, כלומר איפה הקליפ מתרחש, מה קורה בו ומה הבגדים שלי.\n- האורך (בדרך כלל 5 שניות) והיחס, 9:16 או 16:9.\n- אם מי שבסרטון גבר או אישה, כדי שהפרומפטים באנגלית ייכתבו נכון.\n<\/קלט>\n\n<כיוון>\nהקליפ נראה כמו צילום טלפון אמיתי עם אור טבעי וצבעים אמיתיים, ואין בו מראה קולנועי.\nהפנים שלי נשארות הפנים שלי מהפריים הראשון ועד האחרון.\nחיוך רגוע במקום צחוק גדול.\nבלי טקסט, בלי כתוביות, בלי מוזיקה ובלי קול בתוך הקליפ.\n<\/כיוון>\n\n<בנייה>\n1. תבדוק ש-fal מחובר אליך, ואם לא, תריץ בעצמך `claude mcp add --transport http --scope user fal https://mcp.fal.ai/mcp-relay`, ואז תגיד לי לכתוב `/mcp`, לבחור fal ולהתחבר עם החשבון שלי, ושהתשלום יורד מארנק שטוענים מראש ב-fal. אם fal לא מופיע שם, תגיד לי לסגור ולפתוח את קלוד קוד.\n2. תוציא מהסרטון 4 פריימים חדים, אחד מקדימה ושלושה מזוויות קצת שונות (אחד מהם עם חיוך), ותראה לי אותם לאישור.\n3. את 4 הפריימים תעלה ל-fal עם `upload_file`, כי המודלים מקבלים רק כתובות.\n4. תמצא ב-fal מודל שמייצר וידאו מתמונה ומקבל גם פריים פתיחה וגם פנים אמיתיות כרפרנס, כי חלק מהמודלים חוסמים פנים אמיתיות.\n5. תבדוק ב-fal את המחיר של מודל הווידאו ושל מודל התמונה, ותראה לי כמה תעלה הרצה לפני שאתה מריץ (קליפ של 5 שניות עם רפרנס לפנים יוצא בערך דולר, כולל פריימי הפתיחה).\n6. פריים הפתיחה נוצר במודל לעריכת תמונה ב-fal, מהפריים שלי מקדימה, עם הסצנה החדשה, עם `aspect_ratio` של היחס שבחרתי (היחס של הקליפ נקבע לפי פריים הפתיחה), ועם המשפט `Keep his exact face and copy his real proportions, do not exaggerate any feature`.\n7. בסוף הפרומפט של התמונה `Vertical 9:16 photo shot on an iPhone main camera, natural daylight, realistic colours, no colour grade, visible skin texture, no retouching, no text, no logos, no watermark`, וב-16:9 תכתוב `Horizontal 16:9 photo` במקום `Vertical 9:16 photo`.\n8. תייצר שתי גרסאות של פריים הפתיחה ותיתן לי לבחור.\n9. את הסרטון תייצר מפריים הפתיחה, עם 4 הפריימים האמיתיים כרפרנס לפנים (הפריים מקדימה ראשון), ובלי קול: אם יש הגדרה כמו `generate_audio`, תכבה אותה, כי אצל חלק מהמודלים היא דלוקה כברירת מחדל.\n10. אם המודל קורא לרפרנס בשם, כמו `@Element1`, תוסיף לפרומפט `His face stays exactly the face of @Element1 the whole time.`\n11. בפעולה עצמה תכתוב `smiling warmly` ולא `laughing`, ותסיים את הפרומפט ב-`Handheld iPhone footage, realistic, natural light, no cinematic grading. No subtitles. No text. No music.`\n12. אם המודל מקבל רשימת דברים שאסור שיופיעו, תכתוב בה `face morphing, different person, deformed hands, extra fingers, cinematic colour grading, subtitles, watermark`.\n13. אחרי הג'נרוט תוציא 6 פריימים לאורך הקליפ ותשווה את הפנים לרפרנסים, ואם הפנים זזות בסוף, תציע לחתוך לפני הרגע הזה.\n14. בסוף תגדיל ל-1080 על 1920 (או 1920 על 1080) עם `scale=<רוחב>:<גובה>:force_original_aspect_ratio=increase:flags=lanczos,crop=<רוחב>:<גובה>`, תקודד ב-h264 עם crf 16 ותמסור בלי קול.\n<\/בנייה>\n\n<מלכודות>\nרשימה של תווי פנים בפרומפט, כמו \"פנים ארוכות\" או \"מצח גבוה\", יוצאת מוגזמת בתוצאה.\nמה שאסור שיופיע נכתב במפורש בפרומפט, למשל `no phone in his hands`, אחרת המודל מוסיף אותו מעצמו.\nהרצה אחת בכל פעם, כי כל הרצה יורדת מהארנק.\n<\/מלכודות>\n\n<התחלה>\nתשאל אותי על הקלט, תבדוק שהחיבור ל-fal עובד, ותראה לי את 4 הפריימים, את המודל שבחרת, את המחיר ואת הפרומפטים לפני שאתה מייצר משהו.\n<\/התחלה>", "note": "", "html": "<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"קלט\">&lt;קלט&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">תשאל אותי על ארבעה דברים:<\/div>\n<div class=\"pl\" dir=\"rtl\">- הסרטון שממנו לוקחים את הפנים שלי, או תמונות חדות שלי מקדימה ומהצד.<\/div>\n<div class=\"pl\" dir=\"rtl\">- הסצנה, כלומר איפה הקליפ מתרחש, מה קורה בו ומה הבגדים שלי.<\/div>\n<div class=\"pl\" dir=\"rtl\">- האורך (בדרך כלל 5 שניות) והיחס, 9:16 או 16:9.<\/div>\n<div class=\"pl\" dir=\"rtl\">- אם מי שבסרטון גבר או אישה, כדי שהפרומפטים באנגלית ייכתבו נכון.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/קלט&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"כיוון\">&lt;כיוון&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">הקליפ נראה כמו צילום טלפון אמיתי עם אור טבעי וצבעים אמיתיים, ואין בו מראה קולנועי.<\/div>\n<div class=\"pl\" dir=\"rtl\">הפנים שלי נשארות הפנים שלי מהפריים הראשון ועד האחרון.<\/div>\n<div class=\"pl\" dir=\"rtl\">חיוך רגוע במקום צחוק גדול.<\/div>\n<div class=\"pl\" dir=\"rtl\">בלי טקסט, בלי כתוביות, בלי מוזיקה ובלי קול בתוך הקליפ.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/כיוון&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"בנייה\">&lt;בנייה&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">1. תבדוק <span class=\"nb\">ש-fal<\/span> מחובר אליך, ואם לא, תריץ בעצמך <span class=\"codeblock\" dir=\"rtl\"><span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">claude<\/span> <span class=\"tk\">mcp<\/span> <span class=\"tk\">add<\/span> <span class=\"tk\">--transport http<\/span> <span class=\"tk\">--scope user<\/span> <span class=\"tk\">fal<\/span> <span class=\"tk\">https://mcp.fal.ai/mcp-relay<\/span><span class=\"bt\">`<\/span><\/span>,<\/span>ואז תגיד לי לכתוב <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">/mcp<\/span><span class=\"bt\">`<\/span><\/span>, לבחור fal ולהתחבר עם החשבון שלי, ושהתשלום יורד מארנק שטוענים מראש <span class=\"nb\">ב-fal.<\/span> אם fal לא מופיע שם, תגיד לי לסגור ולפתוח את קלוד קוד.<\/div>\n<div class=\"pl\" dir=\"rtl\">2. תוציא מהסרטון 4 פריימים חדים, אחד מקדימה ושלושה מזוויות קצת שונות (אחד מהם עם חיוך), ותראה לי אותם לאישור.<\/div>\n<div class=\"pl\" dir=\"rtl\">3. את 4 הפריימים תעלה <span class=\"nb\">ל-fal<\/span> עם <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">upload_file<\/span><span class=\"bt\">`<\/span><\/span>, כי המודלים מקבלים רק כתובות.<\/div>\n<div class=\"pl\" dir=\"rtl\">4. תמצא <span class=\"nb\">ב-fal<\/span> מודל שמייצר וידאו מתמונה ומקבל גם פריים פתיחה וגם פנים אמיתיות כרפרנס, כי חלק מהמודלים חוסמים פנים אמיתיות.<\/div>\n<div class=\"pl\" dir=\"rtl\">5. תבדוק <span class=\"nb\">ב-fal<\/span> את המחיר של מודל הווידאו ושל מודל התמונה, ותראה לי כמה תעלה הרצה לפני שאתה מריץ (קליפ של 5 שניות עם רפרנס לפנים יוצא בערך דולר, כולל פריימי הפתיחה).<\/div>\n<div class=\"pl\" dir=\"rtl\">6. פריים הפתיחה נוצר במודל לעריכת תמונה <span class=\"nb\">ב-fal,<\/span> מהפריים שלי מקדימה, עם הסצנה החדשה, עם <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">aspect_ratio<\/span><span class=\"bt\">`<\/span><\/span> של היחס שבחרתי (היחס של הקליפ נקבע לפי פריים הפתיחה), ועם המשפט <span class=\"codeblock\" dir=\"rtl\"><span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">Keep<\/span> <span class=\"tk\">his<\/span> <span class=\"tk\">exact<\/span> <span class=\"tk\">face<\/span> <span class=\"tk\">and<\/span> <span class=\"tk\">copy<\/span> <span class=\"tk\">his<\/span> <span class=\"tk\">real<\/span> <span class=\"tk\">proportions,<\/span> <span class=\"tk\">do<\/span> <span class=\"tk\">not<\/span> <span class=\"tk\">exaggerate<\/span> <span class=\"tk\">any<\/span> <span class=\"tk\">feature<\/span><span class=\"bt\">`<\/span><\/span>.<\/span><\/div>\n<div class=\"pl\" dir=\"rtl\">7. בסוף הפרומפט של התמונה <span class=\"codeblock\" dir=\"rtl\"><span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">Vertical<\/span> <span class=\"tk\">9:16<\/span> <span class=\"tk\">photo<\/span> <span class=\"tk\">shot<\/span> <span class=\"tk\">on<\/span> <span class=\"tk\">an<\/span> <span class=\"tk\">iPhone<\/span> <span class=\"tk\">main<\/span> <span class=\"tk\">camera,<\/span> <span class=\"tk\">natural<\/span> <span class=\"tk\">daylight,<\/span> <span class=\"tk\">realistic<\/span> <span class=\"tk\">colours,<\/span> <span class=\"tk\">no<\/span> <span class=\"tk\">colour<\/span> <span class=\"tk\">grade,<\/span> <span class=\"tk\">visible<\/span> <span class=\"tk\">skin<\/span> <span class=\"tk\">texture,<\/span> <span class=\"tk\">no<\/span> <span class=\"tk\">retouching,<\/span> <span class=\"tk\">no<\/span> <span class=\"tk\">text,<\/span> <span class=\"tk\">no<\/span> <span class=\"tk\">logos,<\/span> <span class=\"tk\">no<\/span> <span class=\"tk\">watermark<\/span><span class=\"bt\">`<\/span><\/span>,<\/span><span class=\"nb\">וב-16:9<\/span> תכתוב <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">Horizontal<\/span> <span class=\"tk\">16:9<\/span> <span class=\"tk\">photo<\/span><span class=\"bt\">`<\/span><\/span> במקום <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">Vertical<\/span> <span class=\"tk\">9:16<\/span> <span class=\"tk\">photo<\/span><span class=\"bt\">`<\/span><\/span>.<\/div>\n<div class=\"pl\" dir=\"rtl\">8. תייצר שתי גרסאות של פריים הפתיחה ותיתן לי לבחור.<\/div>\n<div class=\"pl\" dir=\"rtl\">9. את הסרטון תייצר מפריים הפתיחה, עם 4 הפריימים האמיתיים כרפרנס לפנים (הפריים מקדימה ראשון), ובלי קול: אם יש הגדרה כמו <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">generate_audio<\/span><span class=\"bt\">`<\/span><\/span>, תכבה אותה, כי אצל חלק מהמודלים היא דלוקה כברירת מחדל.<\/div>\n<div class=\"pl\" dir=\"rtl\">10. אם המודל קורא לרפרנס בשם, כמו <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">@Element1<\/span><span class=\"bt\">`<\/span><\/span>, תוסיף לפרומפט <span class=\"codeblock\" dir=\"rtl\"><span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">His<\/span> <span class=\"tk\">face<\/span> <span class=\"tk\">stays<\/span> <span class=\"tk\">exactly<\/span> <span class=\"tk\">the<\/span> <span class=\"tk\">face<\/span> <span class=\"tk\">of<\/span> <span class=\"tk\">@Element1<\/span> <span class=\"tk\">the<\/span> <span class=\"tk\">whole<\/span> <span class=\"tk\">time.<\/span><span class=\"bt\">`<\/span><\/span><\/span><\/div>\n<div class=\"pl\" dir=\"rtl\">11. בפעולה עצמה תכתוב <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">smiling<\/span> <span class=\"tk\">warmly<\/span><span class=\"bt\">`<\/span><\/span> ולא <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">laughing<\/span><span class=\"bt\">`<\/span><\/span>, ותסיים את הפרומפט <span class=\"codeblock\" dir=\"rtl\">ב-<span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">Handheld<\/span> <span class=\"tk\">iPhone<\/span> <span class=\"tk\">footage,<\/span> <span class=\"tk\">realistic,<\/span> <span class=\"tk\">natural<\/span> <span class=\"tk\">light,<\/span> <span class=\"tk\">no<\/span> <span class=\"tk\">cinematic<\/span> <span class=\"tk\">grading.<\/span> <span class=\"tk\">No<\/span> <span class=\"tk\">subtitles.<\/span> <span class=\"tk\">No<\/span> <span class=\"tk\">text.<\/span> <span class=\"tk\">No<\/span> <span class=\"tk\">music.<\/span><span class=\"bt\">`<\/span><\/span><\/span><\/div>\n<div class=\"pl\" dir=\"rtl\">12. אם המודל מקבל רשימת דברים שאסור שיופיעו, תכתוב בה <span class=\"codeblock\" dir=\"rtl\"><span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">face<\/span> <span class=\"tk\">morphing,<\/span> <span class=\"tk\">different<\/span> <span class=\"tk\">person,<\/span> <span class=\"tk\">deformed<\/span> <span class=\"tk\">hands,<\/span> <span class=\"tk\">extra<\/span> <span class=\"tk\">fingers,<\/span> <span class=\"tk\">cinematic<\/span> <span class=\"tk\">colour<\/span> <span class=\"tk\">grading,<\/span> <span class=\"tk\">subtitles,<\/span> <span class=\"tk\">watermark<\/span><span class=\"bt\">`<\/span><\/span>.<\/span><\/div>\n<div class=\"pl\" dir=\"rtl\">13. אחרי הג&#x27;נרוט תוציא 6 פריימים לאורך הקליפ ותשווה את הפנים לרפרנסים, ואם הפנים זזות בסוף, תציע לחתוך לפני הרגע הזה.<\/div>\n<div class=\"pl\" dir=\"rtl\">14. בסוף תגדיל <span class=\"nb\">ל-1080<\/span> על 1920 (או 1920 על 1080) עם <span class=\"codeblock\" dir=\"rtl\"><span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">scale=<bdi dir=\"ltr\">&lt;רוחב&gt;<\/bdi>:<\/span><wbr><span class=\"tk\"><bdi dir=\"ltr\">&lt;גובה&gt;<\/bdi>:<\/span><wbr><span class=\"tk\">force_original_aspect_ratio=increase:<\/span><wbr><span class=\"tk\">flags=lanczos,<\/span><wbr><span class=\"tk\">crop=<bdi dir=\"ltr\">&lt;רוחב&gt;<\/bdi>:<\/span><wbr><span class=\"tk\"><bdi dir=\"ltr\">&lt;גובה&gt;<\/bdi><\/span><span class=\"bt\">`<\/span><\/span>,<\/span>תקודד <span class=\"nb\">ב-h264<\/span> עם crf 16 ותמסור בלי קול.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/בנייה&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"מלכודות\">&lt;מלכודות&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">רשימה של תווי פנים בפרומפט, כמו &quot;פנים ארוכות&quot; או &quot;מצח גבוה&quot;, יוצאת מוגזמת בתוצאה.<\/div>\n<div class=\"pl\" dir=\"rtl\">מה שאסור שיופיע נכתב במפורש בפרומפט, למשל <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">no<\/span> <span class=\"tk\">phone<\/span> <span class=\"tk\">in<\/span> <span class=\"tk\">his<\/span> <span class=\"tk\">hands<\/span><span class=\"bt\">`<\/span><\/span>, אחרת המודל מוסיף אותו מעצמו.<\/div>\n<div class=\"pl\" dir=\"rtl\">הרצה אחת בכל פעם, כי כל הרצה יורדת מהארנק.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/מלכודות&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"התחלה\">&lt;התחלה&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">תשאל אותי על הקלט, תבדוק שהחיבור <span class=\"nb\">ל-fal<\/span> עובד, ותראה לי את 4 הפריימים, את המודל שבחרת, את המחיר ואת הפרומפטים לפני שאתה מייצר משהו.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/התחלה&gt;<\/div>"}, "links": [{"label": "כתובת השרת של fal לקלוד", "url": "https://mcp.fal.ai/mcp-relay"}]}, {"id": "t43", "num": "4.3", "title": "איפה לשים בירולים, ומה להראות בכל אחד", "t": 610.57, "see": "ציר זמן של סרטון דיבור, ובלוקים של בירולים נכנסים אליו. בטבלה, כל שורה עם המקור שלה: &quot;הקלטת מסך שתצלמו&quot; · &quot;אנימציה שקלוד יבנה&quot; · &quot;קליפ AI&quot; · &quot;קובץ שכבר בתיקייה&quot;. שורה אחת מסומנת באדום, &quot;חסר&quot;: חור בכיסוי. מסביב תגיות כללים: &quot;זום על הפנים לא נחשב בירול&quot; · &quot;אותו קליפ לא מופיע פעמיים&quot; · &quot;כניסה עד שנייה וחצי לפני המילה&quot;.", "exp": "על בסיס התמלול קלוד מחזיר טבלה: הזמן, המשפט, מה רואים בבירול ומאיפה הוא מגיע. הכלל: אף פעם לא יותר <span class=\"nb\">מ-3<\/span> שניות של דיבור בלי בירול, וכל קליפ מראה בדיוק את מה שנאמר באותו משפט.", "fact": "מקסימום 3 שניות", "tip": "נפסלו בירולים שהתאימו רק בערך למשפט, וגם קליפ שחזר פעמיים, אפילו כשכל הסרטון היה מכוסה.", "prompt": {"n": 16, "text": "לפני שאתה מתמלל, תשאל אותי איזה סרטון, ובאיזו תיקייה נמצאים הקבצים שכבר יש לי.\nתתמלל את הסרטון עם זמן לכל מילה, בעזרת `npx hyperframes transcribe <הקובץ> --language he --model large-v3`, ותציע לי רשימת בירולים כטבלה.\nבכל שורה יהיו זמן ההתחלה והסוף, המשפט, המילה המרכזית והזמן שלה (לפיה נקבעת הכניסה), מה רואים בבירול, ומאיפה הוא מגיע (הקלטת מסך שאצלם, אנימציה שתבנה, קליפ AI, או קובץ שכבר יש בתיקייה).\nאף פעם לא יותר מ-3 שניות ברצף של דיבור שלי למצלמה בלי בירול, וזום על הפנים לא נחשב בירול.\nכל בירול מראה בדיוק את מה שנאמר באותו משפט, ואם אין משהו שמתאים באמת, תכתוב \"חסר\" במקום למלא בקליפ דומה.\nשורה של \"חסר\" נספרת כחור בכיסוי, ותסמן אותה כך שאראה איפה חסר לי חומר.\nאותו קליפ לא מופיע פעמיים, גם כקטע אחר מאותו קובץ.\nהבירול נכנס בתוך המשפט שמזכיר אותו, בערך באמצע הדרך בין תחילת המשפט למילה המרכזית, ואף פעם לא יותר משנייה וחצי לפני המילה.\nהקלטות מסך של החשבונות שלי אצלם בעצמי, ובשבילן תכתוב לי מה לצלם, כמה זמן ובאיזה רגע בסרטון, בלי לבנות צילום מסך מזויף.\nתראה לי את הטבלה ותחכה לאישור לפני שאתה בונה או מייצר משהו.", "note": "", "html": "<div class=\"pl\" dir=\"rtl\">לפני שאתה מתמלל, תשאל אותי איזה סרטון, ובאיזו תיקייה נמצאים הקבצים שכבר יש לי.<\/div>\n<div class=\"pl\" dir=\"rtl\">תתמלל את הסרטון עם זמן לכל מילה, בעזרת <span class=\"codeblock\" dir=\"rtl\"><span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">npx<\/span> <span class=\"tk\">hyperframes<\/span> <span class=\"tk\">transcribe<\/span> <span class=\"tk\"><bdi dir=\"ltr\">&lt;הקובץ&gt;<\/bdi><\/span> <span class=\"tk\">--language he<\/span> <span class=\"tk\">--model large-v3<\/span><span class=\"bt\">`<\/span><\/span>,<\/span>ותציע לי רשימת בירולים כטבלה.<\/div>\n<div class=\"pl\" dir=\"rtl\">בכל שורה יהיו זמן ההתחלה והסוף, המשפט, המילה המרכזית והזמן שלה (לפיה נקבעת הכניסה), מה רואים בבירול, ומאיפה הוא מגיע (הקלטת מסך שאצלם, אנימציה שתבנה, קליפ AI, או קובץ שכבר יש בתיקייה).<\/div>\n<div class=\"pl\" dir=\"rtl\">אף פעם לא יותר <span class=\"nb\">מ-3<\/span> שניות ברצף של דיבור שלי למצלמה בלי בירול, וזום על הפנים לא נחשב בירול.<\/div>\n<div class=\"pl\" dir=\"rtl\">כל בירול מראה בדיוק את מה שנאמר באותו משפט, ואם אין משהו שמתאים באמת, תכתוב &quot;חסר&quot; במקום למלא בקליפ דומה.<\/div>\n<div class=\"pl\" dir=\"rtl\">שורה של &quot;חסר&quot; נספרת כחור בכיסוי, ותסמן אותה כך שאראה איפה חסר לי חומר.<\/div>\n<div class=\"pl\" dir=\"rtl\">אותו קליפ לא מופיע פעמיים, גם כקטע אחר מאותו קובץ.<\/div>\n<div class=\"pl\" dir=\"rtl\">הבירול נכנס בתוך המשפט שמזכיר אותו, בערך באמצע הדרך בין תחילת המשפט למילה המרכזית, ואף פעם לא יותר משנייה וחצי לפני המילה.<\/div>\n<div class=\"pl\" dir=\"rtl\">הקלטות מסך של החשבונות שלי אצלם בעצמי, ובשבילן תכתוב לי מה לצלם, כמה זמן ובאיזה רגע בסרטון, בלי לבנות צילום מסך מזויף.<\/div>\n<div class=\"pl\" dir=\"rtl\">תראה לי את הטבלה ותחכה לאישור לפני שאתה בונה או מייצר משהו.<\/div>"}, "links": []}]}, {"n": 5, "title": "חיבורים: Higgsfield ו-fal", "t": 641.55, "sub": "מחברים לקלוד כלי כמו Higgsfield או fal, והוא מייצר בו תמונות וסרטונים מתוך השיחה ומוריד אותם לתיקייה שלכם. connector נותן לקלוד גישה לחשבון שלכם באותו אתר.", "items": [{"id": "t51", "num": "5.1", "title": "מחברים את Higgsfield", "t": 647.98, "see": "חמישה צעדים ממוספרים בפאנלים מאוירים (לא העתק של הממשק האמיתי): 1. <span class=\"nb\">ב-claude.ai<\/span> או באפליקציה: Customize, ואז Connectors · 2. לוחצים על הפלוס ובוחרים Add custom connector · 3. שם: Higgsfield · כתובת: https://mcp.higgsfield.ai/mcp · 4. Add, ואז Connect, ומתחברים לחשבון Higgsfield · 5. בלי מפתח API. מופיע לבד גם <span class=\"nb\">ב-Claude<\/span> Code, ובודקים עם /mcp.", "exp": "יש בו יותר <span class=\"nb\">מ-30<\/span> מודלים ליצירת תמונות וסרטונים. קלוד בוחר את המודל שמתאים לבקשה, ובודק כמה קרדיטים הוא יעלה.", "fact": "35 קרדיטים · קליפ של 5 שניות במודל Seedance 2.5, באיכות 720p, לאורך ובלי קול. · החיבור דורש מנוי בתשלום <span class=\"nb\">ב-Higgsfield,<\/span> וכל ג&#x27;נרוט יורד מהקרדיטים.", "tip": "אין צורך במפתח API: אחרי החיבור <span class=\"nb\">ב-claude.ai<\/span> הוא מופיע לבד גם <span class=\"nb\">ב-Claude<\/span> Code, ובודקים עם /mcp.", "prompt": {"n": 17, "text": "<קלט>\nתשאל אותי מה הקליפ או התמונה צריכים להראות, באיזה משפט בסרטון הם נכנסים, באיזה יחס (9:16 או 16:9) וכמה שניות.\nאם הקליפ צריך להראות אותי, תבקש ממני תמונה חדה של הפנים שלי מקדימה ותעלה אותה ל-Higgsfield.\n<\/קלט>\n\nתבדוק ש-Higgsfield מחובר אליך, ואם לא, תסביר לי שב-claude.ai נכנסים ל-Customize ומשם ל-Connectors, לוחצים \"+\", בוחרים Add custom connector עם הכתובת `https://mcp.higgsfield.ai/mcp` ומתחברים לחשבון Higgsfield, ואז הוא מופיע לבד גם ב-Claude Code,
