תחת `/mcp`.\nהחיבור דורש מנוי בתשלום ב-Higgsfield, וכל ג'נרוט יורד מהקרדיטים.\nתבדוק את יתרת הקרדיטים שלי, ותמליץ על מודל שמתאים לבקשה.\nלפני כל ג'נרוט תבדוק את המחיר עם `get_cost: true`, שלא מריץ שום דבר, ותראה לי את הפרומפט, את המודל, את ההגדרות ואת המחיר בקרדיטים, ותחכה לאישור.\nאם אין מספיק קרדיטים, תעצור ותגיד לי כמה חסר, בלי לנסות מודל אחר.\nאם הקליפ מראה אותי, תבחר מודל שמקבל תמונת פנים כרפרנס, ותגיד לי מראש שאין הבטחה שהוא יקבל פנים אמיתיות.\nהפרומפט באנגלית, נראה כמו צילום טלפון אמיתי באור טבעי, ונגמר ב-`No subtitles. No text. No music.`\nבלי קול בקליפ, כי יש לי קריינות, וברירת המחדל מייצרת קול, אז תשלח `generate_audio: false`.\nתייצר קליפ אחד בכל פעם, ולא כמה גרסאות במכה.\nכשהקליפ מוכן, תוריד אותו לתיקייה, תוציא ממנו 4 פריימים ותבדוק פנים, ידיים וטקסט שהופיע בטעות לפני שאתה מראה לי.", "note": "", "html": "<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"קלט\">&lt;קלט&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">תשאל אותי מה הקליפ או התמונה צריכים להראות, באיזה משפט בסרטון הם נכנסים, באיזה יחס (9:16 או 16:9) וכמה שניות.<\/div>\n<div class=\"pl\" dir=\"rtl\">אם הקליפ צריך להראות אותי, תבקש ממני תמונה חדה של הפנים שלי מקדימה ותעלה אותה <span class=\"nb\">ל-Higgsfield.<\/span><\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/קלט&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl\" dir=\"rtl\">תבדוק <span class=\"nb\">ש-Higgsfield<\/span> מחובר אליך, ואם לא, תסביר לי <span class=\"nb\">שב-claude.ai<\/span> נכנסים <span class=\"nb\">ל-Customize<\/span> ומשם <span class=\"nb\">ל-Connectors,<\/span> לוחצים &quot;+&quot;, בוחרים Add custom connector עם הכתובת <span class=\"codeblock\" dir=\"rtl\"><span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">https://mcp.higgsfield.ai/mcp<\/span><span class=\"bt\">`<\/span><\/span><\/span>ומתחברים לחשבון Higgsfield, ואז הוא מופיע לבד גם <span class=\"nb\">ב-Claude<\/span> Code, תחת <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">/mcp<\/span><span class=\"bt\">`<\/span><\/span>.<\/div>\n<div class=\"pl\" dir=\"rtl\">החיבור דורש מנוי בתשלום <span class=\"nb\">ב-Higgsfield,<\/span> וכל ג&#x27;נרוט יורד מהקרדיטים.<\/div>\n<div class=\"pl\" dir=\"rtl\">תבדוק את יתרת הקרדיטים שלי, ותמליץ על מודל שמתאים לבקשה.<\/div>\n<div class=\"pl\" dir=\"rtl\">לפני כל ג&#x27;נרוט תבדוק את המחיר עם <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">get_cost:<\/span> <span class=\"tk\">true<\/span><span class=\"bt\">`<\/span><\/span>, שלא מריץ שום דבר, ותראה לי את הפרומפט, את המודל, את ההגדרות ואת המחיר בקרדיטים, ותחכה לאישור.<\/div>\n<div class=\"pl\" dir=\"rtl\">אם אין מספיק קרדיטים, תעצור ותגיד לי כמה חסר, בלי לנסות מודל אחר.<\/div>\n<div class=\"pl\" dir=\"rtl\">אם הקליפ מראה אותי, תבחר מודל שמקבל תמונת פנים כרפרנס, ותגיד לי מראש שאין הבטחה שהוא יקבל פנים אמיתיות.<\/div>\n<div class=\"pl\" dir=\"rtl\">הפרומפט באנגלית, נראה כמו צילום טלפון אמיתי באור טבעי, ונגמר <span class=\"codeblock\" dir=\"rtl\">ב-<span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">No<\/span> <span class=\"tk\">subtitles.<\/span> <span class=\"tk\">No<\/span> <span class=\"tk\">text.<\/span> <span class=\"tk\">No<\/span> <span class=\"tk\">music.<\/span><span class=\"bt\">`<\/span><\/span><\/span><\/div>\n<div class=\"pl\" dir=\"rtl\">בלי קול בקליפ, כי יש לי קריינות, וברירת המחדל מייצרת קול, אז תשלח <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">generate_audio:<\/span> <span class=\"tk\">false<\/span><span class=\"bt\">`<\/span><\/span>.<\/div>\n<div class=\"pl\" dir=\"rtl\">תייצר קליפ אחד בכל פעם, ולא כמה גרסאות במכה.<\/div>\n<div class=\"pl\" dir=\"rtl\">כשהקליפ מוכן, תוריד אותו לתיקייה, תוציא ממנו 4 פריימים ותבדוק פנים, ידיים וטקסט שהופיע בטעות לפני שאתה מראה לי.<\/div>"}, "links": [{"label": "כתובת ה-connector של Higgsfield", "url": "https://mcp.higgsfield.ai/mcp"}, {"label": "ההסבר של Higgsfield על החיבור לקלוד", "url": "https://higgsfield.ai/blog/claude-higgsfield-mcp-creative-studio"}]}, {"id": "t52", "num": "5.2", "title": "מחברים את fal.ai: ארנק מראש, ומשלמים רק על מה שיצא", "t": 679.99, "see": "ארנק שנטען מראש. תוצאה מוצלחת יורדת מהיתרה, בעוד ששגיאת שרת והמתנה בתור מסומנות &quot;לא משלמים&quot;, ולידן לוח שנה עם &quot;תקף לשנה&quot;. אחר כך צעדי החיבור: מבקשים מקלוד <span class=\"nb\">ב-Claude<\/span> Code להוסיף את השרת https://mcp.fal.ai/mcp-relay, כותבים /mcp ומתחברים בלי מפתח API. אם fal לא מופיע, סוגרים ופותחים את Claude Code באותה תיקייה. <span class=\"nb\">ב-claude.ai<\/span> מוסיפים אותו <span class=\"nb\">כ-connector,<\/span> בדיוק כמו Higgsfield.", "exp": "<span class=\"nb\">ב-fal<\/span> אין מנוי חובה. קונים קרדיטים מראש בדשבורד החיובים, וכל תוצאה שיצאה בהצלחה יורדת מהיתרה. על שגיאה של השרת או על המתנה בתור לא משלמים, והקרדיטים תקפים לשנה.", "fact": "בערך דולר לקליפ · מחירים מהמדריך: קליפ AI של 5 שניות עם הפנים, בערך דולר. מילוי החדר שמאחוריכם, 15 סנט לתמונה.", "tip": "חלק מהמודלים חוסמים פנים אמיתיות, ולכן קלוד בוחר <span class=\"nb\">ב-fal<\/span> מודל שמקבל אותן.", "prompt": {"n": 15, "text": "1. תבדוק ש-fal מחובר אליך, ואם לא, תריץ בעצמך `claude mcp add --transport http --scope user fal https://mcp.fal.ai/mcp-relay`, ואז תגיד לי לכתוב `/mcp`, לבחור fal ולהתחבר עם החשבון שלי, ושהתשלום יורד מארנק שטוענים מראש ב-fal. אם fal לא מופיע שם, תגיד לי לסגור ולפתוח את קלוד קוד.", "note": "אין לנושא הזה פרומפט נפרד. זה שלב החיבור ל-fal מתוך פרומפט 15.", "html": "<div class=\"pl\" dir=\"rtl\">1. תבדוק <span class=\"nb\">ש-fal<\/span> מחובר אליך, ואם לא, תריץ בעצמך <span class=\"codeblock\" dir=\"rtl\"><span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">claude<\/span> <span class=\"tk\">mcp<\/span> <span class=\"tk\">add<\/span> <span class=\"tk\">--transport http<\/span> <span class=\"tk\">--scope user<\/span> <span class=\"tk\">fal<\/span> <span class=\"tk\">https://mcp.fal.ai/mcp-relay<\/span><span class=\"bt\">`<\/span><\/span>,<\/span>ואז תגיד לי לכתוב <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">/mcp<\/span><span class=\"bt\">`<\/span><\/span>, לבחור fal ולהתחבר עם החשבון שלי, ושהתשלום יורד מארנק שטוענים מראש <span class=\"nb\">ב-fal.<\/span> אם fal לא מופיע שם, תגיד לי לסגור ולפתוח את קלוד קוד.<\/div>"}, "links": [{"label": "כתובת השרת של fal לקלוד", "url": "https://mcp.fal.ai/mcp-relay"}, {"label": "ההסבר של fal על החיבור לקלוד", "url": "https://fal.ai/docs/documentation/setting-up/mcp"}]}]}, {"n": 6, "title": "הקלטות מסך", "t": 714.51, "sub": "שם בדיוק מסתתרים הדברים שהכי מביך לפרסם בטעות, כמו מייל של לקוח או מספר טלפון.", "items": [{"id": "t61", "num": "6.1", "title": "מוצאים ומטשטשים מיילים ופרטים אישיים", "t": 719.91, "see": "תיבת דואר מאוירת עם מיילים פיקטיביים (כמו dana@example.com) וטלפון <span class=\"nb\">050-0000000<\/span>. קו סריקה עובר פעם בשנייה, והממצאים מקבלים מסגרת אדומה עם זמן. חלונית קופצת עם טלפון מופיעה לרגע ונתפסת. אחר כך הטשטוש נדלק רק בזמן של כל ממצא, והסריקה החוזרת מסתיימת <span class=\"nb\">ב-&quot;0<\/span> ממצאים ✓&quot;.", "exp": "קלוד קורא את הטקסט שעל המסך בכל שנייה של ההקלטה, מוצא מיילים, טלפונים וכל פרט שביקשתם להסתיר, ומטשטש אותו בדיוק בזמן שהוא על המסך. בסוף הוא סורק שוב, כדי לוודא שלא נשאר אף אחד.", "fact": "11 מתוך 11 · בהקלטה של 20 שניות: 10 מיילים וטלפון, כולל הודעה קופצת של 0.6 שנייה. בבדיקה של כל פריים נתפסו עוד 5 פריימים.", "tip": "זיהוי הטקסט של המק, בגרסה שנבדקה, לא קורא עברית. שם בעברית מסמנים לקלוד ידנית, ומבקשים טשטוש קבוע באזור הזה.", "prompt": {"n": 18, "text": "<קלט>\nתשאל אותי על שני דברים:\n- איזו הקלטה לבדוק, אם יש בתיקייה יותר מאחת.\n- מה להסתיר מעבר למיילים וטלפונים, למשל השם שלי, מספרי חשבון, או מחרוזת שמופיעה בנתיב של תיקייה.\nאם עניתי רק \"תמשיך\", תסתיר מיילים וטלפונים בלבד.\nזיהוי הטקסט של Mac לא קורא עברית, אז על כל דבר בעברית תגיד לי שהוא לא יימצא אוטומטית, ואסמן לך איפה הוא ומתי, או שתשתמש בזיהוי טקסט שקורא עברית.\n<\/קלט>\n\n<בנייה>\n1. תוציא פריים לכל שנייה עם `ffmpeg -i <ההקלטה> -vf fps=1:round=up frames/%05d.png`, ככה פריים מספר N הוא בדיוק שנייה N-1.\n2. תריץ על כל פריים זיהוי טקסט עם מיקום לכל מילה, בכמה תהליכים במקביל שכל אחד כותב לקובץ משלו, ובסוף תחבר אותם לטבלה אחת של מיקום וטקסט.\n3. ב-Mac זה Vision של macOS, בסקריפט Swift קטן שמקומפל עם `swiftc -O`, עם `usesLanguageCorrection` כבוי, ציר y הפוך (Vision סופר מלמטה), ומיקום לכל מילה מ-`boundingBox(for:)`.\n4. בווינדוס זה Tesseract (`winget install UB-Mannheim.TesseractOCR`, ואז `tesseract <תמונה> <פלט> tsv`, ולעברית חבילת השפה heb), דרך שלא נבדקה.\n5. תחפש בטבלה עם regex מיילים, מספרי טלפון ואת כל המחרוזות שנתתי לך, גם כשהן חלק מנתיב או מכתובת, וגם טלפון שנקרא הפוך, כמו 0000000-050, כי בשורה בעברית Vision הופך לפעמים את החלקים.\n6. סביב כל ממצא תסרוק שוב ב-5 פריימים לשנייה, משנייה לפניו ועד שנייה אחריו.\n7. תאחד רק ממצאים של אותו טקסט שזז פחות מגובה שורה בין שתי דגימות, וטקסט שגולל מקבל אזור קצר לכל דגימה.\n8. לכל אזור ריפוד של 8 פיקסלים, ו-0.6 שניות לפני ואחרי (או 1.3 שניות לממצא שנמצא רק בפריים לשנייה).\n9. כל אזור נשאר לפחות פיקסל אחד בתוך המסך מכל צד, אחרת delogo נכשל.\n10. מכל האזורים תבנה שרשרת אחת של פילטרי `delogo`, כל אחד עם `enable` שמדליק אותו רק בזמן שלו.\n11. תרנדר במעבר אחד עם `-c:v libx264 -preset veryfast -crf 23`, תעתיק את הקול כמו שהוא, ותשמור ליד המקור באותו שם עם `_redacted` בסוף.\n12. תריץ את זיהוי הטקסט מחדש על הקובץ החדש: פריים לשנייה על הכל, 5 פריימים לשנייה בחלונות, וכל פריים בשנייה שסביב תחילת וסוף כל אזור, כדי לתפוס טקסט שמחליק פנימה או החוצה בין הדגימות.\n13. אם משהו עדיין נקרא, תוסיף אזור ידני אחד: מלבן שמכסה את כל המקומות שבהם הטקסט הופיע בחלון, ודולק לאורך כל החלון.\n14. בסוף תבדוק שהקובץ תקין עם `ffmpeg -v error -i <הפלט> -f null -`, שצריך להחזיר אפס שורות.\n<\/בנייה>\n\n<מלכודות>\nאל תבנה שכבה נפרדת של חיתוך וטשטוש לכל אזור, כי זה רץ פי 60 לאט יותר מ-delogo.\nאל תשתמש ב-h264_videotoolbox, כי הוא הוציא קובץ עם שגיאות.\nזיהוי הטקסט טועה בתו @ ובאותיות דומות, אז תאסוף את הדומיינים מהמיילים שמצאת ותחפש כל אחד גם לבד וגם עם אות אחת שונה.\nכשהדומיין נמצא לבד, תטשטש את כל השורה שלו.\n<\/מלכודות>\n\n<התחלה>\nתשאל אותי על הקלט, ולפני הרינדור תראה לי תמונה אחת לכל אזור, עם מסגרת אדומה סביבו והזמן שבו הוא דולק.\nאחרי הרינדור תראה לי את התוצאה של הסריקה החוזרת.\n<\/התחלה>", "note": "", "html": "<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"קלט\">&lt;קלט&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">תשאל אותי על שני דברים:<\/div>\n<div class=\"pl\" dir=\"rtl\">- איזו הקלטה לבדוק, אם יש בתיקייה יותר מאחת.<\/div>\n<div class=\"pl\" dir=\"rtl\">- מה להסתיר מעבר למיילים וטלפונים, למשל השם שלי, מספרי חשבון, או מחרוזת שמופיעה בנתיב של תיקייה.<\/div>\n<div class=\"pl\" dir=\"rtl\">אם עניתי רק &quot;תמשיך&quot;, תסתיר מיילים וטלפונים בלבד.<\/div>\n<div class=\"pl\" dir=\"rtl\">זיהוי הטקסט של Mac לא קורא עברית, אז על כל דבר בעברית תגיד לי שהוא לא יימצא אוטומטית, ואסמן לך איפה הוא ומתי, או שתשתמש בזיהוי טקסט שקורא עברית.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/קלט&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"בנייה\">&lt;בנייה&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">1. תוציא פריים לכל שנייה עם <span class=\"codeblock\" dir=\"rtl\"><span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">ffmpeg<\/span> <span class=\"tk\">-i <bdi dir=\"ltr\">&lt;ההקלטה&gt;<\/bdi><\/span> <span class=\"tk\">-vf fps=1:round=up<\/span> <span class=\"tk\">frames/%05d.png<\/span><span class=\"bt\">`<\/span><\/span>,<\/span>ככה פריים מספר N הוא בדיוק שנייה N-1.<\/div>\n<div class=\"pl\" dir=\"rtl\">2. תריץ על כל פריים זיהוי טקסט עם מיקום לכל מילה, בכמה תהליכים במקביל שכל אחד כותב לקובץ משלו, ובסוף תחבר אותם לטבלה אחת של מיקום וטקסט.<\/div>\n<div class=\"pl\" dir=\"rtl\">3. <span class=\"nb\">ב-Mac<\/span> זה Vision של macOS, בסקריפט Swift קטן שמקומפל עם <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">swiftc<\/span> <span class=\"tk\">-O<\/span><span class=\"bt\">`<\/span><\/span>, עם <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">usesLanguageCorrection<\/span><span class=\"bt\">`<\/span><\/span> כבוי, ציר y הפוך (Vision סופר מלמטה), ומיקום לכל מילה מ-<span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">boundingBox(for:)<\/span><span class=\"bt\">`<\/span><\/span>.<\/div>\n<div class=\"pl\" dir=\"rtl\">4. בווינדוס זה Tesseract (<span class=\"codeblock\" dir=\"rtl\"><span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">winget<\/span> <span class=\"tk\">install<\/span> <span class=\"tk\">UB-Mannheim.TesseractOCR<\/span><span class=\"bt\">`<\/span><\/span>,<\/span>ואז <span class=\"codeblock\" dir=\"rtl\"><span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">tesseract<\/span> <span class=\"tk\"><bdi dir=\"ltr\">&lt;תמונה&gt;<\/bdi><\/span> <span class=\"tk\"><bdi dir=\"ltr\">&lt;פלט&gt;<\/bdi><\/span> <span class=\"tk\">tsv<\/span><span class=\"bt\">`<\/span><\/span>,<\/span>ולעברית חבילת השפה heb), דרך שלא נבדקה.<\/div>\n<div class=\"pl\" dir=\"rtl\">5. תחפש בטבלה עם regex מיילים, מספרי טלפון ואת כל המחרוזות שנתתי לך, גם כשהן חלק מנתיב או מכתובת, וגם טלפון שנקרא הפוך, כמו <span class=\"nb\">0000000-050<\/span>, כי בשורה בעברית Vision הופך לפעמים את החלקים.<\/div>\n<div class=\"pl\" dir=\"rtl\">6. סביב כל ממצא תסרוק שוב <span class=\"nb\">ב-5<\/span> פריימים לשנייה, משנייה לפניו ועד שנייה אחריו.<\/div>\n<div class=\"pl\" dir=\"rtl\">7. תאחד רק ממצאים של אותו טקסט שזז פחות מגובה שורה בין שתי דגימות, וטקסט שגולל מקבל אזור קצר לכל דגימה.<\/div>\n<div class=\"pl\" dir=\"rtl\">8. לכל אזור ריפוד של 8 פיקסלים, <span class=\"nb\">ו-0.6<\/span> שניות לפני ואחרי (או 1.3 שניות לממצא שנמצא רק בפריים לשנייה).<\/div>\n<div class=\"pl\" dir=\"rtl\">9. כל אזור נשאר לפחות פיקסל אחד בתוך המסך מכל צד, אחרת delogo נכשל.<\/div>\n<div class=\"pl\" dir=\"rtl\">10. מכל האזורים תבנה שרשרת אחת של פילטרי <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">delogo<\/span><span class=\"bt\">`<\/span><\/span>, כל אחד עם <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">enable<\/span><span class=\"bt\">`<\/span><\/span> שמדליק אותו רק בזמן שלו.<\/div>\n<div class=\"pl\" dir=\"rtl\">11. תרנדר במעבר אחד עם <span class=\"codeblock\" dir=\"rtl\"><span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">-c:v libx264<\/span> <span class=\"tk\">-preset veryfast<\/span> <span class=\"tk\">-crf 23<\/span><span class=\"bt\">`<\/span><\/span>,<\/span>תעתיק את הקול כמו שהוא, ותשמור ליד המקור באותו שם עם <span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">_redacted<\/span><span class=\"bt\">`<\/span><\/span> בסוף.<\/div>\n<div class=\"pl\" dir=\"rtl\">12. תריץ את זיהוי הטקסט מחדש על הקובץ החדש: פריים לשנייה על הכל, 5 פריימים לשנייה בחלונות, וכל פריים בשנייה שסביב תחילת וסוף כל אזור, כדי לתפוס טקסט שמחליק פנימה או החוצה בין הדגימות.<\/div>\n<div class=\"pl\" dir=\"rtl\">13. אם משהו עדיין נקרא, תוסיף אזור ידני אחד: מלבן שמכסה את כל המקומות שבהם הטקסט הופיע בחלון, ודולק לאורך כל החלון.<\/div>\n<div class=\"pl\" dir=\"rtl\">14. בסוף תבדוק שהקובץ תקין עם <span class=\"codeblock\" dir=\"rtl\"><span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">ffmpeg<\/span> <span class=\"tk\">-v error<\/span> <span class=\"tk\">-i <bdi dir=\"ltr\">&lt;הפלט&gt;<\/bdi><\/span> <span class=\"tk\">-f null<\/span> <span class=\"tk\">-<\/span><span class=\"bt\">`<\/span><\/span>,<\/span>שצריך להחזיר אפס שורות.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/בנייה&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"מלכודות\">&lt;מלכודות&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">אל תבנה שכבה נפרדת של חיתוך וטשטוש לכל אזור, כי זה רץ פי 60 לאט יותר <span class=\"nb\">מ-delogo.<\/span><\/div>\n<div class=\"pl\" dir=\"rtl\">אל תשתמש <span class=\"nb\">ב-h264_videotoolbox,<\/span> כי הוא הוציא קובץ עם שגיאות.<\/div>\n<div class=\"pl\" dir=\"rtl\">זיהוי הטקסט טועה בתו @ ובאותיות דומות, אז תאסוף את הדומיינים מהמיילים שמצאת ותחפש כל אחד גם לבד וגם עם אות אחת שונה.<\/div>\n<div class=\"pl\" dir=\"rtl\">כשהדומיין נמצא לבד, תטשטש את כל השורה שלו.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/מלכודות&gt;<\/div>\n<div class=\"pl pl-empty\"><\/div>\n<div class=\"pl ptag\" dir=\"rtl\" data-sec=\"התחלה\">&lt;התחלה&gt;<\/div>\n<div class=\"pl\" dir=\"rtl\">תשאל אותי על הקלט, ולפני הרינדור תראה לי תמונה אחת לכל אזור, עם מסגרת אדומה סביבו והזמן שבו הוא דולק.<\/div>\n<div class=\"pl\" dir=\"rtl\">אחרי הרינדור תראה לי את התוצאה של הסריקה החוזרת.<\/div>\n<div class=\"pl ptag pclose\" dir=\"rtl\">&lt;/התחלה&gt;<\/div>"}, "links": []}, {"id": "t62", "num": "6.2", "title": "הקלטתם עם Screen Studio? בלי זום נוסף", "t": 755.52, "see": "הקלטת מסך מאוירת עם זום אוטומטי, ועליה זום קפיצי נוסף. התמונה מיטלטלת, ומופיע X אדום. אחר כך אותה הקלטה רק עם הזום שלה, וסימון ✓. בסוף בועת צ&#x27;אט, &quot;מה להגיד לקלוד&quot;: &quot;ההקלטה <span class=\"nb\">מ-Screen<\/span> Studio, אז בלי זום קפיצי משלך.&quot; (במדריך אין לנושא הזה פרומפט מוכן, רק ההנחיה הזאת.)", "exp": "Screen Studio היא תוכנה למק שמקליטה את המסך ומוסיפה זומים אוטומטיים. ההקלטה כבר מלאה בזומים, אז אומרים לקלוד במפורש לא להוסיף זום קפיצי משלו: שני זומים אחד על השני מסחררים את מי שצופה.", "fact": "", "tip": "", "prompt": {"n": null, "text": "", "note": "אין לנושא הזה פרומפט נפרד: מספיק להגיד לקלוד שההקלטה מ-Screen Studio, ושלא יוסיף זום קפיצי משלו."}, "links": []}]}, {"n": 7, "title": "חוסכים שעות של רינדורים", "t": 773.18, "sub": "בריל של 47 שניות, רינדור באיכות מלאה לקח בערך רבע שעה, וטיוטה ברזולוציה נמוכה דקה וחצי. את שלושת הפרומפטים בפרק הזה מדביקים מתחת לפרומפט של העריכה, באותה הודעה.", "items": [{"id": "t71", "num": "7.1", "title": "מאשרים 15 שניות ברזולוציה נמוכה", "t": 780.44, "see": "שני פסי התקדמות במרוץ: &quot;רינדור מלא: כרבע שעה&quot; מול &quot;טיוטה: דקה וחצי&quot;. השוואת גדלים, 540×960 מול 1080×1920. לולאה של &quot;טיוטה, תיקון, טיוטה&quot;, ואחריה &quot;רינדור מלא אחד&quot;. תגית: &quot;פריים בודד בלי רינדור: npx hyperframes snapshot --at &lt;שנייה&gt;&quot;.", "exp": "לפני הרינדור המלא, קלוד מרנדר 15 שניות מהקטע הכי עמוס <span class=\"nb\">ב-540<\/span> על 960 ומחכה שתאשרו את הסגנון. כל סבב תיקונים נשאר ברזולוציה הנמוכה, ואת הגרסה המלאה מרנדרים רק כשאין יותר תיקונים.", "fact": "גם הסרטון הזה אושר קודם כטיוטה של 15 שניות <span class=\"nb\">ב-540<\/span> על 960.", "tip": "", "prompt": {"n": 19, "text": "לפני שאתה מרנדר את כל הסרטון, תרנדר 15 שניות מהקטע הכי עמוס, ב-540 על 960 (או 960 על 540) וב-30 פריימים לשנייה, עם הקול.\nאם לכלי אין דגל לטווח זמן ולהקטנה, כמו ב-`npx hyperframes render`, תעשה עותק זמני וקצר של הקומפוזיציה ברזולוציה הנמוכה שמכיל רק את הקטע הזה.\nתראה לי את הטיוטה ותחכה לאישור של הסגנון.\nאחרי שאישרתי, כל סבב תיקונים מרונדר באותה רזולוציה נמוכה.\nאת הרזולוציה המלאה תרנדר רק בסוף, כשאין יותר תיקונים.\nתיקון קטן נבדק על פריים בודד או על כמה שניות סביבו, בלי לרנדר את כל הסרטון מחדש, וב-HyperFrames פריים בודד יוצא בלי רינדור עם `npx hyperframes snapshot --at <שנייה>`.", "note": "", "html": "<div class=\"pl\" dir=\"rtl\">לפני שאתה מרנדר את כל הסרטון, תרנדר 15 שניות מהקטע הכי עמוס, <span class=\"nb\">ב-540<\/span> על 960 (או 960 על 540) <span class=\"nb\">וב-30<\/span> פריימים לשנייה, עם הקול.<\/div>\n<div class=\"pl\" dir=\"rtl\">אם לכלי אין דגל לטווח זמן ולהקטנה, כמו ב-<span class=\"code\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">npx<\/span> <span class=\"tk\">hyperframes<\/span> <span class=\"tk\">render<\/span><span class=\"bt\">`<\/span><\/span>, תעשה עותק זמני וקצר של הקומפוזיציה ברזולוציה הנמוכה שמכיל רק את הקטע הזה.<\/div>\n<div class=\"pl\" dir=\"rtl\">תראה לי את הטיוטה ותחכה לאישור של הסגנון.<\/div>\n<div class=\"pl\" dir=\"rtl\">אחרי שאישרתי, כל סבב תיקונים מרונדר באותה רזולוציה נמוכה.<\/div>\n<div class=\"pl\" dir=\"rtl\">את הרזולוציה המלאה תרנדר רק בסוף, כשאין יותר תיקונים.<\/div>\n<div class=\"pl\" dir=\"rtl\">תיקון קטן נבדק על פריים בודד או על כמה שניות סביבו, בלי לרנדר את כל הסרטון מחדש, <span class=\"nb\">וב-HyperFrames<\/span> פריים בודד יוצא בלי רינדור עם <span class=\"codeblock\" dir=\"rtl\"><span class=\"cbi\" dir=\"ltr\"><span class=\"bt\">`<\/span><span class=\"tk\">npx<\/span> <span class=\"tk\">hyperframes<\/span> <span class=\"tk\">snapshot<\/span> <span class=\"tk\">--at <bdi dir=\"ltr\">&lt;שנייה&gt;<\/bdi><\/span><span class=\"bt\">`<\/span><\/span>.<\/span><\/div>"}, "links": []}, {"id": "t72", "num": "7.2", "title": "בודקים פריימים, כי קלוד לא צופה בווידאו", "t": 807.8, "see": "רצועת פילם עם סימונים בכל כניסה של טקסט, אפקט וחיתוך. זום על מעבר אחד חושף רצועה של פריים כל 0.1 שנייה, ואחד מהם מסומן באדום: &quot;פריים בלי כתובית: הבדיקה האוטומטית פספסה, הפריים תפס.&quot;", "exp": "קלוד בודק תמונות ולא צופה בסרטון. לכן אחרי כל רינדור הוא מוציא פריים בכל רגע חשוב ומסתכל עליו, וסביב כל מעבר פריים כל עשירית שנייה, כדי לתפוס דברים שקופצים או קופאים.", "fact": "גם בסרטון הזה, הפריימים נבדקים אחרי כל רינדור.", "tip": "", "prompt": {"n": 20, "text": "אתה לא צופה בווידאו, אז כל בדיקה שלך נעשית על פריימים.\nאחרי כל רינדור תוציא פריים בכל רגע חשוב (כל כניסה של טקסט, כל אפקט וכל חיתוך), ותסתכל עליהם ברזולוציה מלאה.\nסביב כל מעבר תוציא גם רצועה של פריים כל 0.1 שנייה, כדי לתפוס דברים שקופצים או קופאים.\nבכל פריים תבדוק טקסט חתוך או בכיוון הלא נכון, משהו שמסתיר את הפנים, וחורים או קצוות בשכבות.\nבדיקה אוטומטית שעברה לא מוכיחה שמשהו באמת על המסך, ולכן תמיד מסתכלים על הפריים עצמו.\nכשאתה כותב שתיקנת משהו, תצרף את הפריים של הרגע שתוקן.", "note": "", "html": "<div class=\"pl\" dir=\"rtl\">אתה לא צופה בווידאו, אז כל בדיקה שלך נעשית על פריימים.<\/div>\n<div class=\"pl\" dir=\"rtl\">אחרי כל רינדור תוציא פריים בכל רגע חשוב (כל כניסה של טקסט, כל אפקט וכל חיתוך), ותסתכל עליהם ברזולוציה מלאה.<\/div>\n<div class=\"pl\" dir=\"rtl\">סביב כל מעבר תוציא גם רצועה של פריים כל 0.1 שנייה, כדי לתפוס דברים שקופצים או קופאים.<\/div>\n<div class=\"pl\" dir=\"rtl\">בכל פריים תבדוק טקסט חתוך או בכיוון הלא נכון, משהו שמסתיר את הפנים, וחורים או קצוות בשכבות.<\/div>\n<div class=\"pl\" dir=\"rtl\">בדיקה אוטומטית שעברה לא מוכיחה שמשהו באמת על המסך, ולכן תמיד מסתכלים על הפריים עצמו.<\/div>\n<div class=\"pl\" dir=\"rtl\">כשאתה כותב שתיקנת משהו, תצרף את הפריים של הרגע שתוקן.<\/div>"}, "links": []}, {"id": "t73", "num": "7.3", "title": "מבקר עצמאי, עד שהציון עובר 90", "t": 833.72, "see": "מד ציון שעולה <span class=\"nb\">מ-68<\/span> בסבב הראשון <span class=\"nb\">ל-96<\/span> בסבב השביעי. הסבבים שבאמצע מסומנים כנקודות בלי מספרים, כי במדריך אין אותם. תגיות המחוון: ביצוע · גימור · תנועה · טקסט ועברית · התאמה לסגנון · היגיון פיזי. כלל העצירה: &quot;אחרי שני סבבים עדיין לא עבר את 70? עוצרים ומביאים את הפער.&quot;", "exp": "מי שבנה את הסרטון הכי פחות מתאים לבקר אותו, וזה נכון גם לקלוד. מבקר עצמאי הוא עותק נפרד של קלוד שלא בנה כלום. הוא מקבל את הבקשה ופריימים מכל סצנה, בלי ההסברים, ונותן ציון מתוך 100 עם תיקון במספרים לכל פגם.", "fact": "<span class=\"nb\">מ-68<\/span> <span class=\"nb\">ל-96<\/span> · ריל אנימציה של 47 שניות, בשבעה סבבים של אותו מבקר. · גם הסצנות בסרטון הזה עברו מבקר עצמאי.", "tip": "", "prompt": {"n": 21, "text": "תפעיל סוכן נפרד שלא בנה את הסרטון, בתור מבקר קשוח של סטודיו לאנימציה.\nתן לו את הבריף, פריים מכל סצנה ורצועת פריימים מכל מעבר, בלי ההסברים שלך.\nהוא נותן ציון מתוך 100 לפי מחוון קבוע: ביצוע של כל מה שביקשתי, גימור, תנועה, טקסט ועברית, התאמה לסגנון, והיגיון פיזי.\nלכל סצנה הוא מחזיר רשימת פגמים, ולכל פגם זמן, מה לא בסדר ותיקון עם מספרים.\nאתה מתקן, ואותו מבקר בודק שוב, עד שהציון עובר 90.\nאם אחרי שני סבבים הציון עדיין רחוק מ-90 ב-20 נקודות או יותר, תעצור ותביא לי את הפער ואת האפשרויות במקום לפתוח עוד סבבים.", "note": "", "html": "<div class=\"pl\" dir=\"rtl\">תפעיל סוכן נפרד שלא בנה את הסרטון, בתור מבקר קשוח של סטודיו לאנימציה.<\/div>\n<div class=\"pl\" dir=\"rtl\">תן לו את הבריף, פריים מכל סצנה ורצועת פריימים מכל מעבר, בלי ההסברים שלך.<\/div>\n<div class=\"pl\" dir=\"rtl\">הוא נותן ציון מתוך 100 לפי מחוון קבוע: ביצוע של כל מה שביקשתי, גימור, תנועה, טקסט ועברית, התאמה לסגנון, והיגיון פיזי.<\/div>\n<div class=\"pl\" dir=\"rtl\">לכל סצנה הוא מחזיר רשימת פגמים, ולכל פגם זמן, מה לא בסדר ותיקון עם מספרים.<\           lb.appendChild(ul); b.appendChild(lb);
        }
        var jb = el("button", "copy", "צפייה בנושא בסרטון"); jb.type = "button"; jb.style.justifySelf = "start"; jb.style.background = "var(--panel2)"; jb.style.color = "var(--ink)";
        jb.addEventListener("click", function () { jump(it.t); });
        b.appendChild(jb);
        x.appendChild(b);
        list.appendChild(x);
        items.push({ t: it.t, node: x, label: (it.num ? it.num + " · " : "") + it.title });
      });
      d.appendChild(list);
      root.appendChild(d);
    });
  }
  buildToc(document.getElementById("toc"));
  buildToc(document.getElementById("toc2"));

  // community
  var C = DATA.community || {};
  ["comm", "comm2"].forEach(function (id) {
    if (!C.whatsapp && !C.facebook) return;
    var c = document.getElementById(id); c.hidden = false;
    c.appendChild(el("h2", null, "בואו להמשיך יחד"));
    c.appendChild(el("p", null, "שאלות, פרומפטים חדשים ועדכונים על עריכת וידאו עם Claude, בקבוצה ובקהילה."));
    var bt = el("div", "cbtns");
    if (C.whatsapp) { var a = el("a", "cbtn wa"); a.href = C.whatsapp; a.target = "_blank"; a.rel = "noopener"; a.innerHTML = WA; a.appendChild(el("span", null, "קבוצת הוואטסאפ")); bt.appendChild(a); }
    if (C.facebook) { var f = el("a", "cbtn fb"); f.href = C.facebook; f.target = "_blank"; f.rel = "noopener"; f.innerHTML = FB; f.appendChild(el("span", null, "קהילת הפייסבוק")); bt.appendChild(f); }
    c.appendChild(bt);
  });
  var openC = document.getElementById("openC");
  if (C.whatsapp || C.facebook) { openC.hidden = false; openC.addEventListener("click", function () { openDrawer(); setTimeout(function () { document.getElementById("comm2").scrollIntoView({ behavior: "smooth" }); }, 300); }); }

  // drawer
  var openD = document.getElementById("openD");
  function openDrawer() { drawer.classList.add("show"); openD.setAttribute("aria-expanded", "true"); document.body.style.overflow = "hidden";
    var on = drawer.querySelector(".it.on"); if (on) { on.closest(".ch").open = true; setTimeout(function () { on.scrollIntoView({ block: "center" }); }, 280); } }
  function closeDrawer() { drawer.classList.remove("show"); openD.setAttribute("aria-expanded", "false"); document.body.style.overflow = ""; }
  openD.addEventListener("click", openDrawer);
  document.getElementById("closeD").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeDrawer(); });

  // current topic
  var now = document.getElementById("now"), cur = -1;
  var order = items.slice(0, items.length / 2);
  v.addEventListener("timeupdate", function () {
    var t = v.currentTime, k = 0;
    for (var i = 0; i < order.length; i++) if (order[i].t <= t + 0.01) k = i;
    if (k === cur) return;
    items.forEach(function (x) { x.node.classList.remove("on"); });
    items[k].node.classList.add("on"); items[k + order.length].node.classList.add("on");
    now.textContent = "עכשיו: " + order[k].label; cur = k;
  });

  // player
  var text = PLAYLIST.replace(/^(?!#)(\S+)$/gm, function (m) { return new URL("v/" + m, location.href).href; })
                     .replace(/URI="([^"]+)"/g, function (m, u) { return 'URI="' + new URL("v/" + u, location.href).href + '"'; });
  var src = URL.createObjectURL(new Blob([text], { type: "application/vnd.apple.mpegurl" }));
  function fail(msg) { var e = el("div", "err", msg); document.querySelector(".film").appendChild(e); }
  if (window.Hls && Hls.isSupported()) {
    var hls = new Hls({ maxBufferLength: 30 }); hls.loadSource(src); hls.attachMedia(v);
    hls.on(Hls.Events.ERROR, function (e, d) { if (d && d.fatal) fail("הסרטון לא נטען. נסו לרענן את הדף."); });
  } else if (v.canPlayType("application/vnd.apple.mpegurl")) {
    v.src = "v/index.m3u8";
  } else { fail("הדפדפן הזה לא תומך בנגן. נסו Chrome, Safari, Edge או Firefox עדכני."); }
})();
</script>
</body>
</html>
